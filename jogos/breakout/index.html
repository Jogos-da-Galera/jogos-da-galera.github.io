<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tijolinho 🧱</title>
  <style>
    :root {
      --bg: #120821;
      --primary: #a855f7;
      --accent: #e879f9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(800px 400px at 50% -20%, #3b1a6e 0%, var(--bg) 60%);
      color: #f5f0ff;
      font-family: "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 14px;
      padding: 16px;
      user-select: none;
    }
    h1 {
      font-size: 1.7rem;
      background: linear-gradient(90deg, var(--accent), var(--primary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    #hud {
      display: flex;
      gap: 24px;
      font-weight: 700;
      font-size: 1.1rem;
    }
    #hud span { color: var(--accent); }
    #wrap { position: relative; }
    canvas {
      border: 3px solid var(--primary);
      border-radius: 12px;
      background: #1a0d2e;
      box-shadow: 0 10px 30px rgba(139, 47, 240, 0.4);
      max-width: 100%;
      touch-action: none;
      display: block;
      cursor: none;
    }
    #hint { color: #b9a8d9; font-size: 0.95rem; text-align: center; max-width: 520px; }
    /* Overlay (início / pausa / fim) */
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      background: rgba(10, 4, 20, 0.8);
      border-radius: 10px;
      text-align: center;
      padding: 16px;
    }
    #overlay.hidden { display: none; }
    #overlay h2 { font-size: 1.7rem; color: var(--accent); }
    #overlay p { color: #d9cdf0; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>🧱 Tijolinho</h1>
  <div id="hud">
    Pontos: <span id="score">0</span>
    Recorde: <span id="high">0</span>
    Vidas: <span id="lives">❤️❤️❤️</span>
  </div>
  <div id="wrap">
    <canvas id="game" width="480" height="600"></canvas>
    <div id="overlay">
      <h2 id="overlayTitle">🧱 Tijolinho</h2>
      <p id="overlayText">Destrua todos os tijolos!</p>
    </div>
  </div>
  <p id="hint">Mouse, toque ou ← → para mover a raquete · Espaço/Enter para lançar a bolinha · P pausa · R reinicia</p>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const highEl = document.getElementById("high");
    const livesEl = document.getElementById("lives");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayText = document.getElementById("overlayText");

    const W = canvas.width, H = canvas.height;

    // Recorde (localStorage pode não estar disponível no iframe sandboxed)
    const store = (() => {
      try { localStorage.getItem("test"); return localStorage; } catch (e) { return null; }
    })();
    const HIGH_KEY = "breakout-high";
    let high = Number(store?.getItem(HIGH_KEY) || 0);

    // Constantes
    const PADDLE_W = 90, PADDLE_H = 14, PADDLE_Y = H - 40;
    const BALL_R = 7;
    const BASE_SPEED = 320;      // px/s
    const MAX_SPEED = 640;
    const ROWS = 5, COLS = 8;
    const BRICK_GAP = 6, BRICK_TOP = 60, BRICK_SIDE = 12;
    const BRICK_W = (W - BRICK_SIDE * 2 - BRICK_GAP * (COLS - 1)) / COLS;
    const BRICK_H = 22;
    // Paleta vibrante por linha (estilo clássico, cores livres)
    const ROW_COLORS = [
      ["#f87171", "#dc2626"],
      ["#fb923c", "#ea580c"],
      ["#facc15", "#ca8a04"],
      ["#34d399", "#059669"],
      ["#38bdf8", "#0284c7"],
    ];

    // Estado
    let paddle, ball, bricks, particles, popups;
    let score, lives, level, speed, state, lastTime;
    // state: "ready" (bolinha na raquete) | "play" | "over" | "paused"

    function resetBricks() {
      bricks = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          bricks.push({
            x: BRICK_SIDE + c * (BRICK_W + BRICK_GAP),
            y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
            row: r,
            alive: true,
          });
        }
      }
    }

    function resetBall() {
      if (!paddle) paddle = { x: W / 2 - PADDLE_W / 2 };
      paddle.x = W / 2 - PADDLE_W / 2;
      ball = {
        x: W / 2,
        y: PADDLE_Y - BALL_R - 1,
        dx: (Math.random() < 0.5 ? -1 : 1) * (Math.random() * 0.5 + 0.3),
        dy: -1,
        stuck: true,
      };
      // normaliza o vetor
      const m = Math.hypot(ball.dx, ball.dy);
      ball.dx /= m; ball.dy /= m;
    }

    function reset() {
      score = 0; lives = 3; level = 1; speed = BASE_SPEED;
      particles = []; popups = [];
      resetBricks();
      resetBall();
      state = "ready";
      overlay.classList.add("hidden");
      updateHud();
      draw();
    }

    function launch() {
      if (state !== "ready") return;
      ball.stuck = false;
      state = "play";
      hideOverlay();
    }

    function updateHud() {
      scoreEl.textContent = score;
      highEl.textContent = Math.max(high, score);
      livesEl.textContent = "❤️".repeat(lives) || "—";
    }

    function loseLife() {
      lives--;
      updateHud();
      if (lives <= 0) {
        gameOver();
      } else {
        speed = BASE_SPEED + (level - 1) * 60;
        resetBall();
        state = "ready";
        showOverlay("💔 Quase!", "Espaço ou toque para lançar a bolinha");
      }
    }

    function gameOver() {
      state = "over";
      if (score > high) {
        high = score;
        try { store?.setItem(HIGH_KEY, high); } catch (e) {}
      }
      updateHud();
      showOverlay("🏁 Fim de jogo!", `Pontos: ${score} — clique, espaço ou R para reiniciar`);
    }

    function nextLevel() {
      level++;
      speed = BASE_SPEED + (level - 1) * 60;
      score += 500; // bônus de fase
      resetBricks();
      resetBall();
      state = "ready";
      updateHud();
      showOverlay(`🎉 Nível ${level}!`, "A bola ficou mais rápida... boa sorte! Espaço para lançar");
    }

    function showOverlay(title, text) {
      overlayTitle.textContent = title;
      overlayText.textContent = text;
      overlay.classList.remove("hidden");
    }
    function hideOverlay() { overlay.classList.add("hidden"); }

    function brickHit(brick) {
      brick.alive = false;
      const pts = (ROWS - brick.row) * 10 + 10; // linhas de cima valem mais
      score += pts;
      updateHud();
      // popup de pontos
      popups.push({ x: brick.x + BRICK_W / 2, y: brick.y + BRICK_H / 2, text: "+" + pts, t: 0, dur: 700 });
      // partículas coloridas
      const [c1] = ROW_COLORS[brick.row];
      for (let i = 0; i < 8; i++) {
        const a = Math.random() * Math.PI * 2;
        const v = 60 + Math.random() * 120;
        particles.push({
          x: brick.x + BRICK_W / 2,
          y: brick.y + BRICK_H / 2,
          dx: Math.cos(a) * v,
          dy: Math.sin(a) * v,
          t: 0,
          dur: 500 + Math.random() * 300,
          color: c1,
        });
      }
      // acelera um pouquinho a cada tijolo (com teto)
      speed = Math.min(MAX_SPEED, speed + 2);
    }

    function update(dt) {
      // movimento da raquete por teclado
      if (state === "play" || state === "ready") {
        const v = 420 * dt;
        if (keys.left) paddle.x = Math.max(0, paddle.x - v);
        if (keys.right) paddle.x = Math.min(W - PADDLE_W, paddle.x + v);
      }
      if (state === "ready") {
        ball.x = paddle.x + PADDLE_W / 2;
        ball.y = PADDLE_Y - BALL_R - 1;
        return;
      }
      if (state !== "play") return;

      // move a bola
      ball.x += ball.dx * speed * dt;
      ball.y += ball.dy * speed * dt;

      // paredes
      if (ball.x < BALL_R) { ball.x = BALL_R; ball.dx = Math.abs(ball.dx); }
      if (ball.x > W - BALL_R) { ball.x = W - BALL_R; ball.dx = -Math.abs(ball.dx); }
      if (ball.y < BALL_R) { ball.y = BALL_R; ball.dy = Math.abs(ball.dy); }

      // chão = perdeu vida
      if (ball.y > H + BALL_R) {
        loseLife();
        return;
      }

      // raquete
      if (
        ball.dy > 0 &&
        ball.y + BALL_R >= PADDLE_Y &&
        ball.y + BALL_R <= PADDLE_Y + PADDLE_H + 10 &&
        ball.x >= paddle.x - BALL_R &&
        ball.x <= paddle.x + PADDLE_W + BALL_R
      ) {
        // ângulo depende de onde bateu na raquete
        const rel = (ball.x - (paddle.x + PADDLE_W / 2)) / (PADDLE_W / 2);
        const angle = rel * (Math.PI / 3); // até 60°
        ball.dx = Math.sin(angle);
        ball.dy = -Math.cos(angle);
        ball.y = PADDLE_Y - BALL_R;
        // pequeno boost a cada rebote
        speed = Math.min(MAX_SPEED, speed + 4);
      }

      // tijolos
      for (const b of bricks) {
        if (!b.alive) continue;
        // testa colisão bola x retângulo (aproximação por círculo)
        const cx = Math.max(b.x, Math.min(ball.x, b.x + BRICK_W));
        const cy = Math.max(b.y, Math.min(ball.y, b.y + BRICK_H));
        const ddx = ball.x - cx, ddy = ball.y - cy;
        if (ddx * ddx + ddy * ddy <= BALL_R * BALL_R) {
          brickHit(b);
          // decide eixo do quique pelo lado da penetração
          const fromSide = Math.abs(ddx) > Math.abs(ddy);
          if (fromSide) {
            ball.dx = ddx > 0 ? Math.abs(ball.dx) : -Math.abs(ball.dx);
          } else {
            ball.dy = ddy > 0 ? Math.abs(ball.dy) : -Math.abs(ball.dy);
          }
          // renormaliza pra manter a direção unitária
          const m = Math.hypot(ball.dx, ball.dy) || 1;
          ball.dx /= m; ball.dy /= m;
          break; // 1 tijolo por frame
        }
      }

      // fase completa?
      if (bricks.every((b) => !b.alive)) {
        nextLevel();
        return;
      }

      // partículas e popups
      for (const p of particles) {
        p.t += dt * 1000;
        p.x += p.dx * dt;
        p.y += p.dy * dt;
        p.dy += 300 * dt; // gravidade
      }
      particles = particles.filter((p) => p.t < p.dur);
      for (const p of popups) p.t += dt * 1000;
      popups = popups.filter((p) => p.t < p.dur);
    }

    function roundRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // fundo com leve gradiente
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, "#1a0d2e");
      bg.addColorStop(1, "#120821");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // nível
      ctx.fillStyle = "#b9a8d9";
      ctx.font = "bold 14px 'Segoe UI', sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("Nível " + level, 12, 24);

      // tijolos
      for (const b of bricks) {
        if (!b.alive) continue;
        const [c1, c2] = ROW_COLORS[b.row];
        const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + BRICK_H);
        g.addColorStop(0, c1);
        g.addColorStop(1, c2);
        ctx.fillStyle = g;
        roundRect(ctx, b.x, b.y, BRICK_W, BRICK_H, 5);
        ctx.fill();
        // brilho no topo
        ctx.fillStyle = "rgba(255,255,255,0.3)";
        roundRect(ctx, b.x + 2, b.y + 2, BRICK_W - 4, 5, 3);
        ctx.fill();
      }

      // partículas
      for (const p of particles) {
        ctx.globalAlpha = 1 - p.t / p.dur;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      }
      ctx.globalAlpha = 1;

      // raquete
      const pg = ctx.createLinearGradient(paddle.x, 0, paddle.x + PADDLE_W, 0);
      pg.addColorStop(0, "#7c3aed");
      pg.addColorStop(0.5, "#e879f9");
      pg.addColorStop(1, "#7c3aed");
      ctx.fillStyle = pg;
      roundRect(ctx, paddle.x, PADDLE_Y, PADDLE_W, PADDLE_H, 7);
      ctx.fill();

      // bolinha
      if (state === "play" || state === "ready") {
        const bg2 = ctx.createRadialGradient(
          ball.x - 2, ball.y - 2, 1,
          ball.x, ball.y, BALL_R
        );
        bg2.addColorStop(0, "#ffffff");
        bg2.addColorStop(1, "#e879f9");
        ctx.fillStyle = bg2;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
        ctx.fill();
      }

      // popups de pontos
      for (const p of popups) {
        const k = p.t / p.dur;
        ctx.globalAlpha = 1 - k;
        ctx.fillStyle = "#facc15";
        ctx.font = "bold 14px 'Segoe UI', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(p.text, p.x, p.y - k * 24);
      }
      ctx.globalAlpha = 1;
    }

    function loop(time) {
      if (!lastTime) lastTime = time;
      const dt = Math.min((time - lastTime) / 1000, 0.033);
      lastTime = time;
      if (state !== "paused" && state !== "over") {
        update(dt);
        draw();
      }
      requestAnimationFrame(loop);
    }

    // ----- Controles -----

    function movePaddleTo(clientX) {
      const rect = canvas.getBoundingClientRect();
      const x = ((clientX - rect.left) / rect.width) * W;
      paddle.x = Math.max(0, Math.min(W - PADDLE_W, x - PADDLE_W / 2));
    }

    canvas.addEventListener("mousemove", (e) => movePaddleTo(e.clientX));
    canvas.addEventListener("touchmove", (e) => {
      e.preventDefault();
      movePaddleTo(e.touches[0].clientX);
    }, { passive: false });
    canvas.addEventListener("touchstart", (e) => {
      movePaddleTo(e.touches[0].clientX);
      if (state === "ready") launch();
    }, { passive: true });
    canvas.addEventListener("mousedown", () => { if (state === "ready") launch(); });

    // O overlay fica por cima do canvas: precisa de toque/clique próprio
    overlay.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (state === "over") reset();
      else if (state === "paused") { state = "play"; lastTime = null; hideOverlay(); }
      else launch();
    });

    let keys = { left: false, right: false };
    document.addEventListener("keydown", (e) => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") { keys.left = true; e.preventDefault(); }
      else if (e.code === "ArrowRight" || e.code === "KeyD") { keys.right = true; e.preventDefault(); }
      else if (e.code === "Space" || e.code === "Enter") {
        e.preventDefault();
        if (state === "over") reset();
        else launch();
      } else if (e.code === "KeyP") {
        if (state === "play" || state === "ready") {
          state = "paused";
          showOverlay("⏸ Pausado", "Pressione P para continuar");
        } else if (state === "paused") {
          state = "play";
          lastTime = null;
          hideOverlay();
        }
      } else if (e.code === "KeyR") {
        reset();
      }
    });
    document.addEventListener("keyup", (e) => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
      if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
    });

    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
