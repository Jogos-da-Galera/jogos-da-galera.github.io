<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sudoku</title>
<style>
  :root {
    --bg: #1a1333;
    --panel: #241a44;
    --cell: #2e2258;
    --cell-selected: #4a3580;
    --cell-same: #3a2c68;
    --line: #443476;
    --line-thick: #7a5fc7;
    --text: #e8e2ff;
    --muted: #9d8fd0;
    --accent: #9d6bff;
    --error: #ff5d7a;
    --good: #4cd6a0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 10px;
    user-select: none;
  }
  h1 {
    font-size: 22px;
    margin: 4px 0 8px;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #b58cff, #7c5cff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .topbar {
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .topbar b { color: var(--text); font-variant-numeric: tabular-nums; }
  #grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    width: min(92vw, 420px);
    aspect-ratio: 1;
    border: 2px solid var(--line-thick);
    border-radius: 8px;
    overflow: hidden;
    background: var(--line-thick);
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--cell);
    font-size: clamp(16px, 5vw, 26px);
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--line);
    transition: background .08s;
  }
  .cell.given { color: #fff; }
  .cell.user { color: #c9aaff; }
  .cell.error { color: var(--error); background: #4a2340; }
  .cell.same { background: var(--cell-same); }
  .cell.selected { background: var(--cell-selected); }
  .cell.hint { color: var(--good); }
  .cell.pop { animation: pop .2s; }
  @keyframes pop { 50% { transform: scale(1.3); } }
  .keypad {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 4px;
    width: min(92vw, 420px);
    margin-top: 10px;
  }
  .key {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: clamp(14px, 4vw, 20px);
    font-weight: 700;
    border-radius: 8px;
    padding: 10px 0;
    cursor: pointer;
    font-family: inherit;
  }
  .key:active { background: var(--accent); transform: scale(.94); }
  .key.done { opacity: .25; }
  .controls {
    display: flex;
    gap: 8px;
    width: min(92vw, 420px);
    margin-top: 8px;
    justify-content: space-between;
  }
  .btn {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .btn:active { background: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .diff {
    display: flex;
    gap: 4px;
  }
  .diff .btn { padding: 8px 10px; font-size: 13px; }
  .diff .btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toast {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
  }
  .toast.show { opacity: 1; }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 5, 25, .85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #overlay.show { display: flex; }
  .card {
    background: var(--panel);
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 28px 36px;
    text-align: center;
    animation: pop .3s;
  }
  .card h2 { font-size: 26px; margin-bottom: 8px; }
  .card p { color: var(--muted); margin-bottom: 18px; }
  .card .btn { margin-top: 6px; }
  .record { color: var(--good); font-weight: 700; }
</style>
</head>
<body>
  <h1>🧩 SUDOKU</h1>
  <div class="topbar">
    <span>⏱ <b id="timer">00:00</b></span>
    <span>💡 <b id="hints">3</b></span>
    <span>🏆 <b id="best">—</b></span>
  </div>
  <div id="grid"></div>
  <div class="keypad" id="keypad"></div>
  <div class="controls">
    <button class="btn" id="btnErase">⌫ Apagar</button>
    <button class="btn" id="btnHint">💡 Dica</button>
    <div class="diff" id="diff">
      <button class="btn" data-d="facil">😊</button>
      <button class="btn active" data-d="medio">😎</button>
      <button class="btn" data-d="dificil">🤯</button>
    </div>
    <button class="btn primary" id="btnNew">Novo</button>
  </div>
  <div class="toast" id="toast"></div>
  <div id="overlay">
    <div class="card">
      <h2>🎉 Você venceu!</h2>
      <p id="winStats"></p>
      <button class="btn primary" id="btnAgain">Jogar de novo</button>
    </div>
  </div>

<script>
"use strict";
const SIZE = 9;
const DIFFS = {
  facil:   { given: 40, label: "Fácil" },
  medio:   { given: 32, label: "Médio" },
  dificil: { given: 27, label: "Difícil" },
};
let difficulty = "medio";
let solution = [];   // 81
let givens = [];     // 81 (0 ou dado)
let board = [];      // 81 (digitos atuais)
let hintsUsed = [];  // 81
let selected = -1;
let elapsed = 0, timerId = null, playing = false;

const gridEl = document.getElementById("grid");
const keypadEl = document.getElementById("keypad");
const timerEl = document.getElementById("timer");
const hintsEl = document.getElementById("hints");
const bestEl = document.getElementById("best");
const toastEl = document.getElementById("toast");
const overlayEl = document.getElementById("overlay");
const winStatsEl = document.getElementById("winStats");

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function canPlace(g, pos, v) {
  const r = (pos / 9) | 0, c = pos % 9;
  for (let i = 0; i < 9; i++) {
    if (g[r * 9 + i] === v || g[i * 9 + c] === v) return false;
  }
  const br = (r / 3 | 0) * 3, bc = (c / 3 | 0) * 3;
  for (let i = 0; i < 3; i++)
    for (let j = 0; j < 3; j++)
      if (g[(br + i) * 9 + bc + j] === v) return false;
  return true;
}
function fillGrid(g) {
  let pos = -1;
  for (let i = 0; i < 81; i++) if (g[i] === 0) { pos = i; break; }
  if (pos === -1) return true;
  for (const v of shuffle([...Array(9)].map((_, i) => i + 1))) {
    if (canPlace(g, pos, v)) {
      g[pos] = v;
      if (fillGrid(g)) return true;
      g[pos] = 0;
    }
  }
  return false;
}
function newGame() {
  solution = new Array(81).fill(0);
  fillGrid(solution);
  givens = new Array(81).fill(0);
  const target = DIFFS[difficulty].given;
  let placed = 0;
  for (const pos of shuffle([...Array(81)].map((_, i) => i))) {
    if (placed >= target) break;
    givens[pos] = solution[pos];
    placed++;
  }
  board = givens.slice();
  hintsUsed = new Array(81).fill(false);
  selected = -1;
  elapsed = 0;
  hintsEl.textContent = "3";
  playing = true;
  overlayEl.classList.remove("show");
  updateBestLabel();
  render();
  startTimer();
}
function startTimer() {
  clearInterval(timerId);
  timerId = setInterval(() => {
    if (!playing) return;
    elapsed++;
    timerEl.textContent = fmtTime(elapsed);
  }, 1000);
}
function fmtTime(s) {
  const m = (s / 60 | 0).toString().padStart(2, "0");
  return m + ":" + (s % 60).toString().padStart(2, "0");
}
function bestKey() { return "sudoku-best-" + difficulty; }
function getBest() {
  const v = localStorage.getItem(bestKey());
  return v === null ? null : +v;
}
function updateBestLabel() {
  const b = getBest();
  bestEl.textContent = b === null ? "—" : fmtTime(b);
}
function isGiven(i) { return givens[i] !== 0; }
function render() {
  const selectedVal = selected >= 0 ? board[selected] : 0;
  let html = "";
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const i = r * 9 + c;
      const v = board[i];
      let cls = "cell";
      if (isGiven(i)) cls += " given";
      else if (v) cls += " user" + (hintsUsed[i] ? " hint" : "");
      if (v && !isGiven(i) && !canPlace(board, i, v)) cls += " error";
      if (selected >= 0 && board[selected] && v === selectedVal && i !== selected) cls += " same";
      if (i === selected) cls += " selected";
      html += `<div class="${cls}" data-i="${i}">${v || ""}</div>`;
    }
  }
  gridEl.innerHTML = html;
  // teclado: marca os numeros que já tem 9 no tabuleiro
  const counts = new Array(10).fill(0);
  for (let i = 0; i < 81; i++) counts[board[i]]++;
  for (const btn of keypadEl.children) {
    const n = +btn.dataset.n;
    btn.classList.toggle("done", counts[n] >= 9);
  }
}
function select(i) {
  selected = i;
  render();
}
function place(n) {
  if (!playing || selected < 0 || isGiven(selected)) return;
  board[selected] = n;
  hintsUsed[selected] = false;
  render();
  if (n === 0 && selected < 80) selected = selected + 1;
  checkWin();
}
function moveSel(dr, dc) {
  if (!playing) return;
  if (selected < 0) { selected = 0; }
  else {
    let r = (selected / 9 | 0) + dr;
    let c = selected % 9 + dc;
    if (r < 0 || r > 8 || c < 0 || c > 8) return;
    selected = r * 9 + c;
  }
  render();
}
function useHint() {
  if (!playing) return;
  const hintsLeft = 3 - countHints();
  if (hintsLeft <= 0) { toast("Sem dicas! 💨"); return; }
  let pos = selected;
  if (pos < 0 || isGiven(pos) || board[pos] === solution[pos]) {
    const wrong = [];
    for (let i = 0; i < 81; i++)
      if (!isGiven(i) && board[i] !== solution[i]) wrong.push(i);
    if (!wrong.length) { toast("Tudo certo por aqui 😉"); return; }
    pos = wrong[Math.floor(Math.random() * wrong.length)];
  } else {
    board[pos] = 0;
  }
  hintsUsed[pos] = true;
  board[pos] = solution[pos];
  selected = pos;
  hintsEl.textContent = 3 - countHints();
  render();
  checkWin();
}
function countHints() { return hintsUsed.filter(Boolean).length; }
function checkWin() {
  if (!playing) return;
  if (board.every((v, i) => v === solution[i])) {
    playing = false;
    const record = getBest() === null || elapsed < getBest();
    if (record) localStorage.setItem(bestKey(), elapsed);
    updateBestLabel();
    winStatsEl.innerHTML =
      `Tempo: <b>${fmtTime(elapsed)}</b> · ${DIFFS[difficulty].label}<br>` +
      (record ? '<span class="record">⭐ Novo recorde!</span>' : "");
    setTimeout(() => overlayEl.classList.add("show"), 250);
  }
}
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
}

// eventos
gridEl.addEventListener("click", (e) => {
  const cell = e.target.closest(".cell");
  if (cell) select(+cell.dataset.i);
});
keypadEl.innerHTML = Array.from({ length: 9 }, (_, i) =>
  `<button class="key" data-n="${i + 1}">${i + 1}</button>`).join("");
keypadEl.addEventListener("click", (e) => {
  const b = e.target.closest(".key");
  if (b) place(+b.dataset.n);
});
document.getElementById("btnErase").onclick = () => place(0);
document.getElementById("btnHint").onclick = useHint;
document.getElementById("btnNew").onclick = () => { newGame(); };
document.getElementById("btnAgain").onclick = () => { newGame(); };
document.getElementById("diff").addEventListener("click", (e) => {
  const b = e.target.closest(".btn");
  if (!b) return;
  difficulty = b.dataset.d;
  for (const x of document.querySelectorAll("#diff .btn"))
    x.classList.toggle("active", x === b);
  newGame();
});
document.addEventListener("keydown", (e) => {
  if (overlayEl.classList.contains("show")) {
    if (e.key === "Enter" || e.key === " ") newGame();
    return;
  }
  if (e.key >= "1" && e.key <= "9") place(+e.key);
  else if (e.key === "Backspace" || e.key === "Delete" || e.key === "0") { e.preventDefault(); place(0); }
  else if (e.key === "ArrowUp") { e.preventDefault(); moveSel(-1, 0); }
  else if (e.key === "ArrowDown") { e.preventDefault(); moveSel(1, 0); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); moveSel(0, -1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); moveSel(0, 1); }
  else if (e.key === "h" || e.key === "H") useHint();
});
// swipe no grid
let touchStart = null;
gridEl.addEventListener("touchstart", (e) => {
  touchStart = [e.touches[0].clientX, e.touches[0].clientY];
}, { passive: true });
gridEl.addEventListener("touchend", (e) => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart[0];
  const dy = e.changedTouches[0].clientY - touchStart[1];
  touchStart = null;
  if (Math.hypot(dx, dy) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) moveSel(0, dx > 0 ? 1 : -1);
  else moveSel(dy > 0 ? 1 : -1, 0);
});

newGame();
</script>
</body>
</html>
