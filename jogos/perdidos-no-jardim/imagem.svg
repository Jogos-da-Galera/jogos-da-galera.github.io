<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
  <defs>
    <radialGradient id="ship" cx="40%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#ff8a80"/>
      <stop offset="60%" stop-color="#e05252"/>
      <stop offset="100%" stop-color="#a83232"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd54f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffd54f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Grama -->
  <rect width="480" height="300" fill="#5cb648"/>
  <ellipse cx="90" cy="60" rx="120" ry="60" fill="#ffffff" opacity="0.06"/>
  <ellipse cx="400" cy="250" rx="140" ry="70" fill="#003c00" opacity="0.06"/>
  <!-- Tufos de capim -->
  <g stroke="#4ca33b" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M40 260 q2 -8 6 -12"/><path d="M46 260 q0 -9 3 -14"/>
    <path d="M150 40 q2 -8 6 -12"/><path d="M156 40 q0 -9 3 -14"/>
    <path d="M430 90 q2 -8 6 -12"/><path d="M436 90 q0 -9 3 -14"/>
    <path d="M300 280 q2 -8 6 -12"/><path d="M306 280 q0 -9 3 -14"/>
  </g>
  <!-- Flores -->
  <g>
    <g transform="translate(70 90)">
      <circle cx="0" cy="-5" r="4" fill="#fff"/><circle cx="5" cy="-1" r="4" fill="#fff"/>
      <circle cx="3" cy="4" r="4" fill="#fff"/><circle cx="-3" cy="4" r="4" fill="#fff"/>
      <circle cx="-5" cy="-1" r="4" fill="#fff"/><circle r="3" fill="#fbbf24"/>
    </g>
    <g transform="translate(420 190) scale(0.8)">
      <circle cx="0" cy="-5" r="4" fill="#f9a8d4"/><circle cx="5" cy="-1" r="4" fill="#f9a8d4"/>
      <circle cx="3" cy="4" r="4" fill="#f9a8d4"/><circle cx="-3" cy="4" r="4" fill="#f9a8d4"/>
      <circle cx="-5" cy="-1" r="4" fill="#f9a8d4"/><circle r="3" fill="#fbbf24"/>
    </g>
    <g transform="translate(230 50) scale(0.7)">
      <circle cx="0" cy="-5" r="4" fill="#c4b5fd"/><circle cx="5" cy="-1" r="4" fill="#c4b5fd"/>
      <circle cx="3" cy="4" r="4" fill="#c4b5fd"/><circle cx="-3" cy="4" r="4" fill="#c4b5fd"/>
      <circle cx="-5" cy="-1" r="4" fill="#c4b5fd"/><circle r="3" fill="#fbbf24"/>
    </g>
  </g>

  <!-- Nave mãe (cebola) -->
  <ellipse cx="380" cy="150" rx="80" ry="80" fill="url(#glow)"/>
  <circle cx="380" cy="150" r="66" fill="none" stroke="#ffd54f" stroke-width="3" stroke-dasharray="12 10"/>
  <ellipse cx="380" cy="205" rx="42" ry="12" fill="#000" opacity="0.25"/>
  <g transform="translate(380 150)">
    <ellipse cx="-10" cy="-62" rx="5" ry="16" fill="#66bb6a" stroke="#33691e" stroke-width="2" transform="rotate(-25 -10 -62)"/>
    <ellipse cx="0" cy="-64" rx="5" ry="17" fill="#66bb6a" stroke="#33691e" stroke-width="2"/>
    <ellipse cx="10" cy="-62" rx="5" ry="16" fill="#66bb6a" stroke="#33691e" stroke-width="2" transform="rotate(25 10 -62)"/>
    <path d="M0 -50 C26 -44 40 -24 40 2 C40 28 24 40 0 40 C-24 40 -40 28 -40 2 C-40 -24 -26 -44 0 -50 Z"
          fill="url(#ship)" stroke="#7f2222" stroke-width="3"/>
    <path d="M-30 28 Q0 40 30 28" fill="none" stroke="#7f2222" stroke-width="2" opacity="0.45"/>
    <path d="M-24 12 Q0 24 24 12" fill="none" stroke="#7f2222" stroke-width="2" opacity="0.45"/>
    <ellipse cx="-16" cy="-14" rx="8" ry="16" fill="#fff" opacity="0.35" transform="rotate(25 -16 -14)"/>
    <circle cx="0" cy="-6" r="9" fill="#fff9c4" stroke="#7f2222" stroke-width="2"/>
    <line x1="0" y1="-15" x2="0" y2="3" stroke="#7f2222" stroke-width="2"/>
    <line x1="-9" y1="-6" x2="9" y2="-6" stroke="#7f2222" stroke-width="2"/>
  </g>

  <!-- Frutas -->
  <g font-family="serif" font-size="28" text-anchor="middle">
    <text x="120" y="150">🍓</text>
    <text x="220" y="230">🍇</text>
    <text x="320" y="80">🍎</text>
  </g>

  <!-- Pikmins -->
  <!-- Azul (boquinha retangular) -->
  <g transform="translate(90 230)">
    <ellipse cx="1" cy="6" rx="14" ry="9" fill="#000" opacity="0.2"/>
    <circle r="15" fill="#3b82f6" stroke="#1e40af" stroke-width="2.5"/>
    <ellipse cx="-8" cy="-6" rx="6" ry="2.6" fill="#4ade80" stroke="#166534" stroke-width="1.5" transform="rotate(-40 -8 -6)"/>
    <circle cx="6" cy="-6" r="3.5" fill="#fff"/><circle cx="-6" cy="-6" r="3.5" fill="#fff"/>
    <circle cx="7" cy="-6" r="1.8" fill="#111"/><circle cx="-5" cy="-6" r="1.8" fill="#111"/>
    <rect x="8" y="-4" width="9" height="8" fill="#1e40af"/>
  </g>
  <!-- Vermelho (nariz pontudo) -->
  <g transform="translate(160 290)">
    <ellipse cx="1" cy="6" rx="14" ry="9" fill="#000" opacity="0.2"/>
    <circle r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2.5"/>
    <ellipse cx="-8" cy="-6" rx="6" ry="2.6" fill="#4ade80" stroke="#166534" stroke-width="1.5" transform="rotate(-40 -8 -6)"/>
    <circle cx="6" cy="-6" r="3.5" fill="#fff"/><circle cx="-6" cy="-6" r="3.5" fill="#fff"/>
    <circle cx="7" cy="-6" r="1.8" fill="#111"/><circle cx="-5" cy="-6" r="1.8" fill="#111"/>
    <path d="M11 -4 L22 0 L11 4 Z" fill="#991b1b"/>
  </g>
  <!-- Amarelo (orelhas grandes) -->
  <g transform="translate(260 275)">
    <ellipse cx="1" cy="6" rx="14" ry="9" fill="#000" opacity="0.2"/>
    <ellipse cx="-14" cy="8" rx="13" ry="6" fill="#facc15" stroke="#a16207" stroke-width="2" transform="rotate(30 -14 8)"/>
    <ellipse cx="14" cy="8" rx="13" ry="6" fill="#facc15" stroke="#a16207" stroke-width="2" transform="rotate(-30 14 8)"/>
    <circle r="15" fill="#facc15" stroke="#a16207" stroke-width="2.5"/>
    <ellipse cx="-8" cy="-6" rx="6" ry="2.6" fill="#4ade80" stroke="#166534" stroke-width="1.5" transform="rotate(-40 -8 -6)"/>
    <circle cx="6" cy="-6" r="3.5" fill="#fff"/><circle cx="-6" cy="-6" r="3.5" fill="#fff"/>
    <circle cx="7" cy="-6" r="1.8" fill="#111"/><circle cx="-5" cy="-6" r="1.8" fill="#111"/>
  </g>

  <!-- Joaninha gigante -->
  <g transform="translate(50 50)">
    <circle r="22" fill="#e53935" stroke="#7f1d1d" stroke-width="2.5"/>
    <line x1="0" y1="-22" x2="0" y2="22" stroke="#7f1d1d" stroke-width="2"/>
    <g fill="#111">
      <circle cx="-8" cy="-8" r="3"/><circle cx="6" cy="-10" r="3"/><circle cx="-11" cy="6" r="3"/>
      <circle cx="4" cy="9" r="3"/><circle cx="11" cy="-1" r="3"/>
    </g>
    <circle cx="18" cy="-16" r="7" fill="#111"/>
    <circle cx="21" cy="-18" r="1.8" fill="#fff"/><circle cx="21" cy="-13" r="1.8" fill="#fff"/>
  </g>

  <!-- Besouro -->
  <g transform="translate(440 250) rotate(20)">
    <ellipse rx="20" ry="13" fill="#6d4c41" stroke="#3e2723" stroke-width="2.5"/>
    <line x1="18" y1="0" x2="-18" y2="0" stroke="#3e2723" stroke-width="2"/>
    <ellipse cx="-5" cy="-4" rx="7" ry="3" fill="#fff" opacity="0.25"/>
  </g>

  <!-- Barata -->
  <g transform="translate(150 60) rotate(-15)">
    <ellipse rx="18" ry="10" fill="#8d6e63" stroke="#4e342e" stroke-width="2"/>
    <circle cx="15" cy="0" r="5" fill="#5d4037"/>
    <path d="M18 -3 q7 -5 10 -8" fill="none" stroke="#4e342e" stroke-width="1.5"/>
    <path d="M18 3 q7 5 10 8" fill="none" stroke="#4e342e" stroke-width="1.5"/>
  </g>

  <!-- Power-ups -->
  <g font-family="serif" font-size="24" text-anchor="middle">
    <text x="60" y="180">💥</text>
    <text x="240" y="120">🛡️</text>
  </g>

  <!-- Título -->
  <text x="240" y="265" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800"
        text-anchor="middle" fill="#0c1a05" opacity="0">Perdidos no Jardim</text>
</svg>
