<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241052"/>
      <stop offset="1" stop-color="#12082b"/>
    </linearGradient>
    <linearGradient id="titulo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>
  <!-- células do tabuleiro -->
  <g opacity="0.35">
    <rect x="40" y="40" width="52" height="52" rx="10" fill="#ffffff" opacity="0.08"/>
    <rect x="100" y="40" width="52" height="52" rx="10" fill="#ffffff" opacity="0.14"/>
    <rect x="160" y="40" width="52" height="52" rx="10" fill="#ffffff" opacity="0.08"/>
    <rect x="40" y="100" width="52" height="52" rx="10" fill="#ffffff" opacity="0.14"/>
    <rect x="100" y="100" width="52" height="52" rx="10" fill="#ffffff" opacity="0.08"/>
    <rect x="160" y="100" width="52" height="52" rx="10" fill="#ffffff" opacity="0.14"/>
  </g>
  <!-- frutas -->
  <text x="66" y="80" font-size="42" text-anchor="middle">🍉</text>
  <text x="126" y="80" font-size="42" text-anchor="middle">🍍</text>
  <text x="186" y="80" font-size="42" text-anchor="middle">🥭</text>
  <text x="66" y="140" font-size="42" text-anchor="middle">🍇</text>
  <text x="126" y="140" font-size="42" text-anchor="middle">🍌</text>
  <!-- explosão de partículas -->
  <circle cx="330" cy="90" r="6" fill="#f472b6"/>
  <circle cx="356" cy="72" r="4" fill="#34d399"/>
  <circle cx="344" cy="112" r="5" fill="#fbbf24"/>
  <circle cx="300" cy="70" r="4" fill="#a78bfa"/>
  <circle cx="366" cy="102" r="6" fill="#f472b6"/>
  <text x="330" y="96" font-size="52" text-anchor="middle">💥</text>
  <text x="400" y="80" font-size="46" text-anchor="middle">🍍</text>
  <text x="400" y="146" font-size="46" text-anchor="middle">🍉</text>
  <!-- título -->
  <text x="240" y="212" font-family="Arial, sans-serif" font-size="52" font-weight="900" font-style="italic" fill="url(#titulo)" text-anchor="middle">Samba da Fruta</text>
  <text x="240" y="256" font-family="Arial, sans-serif" font-size="22" fill="#b8a8e8" text-anchor="middle">Match-3 de frutas · 4 variantes</text>
