<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samba da Fruta</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #12082b;
    --bg2: #1d0f3f;
    --roxo: #7c3aed;
    --roxo-claro: #a78bfa;
    --verde: #34d399;
    --rosa: #f472b6;
    --texto: #ede9fe;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #2b1465 0%, var(--bg2) 45%, var(--bg) 100%);
    color: var(--texto);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 12px;
    user-select: none;
  }

  canvas {
    width: 100%;
    max-width: 512px;
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(167, 139, 250, 0.25);
    touch-action: none;
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="cv" width="512" height="704"></canvas>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("cv");
  var ctx = canvas.getContext("2d");
  var W = canvas.width, H = canvas.height;

  // ---------------- Constantes ----------------
  var GRID = 8, CELL = 64;
  var BW = GRID * CELL;                 // 512
  var BX = (W - BW) / 2;                // 0
  var BY = 172, BH = BW;                // área do tabuleiro
  var BOTTOM_Y = BY + BH;               // 716? -> BY+512 = 684
  var MOVS_POR_NIVEL = 25;

  // Variantes (o "select" da tela inicial)
  var THEMES = [
    { nome: "Frutas Tropicais",   frutas: ["🍉", "🥭", "🍍", "🍌", "🍇"] },
    { nome: "Caipirinha do Samba", frutas: ["🍹", "🍋", "🌿", "🧊", "🍈"] },
    { nome: "Quitandas",          frutas: ["🍬", "🍭", "🍩", "🧁", "🍡"] },
    { nome: "Churrasco",          frutas: ["🍖", "🥩", "🧀", "🥖", "🌽"] }
  ];

  // ---------------- Estado ----------------
  var state = "menu";                  // menu | play | win | lose
  var theme = 0;
  var grid = null;                     // grid[y][x] = {t, row, col, born, pop, isB, line}
  var score = 0, level = 1, moves = MOVS_POR_NIVEL;
  var goal = 1500;
  var phase = "idle";                  // idle | swap | swapback | pop | fall | shuffle
  var anim = { t: 0, dur: 0, data: null };
  var sel = null;                      // {x, y}
  var particles = [], floats = [];
  var msg = null;                      // {text, t, dur}
  var regions = [];                    // botões desenhados (para hit-test)
  var hiKey = "", hi = 0;
  var last = performance.now();

  // ---------------- Áudio ----------------
  var audio = { on: true, ctx: null };
  function beep(freq, dur, type, vol, when) {
    if (!audio.on) return;
    try {
      if (!audio.ctx) audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
      var t = audio.ctx.currentTime + (when || 0);
      var o = audio.ctx.createOscillator(), g = audio.ctx.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(audio.ctx.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) { /* sem áudio, sem choro */ }
  }
  var sfx = {
    select: function () { beep(520, 0.07, "sine", 0.08); },
    swap: function () { beep(300, 0.09, "triangle", 0.1); },
    fail: function () { beep(140, 0.15, "square", 0.07); },
    pop: function (chain) { beep(360 + Math.min(chain, 8) * 60, 0.12, "sine", 0.14); },
    bomb: function () { beep(90, 0.3, "sawtooth", 0.15); beep(60, 0.35, "sawtooth", 0.12, 0.03); },
    win: function () { [523, 659, 784, 1047].forEach(function (f, i) { beep(f, 0.22, "triangle", 0.14, i * 0.13); }); },
    lose: function () { [400, 300, 200].forEach(function (f, i) { beep(f, 0.25, "sine", 0.1, i * 0.18); }); }
  };

  // ---------------- Helpers ----------------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function inRect(px, py, r) { return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h; }
  function cellCenter(cx, row) { return { x: BX + cx * CELL + CELL / 2, y: BY + row * CELL + CELL / 2 }; }
  function easeInOut(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function easeOutBack(t) { return 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2); }
  function fmt(n) { return String(n); }

  function loadHi(themeIdx) {
    hiKey = "samba-fruta-hi-" + THEMES[themeIdx].nome;
    hi = parseInt(localStorage.getItem(hiKey) || "0", 10) || 0;
  }
  function saveHi() {
    if (score > hi) {
      hi = score;
      try { localStorage.setItem(hiKey, String(hi)); } catch (e) {}
    }
  }

  function showMsg(text, dur) { msg = { text: text, t: 0, dur: dur || 1.2 }; }

  // ---------------- Tabuleiro ----------------
  function newPiece(t, row, col, opts) {
    return {
      t: t, row: row, col: col, born: 0, pop: 0,
      isB: (opts && opts.isB) || false, line: opts && opts.line || 0
    };
  }

  function initBoard() {
    grid = [];
    var n = THEMES[theme].frutas.length;
    for (var y = 0; y < GRID; y++) {
      grid[y] = [];
      for (var x = 0; x < GRID; x++) {
        var t;
        do { t = (Math.random() * n) | 0; }
        while (
          (x >= 2 && grid[y][x - 1].t === t && grid[y][x - 2].t === t) ||
          (y >= 2 && grid[y - 1][x].t === t && grid[y - 2][x].t === t)
        );
        grid[y][x] = newPiece(t, y, x);
      }
    }
  }

  function goalForLevel(lv) { return 500 + lv * 1000; }

  function startLevel(lv) {
    level = lv;
    goal = goalForLevel(lv);
    moves = MOVS_POR_NIVEL;
    initBoard();
    sel = null;
    phase = "idle";
    state = "play";
    if (!hasValidMoves()) doShuffle(true);
  }

  function newGame(tIdx) {
    theme = tIdx;
    score = 0;
    loadHi(theme);
    particles = []; floats = [];
    startLevel(1);
  }

  // ---------------- Solução de matches ----------------
  function findMatches() {
    var runs = [];
    // linhas
    for (var y = 0; y < GRID; y++) {
      var run = [{ x: 0, y: y }];
      for (var x = 1; x <= GRID; x++) {
        var same = x < GRID && grid[y][x].t === grid[y][run[0].x].t;
        if (same) run.push({ x: x, y: y });
        else {
          if (run.length >= 3) runs.push(run);
          run = [{ x: x, y: y }];
        }
      }
    }
    // colunas
    for (var c = 0; c < GRID; c++) {
      var run2 = [{ x: c, y: 0 }];
      for (var y2 = 1; y2 <= GRID; y2++) {
        var same2 = y2 < GRID && grid[y2][c].t === grid[run2[0].y][c].t;
        if (same2) run2.push({ x: c, y: y2 });
        else {
          if (run2.length >= 3) runs.push(run2);
          run2 = [{ x: c, y: y2 }];
        }
      }
    }
    return runs;
  }

  function isMatchAt(x, y) {
    var t = grid[y][x].t;
    var h = 1;
    while (x - h >= 0 && grid[y][x - h].t === t) h++;
    while (x + h < GRID && grid[y][x + h].t === t) h++;
    if (h >= 3) return true;
    var v = 1;
    while (y - v >= 0 && grid[y - v][x].t === t) v++;
    while (y + v < GRID && grid[y + v][x].t === t) v++;
    return v >= 3;
  }

  function hasValidMoves() {
    for (var y = 0; y < GRID; y++) {
      for (var x = 0; x < GRID; x++) {
        if (x + 1 < GRID) {
          swapAt(x, y, x + 1, y);
          var ok = isMatchAt(x, y) || isMatchAt(x + 1, y);
          swapAt(x, y, x + 1, y);
          if (ok) return true;
        }
        if (y + 1 < GRID) {
          swapAt(x, y, x, y + 1);
          var ok2 = isMatchAt(x, y) || isMatchAt(x, y + 1);
          swapAt(x, y, x, y + 1);
          if (ok2) return true;
        }
      }
    }
    return false;
  }

  function swapAt(x1, y1, x2, y2) {
    var a = grid[y1][x1];
    var b = grid[y2][x2];
    grid[y1][x1] = b;
    grid[y2][x2] = a;
    a.row = y2; a.col = x2;
    b.row = y1; b.col = x1;
  }

  function doShuffle(silent) {
    var cells = [];
    for (var y = 0; y < GRID; y++) for (var x = 0; x < GRID; x++) cells.push(grid[y][x]);
    var types = cells.map(function (p) { return p.t; });
    var ok = false;
    for (var i = 0; i < 60 && !ok; i++) {
      for (var j = types.length - 1; j > 0; j--) {
        var k = (Math.random() * (j + 1)) | 0;
        var tmp = types[j]; types[j] = types[k]; types[k] = tmp;
      }
      for (var y2 = 0; y2 < GRID; y2++)
        for (var x2 = 0; x2 < GRID; x2++)
          grid[y2][x2].t = types[y2 * GRID + x2];
      ok = hasValidMoves() && findMatches().length === 0;
    }
    if (!silent) showMsg("🔀 Embaralhando o tabuleiro!", 1.4);
  }

  function trySwap(x1, y1, x2, y2) {
    phase = "swap";
    var d = grid[y1][x1];
    anim = {
      t: 0, dur: 0.16,
      data: { a: d, b: grid[y2][x2], ax: x1, ay: y1, bx: x2, by: y2 }
    };
    swapAt(x1, y1, x2, y2);
    sfx.swap();
  }

  function onSwapDone() {
    var d = anim.data;
    var runs = findMatches();
    if (runs.length === 0) {
      // troca inválita: devolve com tremidinha
      swapAt(d.ax, d.ay, d.bx, d.by);
      phase = "swapback";
      anim = { t: 0, dur: 0.2, data: d };
      sfx.fail();
      return;
    }
    moves--;
    cascade(1);
  }

  function cascade(chain) {
    var runs = findMatches();
    if (runs.length === 0) { afterCascades(); return; }

    var clear = {};
    var bombClear = {};
    var creates = [];

    runs.forEach(function (run) {
      var pts = run.length >= 5 ? 150 : run.length === 4 ? 100 : 60;
      pts *= chain;
      var mid = cellCenter(run[(run.length / 2) | 0].x, run[(run.length / 2) | 0].y);
      addFloat("+" + pts, mid.x, mid.y);
      run.forEach(function (p) { clear[p.x + "," + p.y] = 1; });
      // 4 em linha = bomba de linha; 5+ = bomba 3x3
      if (run.length >= 4) {
        var r = run[(Math.random() * run.length) | 0];
        creates.push({
          x: r.x, y: r.y,
          t: grid[r.y][r.x].t,
          isB: run.length >= 5 ? "blast" : (Math.random() < 0.5 ? "row" : "col")
        });
      }
    });

    // bombas envolvidas
    Object.keys(clear).forEach(function (key) {
      var xy = key.split(","), x = +xy[0], y = +xy[1];
      var p = grid[y][x];
      if (p.isB === "row") for (var c = 0; c < GRID; c++) bombClear[c + "," + y] = 1;
      if (p.isB === "col") for (var r = 0; r < GRID; r++) bombClear[x + "," + r] = 1;
      if (p.isB === "blast") {
        for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
          var nx = x + dx, ny = y + dy;
          if (nx >= 0 && ny >= 0 && nx < GRID && ny < GRID) bombClear[nx + "," + ny] = 1;
        }
        sfx.bomb();
      }
    });

    var total = Object.keys(clear).length + Object.keys(bombClear).length;
    score += total;
    sfx.pop(chain);

    // marca pops
    function mark(k) {
      var xy = k.split(","), x = +xy[0], y = +xy[1];
      grid[y][x].pop = 1;
    }
    Object.keys(bombClear).forEach(mark);
    Object.keys(clear).forEach(mark);

    particlesBurst(clear, bombClear);
    phase = "pop";
    anim = { t: 0, dur: 0.22, data: { chain: chain, clear: clear, bombClear: bombClear, creates: creates } };
  }

  function onPopDone() {
    var d = anim.data;
    // remove peças pop (inclui bombClear)
    for (var y = 0; y < GRID; y++)
      for (var x = 0; x < GRID; x++)
        if (grid[y][x].pop) grid[y][x] = null;
    // bombas criadas
    d.creates.forEach(function (c) {
      grid[c.y][c.x] = newPiece(c.t, c.y, c.x, { isB: c.isB });
      grid[c.y][c.x].born = -0.3; // surge com "power-up"
    });
    // gravidade
    var n = THEMES[theme].frutas.length;
    for (var x2 = 0; x2 < GRID; x2++) {
      var fall = 0;
      for (var y2 = GRID - 1; y2 >= 0; y2--) {
        if (!grid[y2][x2]) { fall++; continue; }
        if (fall) {
          // mantém p.row no valor antigo: a animação de queda é feita no tick
          grid[y2 + fall][x2] = grid[y2][x2];
          grid[y2][x2] = null;
        }
      }
      for (var y3 = 0; y3 < fall; y3++) {
        var p = newPiece((Math.random() * n) | 0, y3, x2);
        p.row = y3 - fall; // nasce acima da tela e cai
        grid[y3][x2] = p;
      }
    }
    phase = "fall";
    anim = { t: 0, dur: 0.34, data: { chain: d.chain } };
  }

  function onFallDone() {
    var d = anim.data;
    cascade(d.chain + 1);
  }

  function afterCascades() {
    phase = "idle";
    if (!hasValidMoves()) { doShuffle(false); }
    if (score >= goal) {
      saveHi();
      state = "win";
      sfx.win();
      addFloat("🎉 Nível " + level + " completo!", W / 2, BY + BH / 2);
    } else if (moves <= 0) {
      saveHi();
      state = "lose";
      sfx.lose();
    }
  }

  // ---------------- Partículas / textos flutuantes ----------------
  function particlesBurst(clear, bombClear) {
    var all = {};
    Object.keys(clear).forEach(function (k) { all[k] = 1; });
    Object.keys(bombClear).forEach(function (k) { all[k] = 1; });
    Object.keys(all).forEach(function (k) {
      var xy = k.split(","), c = cellCenter(+xy[0], +xy[1]);
      for (var i = 0; i < 7; i++) {
        var a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 140;
        particles.push({
          x: c.x, y: c.y,
          vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40,
          r: 2 + Math.random() * 3,
          hue: 260 + Math.random() * 120,
          t: 0, dur: 0.45 + Math.random() * 0.2
        });
      }
    });
  }
  function addFloat(text, x, y) { floats.push({ text: text, x: x, y: y, t: 0, dur: 0.9 }); }

  // ---------------- Input ----------------
  function point(e) {
    var r = canvas.getBoundingClientRect();
    var cx = (e.touches ? e.touches[0].clientX : e.clientX);
    var cy = (e.touches ? e.touches[0].clientY : e.clientY);
    return { x: (cx - r.left) * (W / r.width), y: (cy - r.top) * (H / r.height) };
  }

  function onDown(e) {
    e.preventDefault();
    if (audio.ctx && audio.ctx.state === "suspended") audio.ctx.resume();
    var p = point(e), i;

    if (state === "menu") {
      for (i = 0; i < regions.length; i++) {
        if (inRect(p.x, p.y, regions[i])) {
          sfx.select();
          if (regions[i].kind === "theme") { theme = regions[i].idx; }
          else newGame(theme);
          return;
        }
      }
      return;
    }
    if (state === "win" || state === "lose") {
      for (i = 0; i < regions.length; i++) {
        if (inRect(p.x, p.y, regions[i])) {
          sfx.select();
          if (regions[i].kind === "next") startLevel(level + 1);
          else if (regions[i].kind === "menu") { state = "menu"; phase = "idle"; }
          else newGame(theme);
          return;
        }
      }
      return;
    }

    // state === "play"
    for (i = 0; i < regions.length; i++) {
      if (inRect(p.x, p.y, regions[i])) { sfx.select(); state = "menu"; phase = "idle"; return; }
    }
    if (phase !== "idle") return;
    if (p.x < BX || p.x >= BX + BW || p.y < BY || p.y >= BY + BH) { sel = null; return; }
    var x = Math.floor((p.x - BX) / CELL), y = Math.floor((p.y - BY) / CELL);
    if (!sel) { sel = { x: x, y: y }; sfx.select(); return; }
    if (sel.x === x && sel.y === y) { sel = null; return; }
    if (Math.abs(sel.x - x) + Math.abs(sel.y - y) === 1) {
      var s = sel; sel = null;
      trySwap(s.x, s.y, x, y);
    } else {
      sel = { x: x, y: y };
      sfx.select();
    }
  }
  canvas.addEventListener("mousedown", onDown);
  canvas.addEventListener("touchstart", onDown, { passive: false });

  // ---------------- Loop ----------------
  function tick() {
    var now = performance.now();
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    anim.t += dt;
    if (msg) { msg.t += dt; if (msg.t > msg.dur) msg = null; }
    particles.forEach(function (pt) {
      pt.t += dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 260 * dt;
    });
    particles = particles.filter(function (pt) { return pt.t < pt.dur; });
    floats.forEach(function (f) { f.t += dt; f.y -= 46 * dt; });
    floats = floats.filter(function (f) { return f.t < f.dur; });
    if (grid) {
      for (var y = 0; y < GRID; y++)
        for (var x = 0; x < GRID; x++) {
          var pc = grid[y][x];
          if (pc) {
            if (pc.born < 1) pc.born = Math.min(1, pc.born + dt / 0.18);
            if (pc.pop) pc.pop = Math.min(1, pc.pop + dt / 0.2);
            // animação de queda: a linha visual persegue a linha lógica
            if (pc.row < y) pc.row = Math.min(y, pc.row + dt * 32);
          }
        }
    }
    if (phase === "swap" && anim.t >= anim.dur) onSwapDone();
    if (phase === "swapback" && anim.t >= anim.dur) { phase = "idle"; }
    if (phase === "pop" && anim.t >= anim.dur) onPopDone();
    if (phase === "fall" && anim.t >= anim.dur) onFallDone();

    render();
    requestAnimationFrame(tick);
  }

  // ---------------- Render ----------------
  function drawButton(x, y, w, h, text, opts) {
    opts = opts || {};
    ctx.save();
    var grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, opts.color || "#7c3aed");
    grad.addColorStop(1, opts.color2 || "#5b21b6");
    ctx.fillStyle = grad;
    rr(x, y, w, h, 12);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = opts.fg || "#fff";
    ctx.font = (opts.font || "700 17px 'Segoe UI', sans-serif");
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, x + w / 2, y + h / 2 + 1);
    ctx.restore();
    regions.push(Object.assign({ kind: opts.kind, idx: opts.idx }, { x: x, y: y, w: w, h: h }));
  }

  function drawHud() {
    ctx.textBaseline = "middle";
    // título
    ctx.font = "italic 900 26px 'Segoe UI', sans-serif";
    var tg = ctx.createLinearGradient(0, 0, W, 0);
    tg.addColorStop(0, "#f472b6");
    tg.addColorStop(0.5, "#a78bfa");
    tg.addColorStop(1, "#34d399");
    ctx.fillStyle = tg;
    ctx.textAlign = "left";
    ctx.fillText("Samba da Fruta", 16, 34);

    // botão home
    drawButton(W - 52, 14, 38, 38, "⌂", { font: "700 20px sans-serif", kind: "home" });

    // plaques: nível | meta | pontos | movimentos
    var py = 56, ph = 52;
    var items = [
      { v: String(level), l: "NÍVEL" },
      { v: fmt(goal), l: "META" },
      { v: fmt(score), l: "PONTOS" }
    ];
    var w3 = (W - 32) / 3;
    items.forEach(function (it, i) {
      var x = 16 + i * w3 + w3 / 2;
      ctx.fillStyle = "rgba(255,255,255,0.07)";
      rr(16 + i * w3 + 4, py, w3 - 8, ph, 12);
      ctx.fill();
      ctx.textAlign = "center";
      ctx.font = "800 20px 'Segoe UI', sans-serif";
      ctx.fillStyle = i === 2 ? "#34d399" : "#ede9fe";
      ctx.fillText(it.v, x, py + 20);
      ctx.font = "600 11px 'Segoe UI', sans-serif";
      ctx.fillStyle = "#9d8cd0";
      ctx.fillText(it.l, x, py + 40);
    });

    // movimentos (grande, à direita)
    var mx = W - 118, my = 120, mw = 90, mh = 44;
    ctx.fillStyle = "rgba(255,255,255,0.07)";
    rr(mx, my, mw, mh, 12);
    ctx.fill();
    ctx.textAlign = "center";
    ctx.font = "800 22px 'Segoe UI', sans-serif";
    ctx.fillStyle = moves <= 5 ? "#f87171" : "#fbbf24";
    ctx.fillText(String(moves), mx + mw / 2, my + 16);
    ctx.font = "600 9px 'Segoe UI', sans-serif";
    ctx.fillStyle = "#9d8cd0";
    ctx.fillText("MOVIMENTOS", mx + mw / 2, my + 34);

    // recorde
    ctx.textAlign = "left";
    ctx.font = "600 13px 'Segoe UI', sans-serif";
    ctx.fillStyle = "#9d8cd0";
    ctx.fillText("🏆 Recorde: " + fmt(hi), 16, 142);

    // barra de progresso para a meta
    var gy = 156;
    ctx.fillStyle = "rgba(255,255,255,0.1)";
    rr(16, gy, W / 2 - 40, 8, 4);
    ctx.fill();
    var frac = Math.min(1, score / goal);
    if (frac > 0) {
      var pg = ctx.createLinearGradient(16, 0, 16 + (W / 2 - 40), 0);
      pg.addColorStop(0, "#f472b6");
      pg.addColorStop(1, "#34d399");
      ctx.fillStyle = pg;
      rr(16, gy, Math.max(8, (W / 2 - 40) * frac), 8, 4);
      ctx.fill();
    }
  }

  function drawPiece(px, py, p, scale) {
    var s = scale == null ? 1 : scale;
    var r = CELL * 0.42 * s;
    var fruits = THEMES[theme].frutas;
    ctx.save();
    // fundo
    var g = ctx.createRadialGradient(px - r * 0.4, py - r * 0.5, r * 0.2, px, py, r * 1.3);
    if (p.isB) {
      g.addColorStop(0, "#fef08a");
      g.addColorStop(0.6, "#f59e0b");
      g.addColorStop(1, "#92400e");
    } else {
      g.addColorStop(0, "rgba(255,255,255,0.35)");
      g.addColorStop(1, "rgba(255,255,255,0.08)");
    }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fill();
    if (p.isB) {
      ctx.strokeStyle = "rgba(255,255,255,0.7)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    // emoji
    ctx.font = Math.round(CELL * 0.5 * s) + "px 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(fruits[p.t], px, py + 2);
    // marcadores de bomba
    if (p.isB === "row" || p.isB === "col") {
      ctx.strokeStyle = "rgba(255,255,255,0.85)";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.beginPath();
      if (p.isB === "row") { ctx.moveTo(px - r * 0.75, py); ctx.lineTo(px + r * 0.75, py); }
      else { ctx.moveTo(px, py - r * 0.75); ctx.lineTo(px, py + r * 0.75); }
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawBoard() {
    // moldura
    ctx.fillStyle = "rgba(255,255,255,0.05)";
    rr(BX - 6, BY - 6, BW + 12, BH + 12, 16);
    ctx.fill();
    // células
    for (var y = 0; y < GRID; y++)
      for (var x = 0; x < GRID; x++) {
        ctx.fillStyle = (x + y) % 2 ? "rgba(255,255,255,0.05)" : "rgba(255,255,255,0.02)";
        rr(BX + x * CELL + 3, BY + y * CELL + 3, CELL - 6, CELL - 6, 10);
        ctx.fill();
      }
    // seleção
    if (sel) {
      ctx.strokeStyle = "#fbbf24";
      ctx.lineWidth = 3;
      rr(BX + sel.x * CELL + 3, BY + sel.y * CELL + 3, CELL - 6, CELL - 6, 10);
      ctx.stroke();
    }
    // peças (recortadas à área do tabuleiro: em queda, entram por cima)
    ctx.save();
    ctx.beginPath();
    ctx.rect(BX, BY, BW, BH);
    ctx.clip();
    var d = (phase === "swap" || phase === "swapback") ? anim.data : null;
    var k = d ? easeInOut(Math.min(1, anim.t / anim.dur)) : 0;
    for (var y2 = 0; y2 < GRID; y2++)
      for (var x2 = 0; x2 < GRID; x2++) {
        var p = grid[y2][x2];
        if (!p) continue;
        var row = p.row, col = p.col;
        if (d) {
          var fwd = phase === "swap";
          if (p === d.a) {
            row = fwd ? d.ay + (d.by - d.ay) * k : d.by + (d.ay - d.by) * k;
            col = fwd ? d.ax + (d.bx - d.ax) * k : d.bx + (d.ax - d.bx) * k;
          } else if (p === d.b) {
            row = fwd ? d.by + (d.ay - d.by) * k : d.ay + (d.by - d.ay) * k;
            col = fwd ? d.bx + (d.ax - d.bx) * k : d.ax + (d.bx - d.ax) * k;
          }
        }
        var c = cellCenter(col, row);
        var scale = 1;
        if (p.pop) scale = 1 + p.pop * 0.5;
        if (p.born < 1) scale *= easeOutBack(Math.max(0.01, p.born));
        var shake = 0;
        if (phase === "swapback") shake = Math.sin(anim.t * 40) * 3 * (1 - anim.t / anim.dur);
        drawPiece(c.x + shake, c.y, p, scale);
      }
    ctx.restore();
    // partículas
    particles.forEach(function (pt) {
      ctx.globalAlpha = Math.max(0, 1 - pt.t / pt.dur);
      ctx.fillStyle = "hsl(" + pt.hue + ", 90%, 70%)";
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    // textos flutuantes
    floats.forEach(function (f) {
      ctx.globalAlpha = Math.max(0, 1 - f.t / f.dur);
      ctx.font = "800 18px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.fillText(f.text, f.x, f.y);
    });
    ctx.globalAlpha = 1;
  }

  function drawOverlay() {
    ctx.fillStyle = "rgba(10, 5, 25, 0.82)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    if (state === "win") {
      ctx.font = "900 40px 'Segoe UI', sans-serif";
      ctx.fillStyle = "#34d399";
      ctx.fillText("Nível " + level + " completo! 🎉", W / 2, 200);
      ctx.font = "600 18px 'Segoe UI', sans-serif";
      ctx.fillStyle = "#c4b5fd";
      ctx.fillText("Pontos: " + score, W / 2, 252);
      drawButton(W / 2 - 110, 320, 220, 54, "Próximo nível ➜", { kind: "next" });
      drawButton(W / 2 - 110, 392, 220, 48, "Tela inicial", { kind: "menu", color: "#4c1d95", color2: "#2e1065", font: "600 15px 'Segoe UI', sans-serif" });
    } else if (state === "lose") {
      var recorde = score >= hi && score > 0;
      ctx.font = "900 40px 'Segoe UI', sans-serif";
      ctx.fillStyle = "#f472b6";
      ctx.fillText("Fim de jogo!", W / 2, 180);
      ctx.font = "600 19px 'Segoe UI', sans-serif";
      ctx.fillStyle = "#c4b5fd";
      ctx.fillText("Nível " + level + " · Pontos: " + score, W / 2, 232);
      ctx.fillStyle = "#fbbf24";
      ctx.fillText(recorde ? "🏆 Novo recorde!" : "🏆 Recorde: " + fmt(hi), W / 2, 268);
      drawButton(W / 2 - 110, 330, 220, 54, "Jogar de novo 🔁", { kind: "play" });
      drawButton(W / 2 - 110, 402, 220, 48, "Tela inicial", { kind: "menu", color: "#4c1d95", color2: "#2e1065", font: "600 15px 'Segoe UI', sans-serif" });
    }
  }

  function drawMenu() {
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // frutas decorativas
    ctx.font = "56px 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif";
    ctx.fillText("🍉", 60, 70);
    ctx.fillText("🍍", W - 60, 62);
    ctx.fillText("🥭", 110, 128);
    ctx.fillText("🍇", W - 110, 122);

    ctx.font = "italic 900 42px 'Segoe UI', sans-serif";
    var tg = ctx.createLinearGradient(0, 0, W, 0);
    tg.addColorStop(0, "#f472b6");
    tg.addColorStop(0.5, "#a78bfa");
    tg.addColorStop(1, "#34d399");
    ctx.fillStyle = tg;
    ctx.fillText("Samba da Fruta", W / 2, 178);

    ctx.font = "600 17px 'Segoe UI', sans-serif";
    ctx.fillStyle = "#b8a8e8";
    ctx.fillText("Escolha a variante da roda 🎡", W / 2, 226);

    // "select" — lista de variantes
    var top = 252, ih = 70, gap = 10;
    THEMES.forEach(function (th, i) {
      var y = top + i * (ih + gap);
      var selT = i === theme;
      ctx.fillStyle = selT ? "rgba(167,139,250,0.22)" : "rgba(255,255,255,0.06)";
      rr(36, y, W - 72, ih, 14);
      ctx.fill();
      ctx.strokeStyle = selT ? "#a78bfa" : "rgba(255,255,255,0.12)";
      ctx.lineWidth = selT ? 2.5 : 1;
      ctx.stroke();
      ctx.textAlign = "left";
      ctx.font = "26px 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif";
      var fx = 62;
      th.frutas.forEach(function (f) { ctx.fillText(f, fx, y + 30); fx += 42; });
      ctx.font = (selT ? "700 " : "600 ") + "16px 'Segoe UI', sans-serif";
      ctx.fillStyle = selT ? "#fff" : "#c4b5fd";
      ctx.fillText(th.nome, 62, y + 58);
      regions.push({ kind: "theme", idx: i, x: 36, y: y, w: W - 72, h: ih });
    });

    var btnY = top + 4 * (ih + gap) + 6;
    drawButton(W / 2 - 130, btnY, 260, 58, "▶ Jogar", { kind: "play", font: "800 20px 'Segoe UI', sans-serif" });

    // dica
    ctx.textAlign = "center";
    ctx.font = "500 13px 'Segoe UI', sans-serif";
    ctx.fillStyle = "#8b7bc0";
    ctx.fillText("Trote 2 frutas vizinhas para casar 3+. 4 em linha = bomba!", W / 2, btnY + 80);
  }

  function render() {
    // fundo
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#241052");
    bg.addColorStop(1, "#12082b");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    regions = [];
    if (state === "menu") { drawMenu(); return; }

    drawHud();
    drawBoard();

    // rodapé
    ctx.font = "500 13px 'Segoe UI', sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = "#8b7bc0";
    ctx.fillText("Variante: " + THEMES[theme].nome + "  ·  toque/ clique para trocar", W / 2, BOTTOM_Y + 22);

    // mensagem central (embaralhar)
    if (msg) {
      var a = Math.min(1, msg.t / 0.15, (msg.dur - msg.t) / 0.3);
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = "rgba(10,5,25,0.75)";
      rr(W / 2 - 170, BY + BH / 2 - 34, 340, 64, 16);
      ctx.fill();
      ctx.font = "800 20px 'Segoe UI', sans-serif";
      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(msg.text, W / 2, BY + BH / 2);
      ctx.globalAlpha = 1;
    }

    if (state === "win" || state === "lose") drawOverlay();
  }

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
