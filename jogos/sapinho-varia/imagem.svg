  <rect x="6" y="154" width="228" height="140" rx="12" fill="url(#g3)"/>
  <path d="M 10 190 q 15 -8 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0" stroke="#fff" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M 10 244 q 15 -8 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0" stroke="#fff" stroke-width="2" fill="none" opacity="0.3"/>
  <text x="20" y="178" font-size="20">🍄</text>
  <text x="150" y="206" font-size="22">🐊</text>
