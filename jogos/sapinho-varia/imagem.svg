  <!-- 4 painéis: os 4 temas -->
  <!-- Sapinho na Rua -->
    <rect x="6" y="6" width="228" height="140" rx="12" fill="url(#g1)"/>
    <rect x="6" y="46" width="228" height="60" fill="#39424e"/>
    <line x1="10" y1="76" x2="230" y2="76" stroke="#fff" stroke-width="3" stroke-dasharray="16 14" opacity="0.6"/>
    <text x="20" y="30" font-size="20">🏡</text>
    <text x="180" y="60" font-size="22">🚗</text>
    <text x="60" y="100" font-size="22">🚌</text>
    <text x="90" y="132" font-size="24">🐸</text>
    <text x="190" y="132" font-size="16">🐸</text>

  <!-- Galinha na Rua -->
  <rect x="246" y="6" width="228" height="140" rx="12" fill="url(#g2)"/>
