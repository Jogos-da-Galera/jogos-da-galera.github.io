<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#3b1a6e"/>
      <stop offset="100%" stop-color="#120821"/>
    </radialGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="480" height="300" fill="url(#bg)"/>

  <!-- grade sutil -->
  <g stroke="#a855f7" stroke-opacity="0.12" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="300"/>
    <line x1="180" y1="0" x2="180" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="360" y1="0" x2="360" y2="300"/>
    <line x1="420" y1="0" x2="420" y2="300"/>
    <line x1="0" y1="50" x2="480" y2="50"/>
    <line x1="0" y1="100" x2="480" y2="100"/>
    <line x1="0" y1="150" x2="480" y2="150"/>
    <line x1="0" y1="200" x2="480" y2="200"/>
    <line x1="0" y1="250" x2="480" y2="250"/>
  </g>

  <!-- corpo da minhoquinha -->
  <g fill="url(#snake)">
    <rect x="60" y="200" width="56" height="56" rx="14" opacity="0.5"/>
    <rect x="120" y="200" width="56" height="56" rx="14" opacity="0.65"/>
    <rect x="180" y="200" width="56" height="56" rx="14" opacity="0.8"/>
    <rect x="240" y="200" width="56" height="56" rx="14" opacity="0.9"/>
    <!-- cabeça -->
    <rect x="300" y="200" width="56" height="56" rx="14"/>
    <circle cx="318" cy="222" r="5" fill="#120821"/>
    <circle cx="340" cy="222" r="5" fill="#120821"/>
  </g>

  <!-- maçã -->
  <circle cx="360" cy="110" r="22" fill="#facc15"/>
  <path d="M360 92 q6 -10 14 -12" stroke="#65a30d" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="353" cy="104" r="5" fill="#fff7d6" opacity="0.7"/>

  <!-- título -->
  <text x="240" y="80" text-anchor="middle" font-family="Segoe UI, sans-serif"
        font-size="42" font-weight="900" fill="#e879f9">Minhoquinha</text>
  <text x="240" y="112" text-anchor="middle" font-family="Segoe UI, sans-serif"
        font-size="16" fill="#b9a8d9">O clássico snake 🐍</text>
</svg>
