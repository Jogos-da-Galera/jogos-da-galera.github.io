<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minhoquinha 🐍</title>
  <style>
    :root {
      --bg: #120821;
      --primary: #a855f7;
      --accent: #e879f9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(800px 400px at 50% -20%, #3b1a6e 0%, var(--bg) 60%);
      color: #f5f0ff;
      font-family: "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
      padding: 16px;
      user-select: none;
    }
    h1 {
      font-size: 1.6rem;
      background: linear-gradient(90deg, var(--accent), var(--primary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    #hud {
      display: flex;
      gap: 24px;
      font-weight: 700;
      font-size: 1.1rem;
    }
    #hud span { color: var(--accent); }
    canvas {
      border: 3px solid var(--primary);
      border-radius: 12px;
      background: #1a0d2e;
      box-shadow: 0 10px 30px rgba(139, 47, 240, 0.4);
      max-width: 100%;
      touch-action: none;
    }
    #hint { color: #b9a8d9; font-size: 0.95rem; text-align: center; }
    /* Controles touch */
    #pad {
      display: grid;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(2, 52px);
      gap: 6px;
    }
    #pad button {
      font-size: 1.4rem;
      border: 2px solid var(--primary);
      border-radius: 10px;
      background: rgba(168, 85, 247, 0.15);
      color: var(--accent);
      cursor: pointer;
    }
    #pad button:active { background: var(--primary); color: #fff; }
    .up { grid-column: 2; grid-row: 1; }
    .left { grid-column: 1; grid-row: 2; }
    .down { grid-column: 2; grid-row: 2; }
    .right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>
  <h1>🐍 Minhoquinha</h1>
  <div id="hud">
    Pontos: <span id="score">0</span>
    Recorde: <span id="high">0</span>
  </div>
  <canvas id="game" width="480" height="480"></canvas>
  <p id="hint">Use as setas ou WASD para mover · Clique/espaço para reiniciar</p>
  <div id="pad">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="down" data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const highEl = document.getElementById("high");

    const GRID = 24;               // 24x24 células
    const CELL = canvas.width / GRID;
    const BASE_SPEED = 140;        // ms por passo
    const MIN_SPEED = 60;

    let snake, dir, nextDir, food, score, high, speed, gameOver, timer;
    // localStorage pode não estar disponível (iframe sandboxed sem allow-same-origin)
    const store = (() => {
      try {
        localStorage.getItem("test");
        return localStorage;
      } catch (e) {
        return null;
      }
    })();
    high = Number(store?.getItem("minhoquinha-high") || 0);
    highEl.textContent = high;

    const DIRS = {
      up: { x: 0, y: -1 },
      down: { x: 0, y: 1 },
      left: { x: -1, y: 0 },
      right: { x: 1, y: 0 },
    };

    function reset() {
      snake = [{ x: 10, y: 12 }, { x: 9, y: 12 }, { x: 8, y: 12 }];
      dir = DIRS.right;
      nextDir = DIRS.right;
      score = 0;
      speed = BASE_SPEED;
      gameOver = false;
      scoreEl.textContent = 0;
      placeFood();
      clearInterval(timer);
      timer = setInterval(tick, speed);
      draw();
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID),
        };
      } while (snake.some((s) => s.x === food.x && s.y === food.y));
    }

    function tick() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // colisão com parede ou consigo mesmo
      if (
        head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID ||
        snake.some((s) => s.x === head.x && s.y === head.y)
      ) {
        return endGame();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        placeFood();
        // acelera um pouco a cada maçã
        speed = Math.max(MIN_SPEED, speed - 3);
        clearInterval(timer);
        timer = setInterval(tick, speed);
      } else {
        snake.pop();
      }
      draw();
    }

    function endGame() {
      gameOver = true;
      clearInterval(timer);
      if (score > high) {
        high = score;
        try { store?.setItem("minhoquinha-high", high); } catch (e) {}
        highEl.textContent = high;
      }
      draw();
    }

    function draw() {
      // fundo
      ctx.fillStyle = "#1a0d2e";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // grade sutil
      ctx.strokeStyle = "rgba(168, 85, 247, 0.08)";
      for (let i = 1; i < GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height);
        ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
      }

      // comida (maçã)
      ctx.fillStyle = "#facc15";
      ctx.beginPath();
      ctx.arc(
        food.x * CELL + CELL / 2,
        food.y * CELL + CELL / 2,
        CELL / 2 - 3,
        0, Math.PI * 2
      );
      ctx.fill();

      // cobra (cabeça mais clara)
      snake.forEach((s, i) => {
        const t = i / snake.length;
        ctx.fillStyle = i === 0 ? "#e879f9" : `rgba(168, 85, 247, ${1 - t * 0.6})`;
        const pad = 2 + t * 2;
        roundRect(
          ctx,
          s.x * CELL + pad,
          s.y * CELL + pad,
          CELL - pad * 2,
          CELL - pad * 2,
          6
        );
        ctx.fill();
      });

      if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#e879f9";
        ctx.font = "bold 40px 'Segoe UI', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Fim de jogo!", canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = "#f5f0ff";
        ctx.font = "20px 'Segoe UI', sans-serif";
        ctx.fillText(`Pontos: ${score} — clique ou espaço para reiniciar`, canvas.width / 2, canvas.height / 2 + 30);
      }
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function setDir(d) {
      const nd = DIRS[d];
      if (!nd) return;
      // não permite virar 180°
      if (nd.x === -dir.x && nd.y === -dir.y) return;
      nextDir = nd;
    }

    document.addEventListener("keydown", (e) => {
      const map = {
        ArrowUp: "up", KeyW: "up",
        ArrowDown: "down", KeyS: "down",
        ArrowLeft: "left", KeyA: "left",
        ArrowRight: "right", KeyD: "right",
      };
      if (map[e.code]) {
        e.preventDefault();
        if (gameOver) reset();
        setDir(map[e.code]);
      } else if (e.code === "Space" || e.code === "Enter") {
        e.preventDefault();
        if (gameOver) reset();
      }
    });

    canvas.addEventListener("click", () => { if (gameOver) reset(); });

    // Controles touch
    document.querySelectorAll("#pad button").forEach((btn) => {
      btn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        if (gameOver) reset();
        setDir(btn.dataset.dir);
      });
    });

    // Swipe no canvas
    let touchStart = null;
    canvas.addEventListener("touchstart", (e) => {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });
    canvas.addEventListener("touchend", (e) => {
      if (!touchStart) return;
      const dx = e.changedTouches[0].clientX - touchStart.x;
      const dy = e.changedTouches[0].clientY - touchStart.y;
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? "right" : "left");
      else if (dy !== 0) setDir(dy > 0 ? "down" : "up");
      touchStart = null;
    }, { passive: true });

    reset();
  </script>
</body>
</html>
