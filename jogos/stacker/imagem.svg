<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="100%">
      <stop offset="0%" stop-color="#3b1a6e"/>
      <stop offset="100%" stop-color="#120821"/>
    </radialGradient>
  </defs>

  <!-- fundo -->
  <rect width="480" height="300" fill="url(#bg)"/>

  <!-- estrelas -->
  <g fill="#e9d5ff">
    <circle cx="40" cy="40" r="2" opacity="0.7"/>
    <circle cx="120" cy="25" r="1.5" opacity="0.5"/>
    <circle cx="220" cy="50" r="2" opacity="0.6"/>
    <circle cx="360" cy="30" r="1.5" opacity="0.5"/>
    <circle cx="430" cy="70" r="2" opacity="0.7"/>
    <circle cx="410" cy="150" r="1.5" opacity="0.5"/>
    <circle cx="60" cy="130" r="1.5" opacity="0.6"/>
  </g>

  <!-- torre de blocos -->
  <g>
    <!-- base -->
    <rect x="120" y="252" width="240" height="24" rx="3" fill="hsl(275 85% 50%)"/>
    <rect x="120" y="252" width="240" height="5" fill="hsl(275 90% 70%)"/>
    <!-- linha 1 -->
    <rect x="138" y="228" width="180" height="24" rx="3" fill="hsl(291 85% 56%)"/>
    <rect x="138" y="228" width="180" height="5" fill="hsl(291 90% 74%)"/>
    <!-- linha 2 (um pedacinho pendurado) -->
    <rect x="186" y="204" width="180" height="24" rx="3" fill="hsl(307 85% 60%)"/>
    <rect x="186" y="204" width="180" height="5" fill="hsl(307 90% 78%)"/>
    <!-- linha 3 -->
    <rect x="156" y="180" width="120" height="24" rx="3" fill="hsl(323 85% 62%)"/>
    <rect x="156" y="180" width="120" height="5" fill="hsl(323 90% 80%)"/>
    <!-- bloco em movimento (brilhando) -->
    <rect x="210" y="126" width="90" height="24" rx="3" fill="hsl(339 90% 66%)" opacity="0.95"/>
    <rect x="210" y="126" width="90" height="5" fill="hsl(339 95% 84%)"/>
    <rect x="210" y="150" width="90" height="24" fill="#ffffff" opacity="0.12"/>
    <!-- setinha -->
    <path d="M255 108 l14 14 h-28 z" fill="#facc15"/>
  </g>

  <!-- presente no topo (meta) -->
  <g>
    <rect x="374" y="60" width="34" height="30" rx="4" fill="#facc15"/>
    <rect x="387" y="60" width="8" height="30" fill="#a855f7"/>
    <rect x="374" y="72" width="34" height="6" fill="#a855f7"/>
    <circle cx="391" cy="56" r="7" fill="#f472b6"/>
  </g>

  <!-- título -->
  <text x="240" y="46" text-anchor="middle" font-family="Segoe UI, sans-serif"
        font-size="44" font-weight="900" fill="#e879f9">Stacker</text>
  <text x="240" y="72" text-anchor="middle" font-family="Segoe UI, sans-serif"
        font-size="16" fill="#b9a8d9">empilhe blocos, chegue ao topo! 🎁</text>
</svg>
