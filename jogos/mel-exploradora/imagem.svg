<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8f3ff"/>
      <stop offset="1" stop-color="#8ed4ff"/>
    </linearGradient>
    <linearGradient id="mel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#f4a643"/>
    </linearGradient>
  </defs>

  <rect width="480" height="300" fill="url(#sky)"/>

  <!-- colinas -->
  <ellipse cx="120" cy="330" rx="240" ry="130" fill="#a8d89a"/>
  <ellipse cx="400" cy="350" rx="260" ry="150" fill="#84bf7c"/>
  <rect y="235" width="480" height="65" fill="#5d9e44"/>
  <rect y="235" width="480" height="10" fill="#7cc35b"/>

  <!-- rio -->
  <rect x="330" y="235" width="120" height="65" fill="#3aa5e0"/>
  <rect x="345" y="248" width="20" height="5" rx="2.5" fill="#ffffff" opacity="0.6"/>
  <rect x="390" y="262" width="24" height="5" rx="2.5" fill="#ffffff" opacity="0.6"/>
  <rect x="355" y="280" width="18" height="5" rx="2.5" fill="#ffffff" opacity="0.6"/>

  <!-- arvore -->
  <rect x="60" y="130" width="16" height="105" fill="#7a5230"/>
  <circle cx="68" cy="115" r="42" fill="#3f8f3f"/>
  <circle cx="42" cy="135" r="26" fill="#4da34d"/>
  <circle cx="96" cy="132" r="28" fill="#4da34d"/>

  <!-- sol -->
  <circle cx="420" cy="52" r="26" fill="#ffe066"/>

  <!-- Mel (salsichinha) -->
  <g>
    <!-- rabo -->
    <path d="M120 205 Q95 195 100 175" stroke="#f4a643" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- corpo -->
    <rect x="120" y="195" width="150" height="46" rx="23" fill="url(#mel)" stroke="#c07f2a" stroke-width="3"/>
    <!-- barriga -->
    <ellipse cx="195" cy="238" rx="26" ry="8" fill="#ffe4ad"/>
    <!-- patas -->
    <rect x="140" y="232" width="16" height="14" rx="7" fill="#e8923c"/>
    <rect x="235" y="232" width="16" height="14" rx="7" fill="#e8923c"/>
    <!-- orelha -->
    <ellipse cx="138" cy="198" rx="9" ry="16" fill="#e8923c" transform="rotate(-18 138 198)"/>
    <!-- focinho -->
    <rect x="252" y="207" width="34" height="20" rx="9" fill="#ffffff"/>
    <!-- nariz -->
    <circle cx="281" cy="214" r="5" fill="#4a2f1a"/>
    <!-- olho -->
    <circle cx="243" cy="210" r="5" fill="#3a2410"/>
    <circle cx="245" cy="208" r="1.8" fill="#ffffff"/>
  </g>

  <!-- onda de latido -->
  <g stroke="#ffd66b" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M300 205 A24 24 0 0 1 300 245"/>
    <path d="M318 193 A42 42 0 0 1 318 257"/>
  </g>

  <!-- estrelas -->
  <g fill="#ffd66b">
    <path d="M410 130 l6 14 15 2 -11 11 3 15 -13 -7 -13 7 3 -15 -11 -11 15 -2 z"/>
  </g>
  <circle cx="448" cy="150" r="5" fill="#ffd66b"/>
  <circle cx="385" cy="160" r="4" fill="#ffd66b"/>

  <!-- coração rosa -->
  <path d="M60 62 c-14 -16 -38 -6 -38 12 c0 16 18 26 38 40 c20 -14 38 -24 38 -40 c0 -18 -24 -28 -38 -12 z" fill="#ff6b9e" transform="translate(0,6)"/>
</svg>
