<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mel Exploradora</title>
<style>
  :root {
    --bg: #1a1028;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #wrap {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    background: #87ceeb;
    max-width: 100%; max-height: 100%;
    touch-action: none;
  }
  /* ---------- Overlay (menu / gameover / fim) ---------- */
  #overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10, 5, 25, .82);
    z-index: 10;
    padding: 12px;
  }
  #overlay.hidden { display: none; }
  .panel {
    background: linear-gradient(160deg, #2d1b4e, #1a1028);
    border: 3px solid #f4b860;
    border-radius: 18px;
    padding: 22px 26px;
    max-width: 560px; width: 100%;
    color: #fff;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
    max-height: 96%; overflow-y: auto;
  }
  .panel h1 {
    font-size: 34px; margin-bottom: 4px;
    background: linear-gradient(90deg, #ffd66b, #f48c4c, #ff7bac);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: #ffd66b;
  }
  .panel h2 { font-size: 22px; margin: 10px 0 6px; color: #ffd66b; }
  .panel p { font-size: 14px; line-height: 1.55; color: #e8defc; margin: 6px 0; }
  .panel .small { font-size: 12px; color: #b9a8dc; }
  .btn {
    display: inline-block;
    background: linear-gradient(180deg, #ffb347, #f48c4c);
    border: none; color: #fff;
    font-size: 17px; font-weight: 700;
    padding: 12px 26px; margin: 8px 5px;
    border-radius: 999px; cursor: pointer;
    box-shadow: 0 4px 0 #b5632b;
    transition: transform .08s;
    font-family: inherit;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b5632b; }
  .btn.green { background: linear-gradient(180deg, #7bd88f, #43a047); box-shadow: 0 4px 0 #2e7d32; }
  .btn.pink { background: linear-gradient(180deg, #ff9ec7, #f06292); box-shadow: 0 4px 0 #c2437a; }
  .lvl-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0 4px; }
  .lvl-btn {
    width: 62px; height: 62px; border-radius: 12px;
    background: #3b2a5e; border: 2px solid #7e6bb5;
    color: #fff; font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: 1.2;
  }
  .lvl-btn .ico { font-size: 20px; }
  .lvl-btn.locked { opacity: .35; cursor: not-allowed; }
  .lvl-btn:active:not(.locked) { transform: scale(.95); }
  kbd {
    background: #4a3a70; border-radius: 5px; padding: 1px 7px;
    font-size: 12px; font-family: inherit;
  }
  /* ---------- Touch controls ---------- */
  .touch {
    position: absolute; bottom: 10px; z-index: 5;
    display: flex; gap: 10px;
  }
  .touch.left { left: 12px; }
  .touch.right { right: 12px; }
  .tbtn {
    width: 62px; height: 62px; border-radius: 50%;
    background: rgba(255,255,255,.18);
    border: 2px solid rgba(255,255,255,.5);
    color: #fff; font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .tbtn:active { background: rgba(255,255,255,.45); }
  @media (min-width: 1000px) { .touch { display: none; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>

<div class="touch left" id="tleft">
  <div class="tbtn" data-k="L">◀</div>
  <div class="tbtn" data-k="R">▶</div>
</div>

<div class="touch right" id="tright">
  <div class="tbtn" data-k="B">🦴</div>
  <div class="tbtn" data-k="T">📢</div>
  <div class="tbtn" data-k="J">⤒</div>

<div id="overlay">
  <div class="panel" id="panel"></div>
</div>

  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * s) + "px";
  canvas.style.height = (H * s) + "px";
}
window.addEventListener("resize", fitCanvas);
fitCanvas();

// ------------------------- estado global -------------------------
const LEVELS = makeLevels();
let state = "menu";        // menu | intro | play | clear | over | ending
let levelIdx = 0;
let level = null;
let score = 0;
let lives = 3;
let totalKills = 0;       // mortes na corrida (bônus de vida a cada 10)
// localStorage pode ser bloqueado (iframe sandbox / privacidade do Chrome);
// se falhasse, o script inteiro morria e o canvas ficava só de azul (CSS).
const store = (() => {
  try { localStorage.getItem("mel-test"); return localStorage; }
  catch (e) { return null; }
})();
let unlocked = parseInt((store && store.getItem("mel-unlocked")) || "0", 10);
let time = 0;

// player
const P = {
  x: 100, y: GY, vx: 0, vy: 0, w: 46, h: 22,
  face: 1, onGround: false, energy: MAX_ENERGY,
  barkLvl: 0, boostT: 0, inv: 0, biteT: 0,
  dead: false, deadT: 0,
};

let camX = 0;
let enemies = [];
let pickups = [];
let stars = [];
let waves = [];   // ondas de latido
let particles = [];
let floaters = []; // textos flutuantes
let boss = null;
let introT = 0;
let clearT = 0;
let shakeT = 0;

// ------------------------- entrada -------------------------
const keys = {};
window.addEventListener("keydown", (e) => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  const k = e.key.toLowerCase();
  if (keys[k]) return;
  keys[k] = true;
  if (state === "intro" && (k === " " || k === "enter")) state = "play";
  if (state === "play") {
    if (k === "j" || k === " " || k === "arrowup" || k === "w") tryJump();
    if (k === "x") tryAttack("bite");
    if (k === "k") tryAttack("bark");
  }
});
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

// toques: botões visíveis (◀ ▶ e ações) + andar tocando nos lados da tela
let touch = { L:false, R:false, J:false, B:false, T:false };
document.querySelectorAll(".tbtn").forEach((b) => {
  const k = b.dataset.k;
  b.style.touchAction = "none"; b.style.userSelect = "none";
  const on = (e) => { e.preventDefault(); touch[k] = true;
    if (state === "intro" && (k === "J")) state = "play";
    if (state === "play" && k === "J") tryJump();
    if (state === "play" && (k === "B" || k === "T")) tryAttack(k === "B" ? "bite" : "bark");
  };
  const off = (e) => { e.preventDefault(); touch[k] = false; };
  b.addEventListener("pointerdown", on);
  b.addEventListener("pointerup", off);
  b.addEventListener("pointercancel", off);
  b.addEventListener("pointerleave", off);
});

// andar no celular: toque/segure na metade ESQUERDA da tela → anda pra
// esquerda; na metade DIREITA → anda pra direita (segurando continua).
// Swipe rápido pra cima = pular.
let movePtrs = new Map(); // pointerId -> "L" | "R" (toque nos lados da tela)
let sw = null; // swipe atual {id,x,y,t}
canvas.addEventListener("pointerdown", (e) => {
  const r = canvas.getBoundingClientRect();
  // o toque que começa a fase (intro) NÃO vira "andar"
  if (state === "intro") { state = "play"; return; }
  if (state === "play" && !movePtrs.has(e.pointerId)) {
    const mid = r.left + r.width / 2;
    const dir = e.clientX < mid ? "L" : "R";
    movePtrs.set(e.pointerId, dir);
  }
  sw = { id: e.pointerId, x: e.clientX, y: e.clientY, t: Date.now() };
});
function endPointer(e) {
  movePtrs.delete(e.pointerId);
  if (sw && sw.id === e.pointerId) {
    const dy = sw.y - e.clientY;
    if (state === "play" && dy > 45 && Date.now() - sw.t < 450) tryJump();
    sw = null;
  }
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
// solta tudo se a página perder o foco (ex.: botão do celular)
window.addEventListener("blur", () => {
  movePtrs.clear(); sw = null;
  for (const k in touch) touch[k] = false;
  for (const k in keys) keys[k] = false;
});

// entrada = teclado + botões visíveis (◀ ▶) + toque nos lados da tela
function inputLeft() {
  if (keys["arrowleft"] || keys["a"] || touch.L) return true;
  for (const d of movePtrs.values()) if (d === "L") return true;
  return false;
}
function inputRight() {
  if (keys["arrowright"] || keys["d"] || touch.R) return true;
  for (const d of movePtrs.values()) if (d === "R") return true;
  return false;
}

// ------------------------- física / helpers -------------------------
function rects(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function solids() {
  const s = [];
  for (const g of level.grounds)
    if (!g.water) s.push({ x: g.x, y: GY, w: g.w, h: H - GY, kind: "ground" });
  for (const p of level.plats)
    s.push({ x: p.x, y: p.y, w: p.w, h: 16, kind: "plat" });
  return s;
}
let SOLIDS = [];

function moveEntity(e, dt) {
  const solids = SOLIDS;
  // horizontal
  e.x += e.vx * dt;
  for (const s of solids) {
    if (rects(e, s)) {
      if (e.vx > 0) e.x = s.x - e.w;
      else if (e.vx < 0) e.x = s.x + s.w;
    }
  }
  if (e.x < 0) e.x = 0;
  if (e.x > level.width - e.w) e.x = level.width - e.w;
  // vertical
  e.vy += GRAV * dt;
  e.y += e.vy * dt;
  e.onGround = false;
  for (const s of solids) {
    if (rects(e, s)) {
      if (e.vy > 0 && e.y + e.h - e.vy * dt <= s.y + 6) {
        e.y = s.y - e.h; e.vy = 0; e.onGround = true;
      } else if (e.vy < 0) {
        e.y = s.y + s.h; e.vy = 0;
      }
    }
  }
}

function inWater(x, y) {
  for (const g of level.grounds) {
    if (g.water && x > g.x && x < g.x + g.w && y + P.h > GY + 4) return true;
  }
  return false;
}

// ------------------------- ações do player -------------------------
function tryJump() {
  if (P.dead) return;
  if (P.onGround) {
    P.vy = JUMP_V;
    P.onGround = false;
    puff(P.x + P.w/2, P.y + P.h, "#fff", 4);
  }
}

function tryAttack(kind) {
  if (P.dead) return;
  const cost = kind === "bite" ? BITE_COST : BARK_COST;
  if (P.energy < cost) {
    floater(P.x, P.y - 14, "sem energia!", "#ff9999");
    return;
  }
  if (kind === "bite") {
    if (P.biteT > 0) return;
    P.energy -= cost;
    P.biteT = 0.3;
    const box = {
      x: P.face > 0 ? P.x + P.w : P.x - 26,
      y: P.y - 4, w: 26, h: P.h + 8
    };
    for (const e of enemies) {
      if (e.dead) continue;
      if (rects(box, e)) {
        hurtEnemy(e, 1, P.face);
      }
    }
    if (boss && !boss.dead && rects(box, boss)) hurtBoss(1);
  } else {
    P.energy -= cost;
    const r = 18 + P.barkLvl * 9;
    const dmg = 1 + P.barkLvl;
    waves.push({ x: P.x + P.w/2 + P.face * 20, y: P.y + P.h/2, vx: P.face * (380 + P.barkLvl * 80), r, life: 1.1, dmg });
    shakeT = Math.max(shakeT, 0.08 + P.barkLvl * 0.05);
  }
}

function hurtEnemy(e, dmg, dir) {
  e.hp -= dmg;
  e.flash = 0.15;
  if (dir) e.x += dir * 14;
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  e.dead = true;
  totalKills++;
  score += 100;
  floater(e.x, e.y - 20, "+100", "#ffe066");
  puff(e.x + e.w/2, e.y + e.h/2, "#ff8888", 8);
  for (const a of enemies) {
    if (!a.dead && a !== e && Math.abs(a.x - e.x) < 60) { a.dead = true; puff(a.x, a.y, "#ccc", 6); }
  }
  // bônus: +1 vida a cada 10 inimigos eliminados na corrida
  if (totalKills % 10 === 0) {
    if (lives < MAX_LIVES) { lives++; floater(P.x, P.y - 40, "+1 vida ❤️ (10 inimigos!)", "#ff9ec7"); }
    else { score += 500; floater(P.x, P.y - 40, "vidas cheias! +500", "#ff9ec7"); }
  }
}

function hurtPlayer() {
  if (P.inv > 0 || P.dead) return;
  lives--;
  P.inv = 2;
  P.vy = -400;
  P.vx = 0;
  shakeT = 0.3;
  floater(P.x, P.y - 20, "au! 🥺", "#ff9999");
  if (lives <= 0) {
    P.dead = true; P.deadT = 1.2;
    state = "over";
  }
}

// ------------------------- montagem da fase -------------------------
function startLevel(i) {
  levelIdx = i;
  level = LEVELS[i];
  SOLIDS = solids();
  lives = Math.max(lives, 1);
  P.x = 100; P.y = GY - P.h; P.vx = 0; P.vy = 0; P.face = 1;
  P.energy = MAX_ENERGY; P.barkLvl = 0; P.boostT = 0; P.inv = 1; P.dead = false; P.biteT = 0;
  camX = 0; waves = []; particles = []; floaters = [];
  rebuildLevelActors();
  state = "intro"; introT = 0;
  if (unlocked < i) unlocked = i;
  hideOverlay();
}

function rebuildLevelActors() {
  enemies = level.enemies.map((e) => {
    const w = e.t === "car" ? 74 : 34;
    const h = e.t === "car" ? 34 : e.t === "puppy" ? 24 : 22;
    const gy = e.y ?? GY;
    const grounded = gy === GY;
    return {
      t: e.t, x: e.x, y: grounded ? GY - h : gy, vx: 0, vy: 0,
      w, h,
      hp: e.t === "car" ? 3 : e.t === "puppy" ? 2 : 1,
      dir: e.dir || (Math.random() < .5 ? -1 : 1),
      baseX: e.x, baseY: grounded ? GY - h : gy,
      ph: Math.random() * 6.28,
      dead: false, flash: 0, jumpT: Math.random() * 2,
    };
  });
  fixPatrols();
  pickups = [];
  for (const f of level.foods) pickups.push({ k: "food", x: f.x, y: f.y, w: 22, h: 20, got: false, ph: Math.random() * 6 });
  for (const b of level.bones)  pickups.push({ k: "bone", x: b.x, y: b.y, w: 26, h: 16, got: false, ph: Math.random() * 6 });
  for (const c of level.carrots) pickups.push({ k: "carrot", x: c.x, y: c.y, w: 22, h: 20, got: false, ph: Math.random() * 6 });
  for (const h of level.hearts || []) pickups.push({ k: "heart", x: h.x, y: h.y, w: 22, h: 20, got: false, ph: Math.random() * 6 });
  stars = level.stars.map((s, i) => ({ x: s.x, y: s.y, got: false, tier: i }));
  if (level.boss) {
    boss = { x: level.bossData.x, y: GY - 56, w: 62, h: 56, vx: 0, vy: 0, hp: 14, maxHp: 14,
             dir: -1, chargeT: 0, jumpT: 2, state: "idle", flash: 0, dead: false, deadT: 0 };
  } else boss = null;
}

// ------------------------- chefe -------------------------
function hurtBoss(dmg) {
  if (boss.dead) return;
  boss.hp -= dmg;
  boss.flash = 0.15;
  score += 25;
  floater(boss.x + boss.w/2, boss.y - 10, "+" + 25, "#ffe066");
  if (boss.hp <= 0) {
    boss.dead = true;
    boss.deadT = 1.6;
    shakeT = 0.6;
    score += 1000;
    floater(boss.x + boss.w/2, boss.y - 30, "+1000 🏆", "#ffd66b");
  }
}

function updateBoss(dt) {
  if (!boss) return;
  if (boss.dead) {
    boss.deadT -= dt;
    if (boss.deadT <= 0 && state === "play") { state = "ending"; }
    return;
  }
  boss.flash = Math.max(0, boss.flash - dt);
  // física simples no chão
  boss.vy += GRAV * dt;
  boss.y += boss.vy * dt;
  if (boss.y + boss.h > GY) { boss.y = GY - boss.h; boss.vy = 0; }

  boss.chargeT -= dt;
  boss.jumpT -= dt;

  const dx = P.x - boss.x;
  const absd = Math.abs(dx);

  if (boss.state === "idle") {
    boss.vx = Math.abs(boss.vx) * 0.8;
    if (boss.jumpT <= 0 && absd < 300) {
      boss.vy = -700;
      boss.dir = dx > 0 ? 1 : -1;
      boss.jumpT = 2.2 + Math.random();
    }
    if (boss.chargeT <= 0) {
      boss.state = "charge";
      boss.dir = dx > 0 ? 1 : -1;
      boss.chargeT = 0.001;
    }
  } else {
    // carregando em direção ao player
    boss.vx = boss.dir * 260;
    if (Math.random() < 0.3) puff(boss.x + boss.w/2, boss.y + boss.h, "#c98a5b", 1);
    if (absd < 120) {
      boss.state = "idle";
      boss.chargeT = 1.6 + Math.random() * 1.2;
    }
    if (boss.x <= 20 || boss.x + boss.w >= level.width - 20) {
      boss.state = "idle"; boss.chargeT = 1.2; boss.dir *= -1;
    }
  }
  boss.x += boss.vx * dt;

  // colisão com o player
  if (rects(boss, P)) {
    if (P.vy > 100 && P.y + P.h - boss.y < 30) {
      // pisada
      P.vy = JUMP_V * 0.8;
      hurtBoss(1);
    } else {
      hurtPlayer();
      P.x += (P.x < boss.x ? -30 : 30);
    }
  }
  // ondas de latido
  for (const w of waves) {
    if (w.dead) continue;
    if (w.x + w.r > boss.x && w.x - w.r < boss.x + boss.w &&
        w.y + w.r > boss.y && w.y - w.r < boss.y + boss.h) {
      hurtBoss(w.dmg);
      w.dead = true;
      puff(w.x, w.y, "#ffd66b", 10);
    }
  }
}

// ------------------------- update -------------------------
function update(dt) {
  time += dt;
  if (shakeT > 0) shakeT -= dt;
  if (state === "intro") {
    introT += dt;
    if (introT > 2.6) state = "play";
    return;
  }
  if (state === "clear") {
    clearT += dt;
    animateFx(dt);
    if (clearT > 2) {
      if (levelIdx >= LEVELS.length - 1) state = "ending";
      else startLevel(levelIdx + 1);
    }
    return;
  }
  if (state === "over") {
    // anima a queda da Mel e conta o tempo até abrir o painel de game over
    if (P.dead) { P.deadT -= dt; P.y += 300 * dt; }
    animateFx(dt);
    return;
  }
  if (state !== "play") return;

  // ----- player -----
  if (!P.dead) {
    const spd = P.boostT > 0 ? BOOST_SPEED : BASE_SPEED;
    let ax = 0;
    if (inputLeft()) ax -= 1;
    if (inputRight()) ax += 1;
    if (ax !== 0) {
      P.vx = ax * spd;
      P.face = ax;
    } else {
      P.vx *= P.onGround ? 0.72 : 0.94;
      if (Math.abs(P.vx) < 8) P.vx = 0;
    }
    P.energy = Math.min(MAX_ENERGY, P.energy + ENERGY_REGEN * dt);
    P.biteT = Math.max(0, P.biteT - dt);
    P.inv = Math.max(0, P.inv - dt);
    P.boostT = Math.max(0, P.boostT - dt);
    if (P.boostT > 0 && Math.random() < 0.4)
      puff(P.x + (P.face > 0 ? 0 : P.w), P.y + P.h/2, "#ffe066", 1);

    moveEntity(P, dt);

    // caiu no buraco ou no rio
    if (P.y > H + 60 || (inWater(P.x + P.w/2, P.y) )) {
      lives--;
      shakeT = 0.4;
      if (lives <= 0) { P.dead = true; P.deadT = 1.2; state = "over"; }
      else {
        P.inv = 2.5;
        // respawn no chão mais próximo à esquerda
        let rx = 100;
        for (const g of level.grounds) {
          if (!g.water && g.x + g.w > P.x && g.x < P.x + 200) rx = g.x + 30;
        }
        P.x = Math.max(100, rx - P.w); P.y = GY - P.h - 40;
        P.vx = 0; P.vy = 0;
      }
    }

    // coletar
    for (const p of pickups) {
      if (p.got) continue;
      const box = { x: p.x - 4, y: p.y - 8 + Math.sin(time * 3 + p.ph) * 4, w: p.w, h: p.h };
      if (rects(P, box)) {
        p.got = true;
        if (p.k === "food") {
          P.energy = Math.min(MAX_ENERGY, P.energy + 40);
          score += 50;
          floater(p.x, p.y - 20, "+40⚡ +50", "#8ef08e");
        } else if (p.k === "bone") {
          P.barkLvl = Math.min(2, P.barkLvl + 1);
          score += 100;
          floater(p.x, p.y - 20, "LATIO TURBINADO! 📢", "#ffd66b");
        } else if (p.k === "carrot") {
          P.boostT = 6;
          score += 100;
          floater(p.x, p.y - 20, "TURBO! 🥕", "#ffb347");
        } else if (p.k === "heart") {
          if (lives < MAX_LIVES) {
            lives++;
            floater(p.x, p.y - 20, "+1 vida ❤️", "#ff9ec7");
          } else {
            score += 100;
            floater(p.x, p.y - 20, "vidas cheias! +100", "#ff9ec7");
          }
        }
        puff(p.x + 10, p.y + 10, "#fff", 5);
      }
    }

    // estrelas (fim de fase): quanto mais alto, mais pontos
    for (const s of stars) {
      if (s.got) continue;
      if (Math.abs(P.x + P.w/2 - s.x) < 30 && Math.abs(P.y + P.h/2 - s.y) < 30) {
        s.got = true;
        const pts = [100, 300, 600][s.tier];
        score += pts;
        floater(s.x, s.y - 30, "⭐ +" + pts, "#ffd66b");
        puff(s.x, s.y, "#ffe066", 14);
        state = "clear"; clearT = 0;
        if (levelIdx + 1 > unlocked) unlocked = levelIdx + 1;
        if (store) store.setItem("mel-unlocked", String(Math.min(unlocked, LEVELS.length - 1)));
      }
    }

    // inimigos
    for (const e of enemies) {
      if (e.dead) continue;
      e.flash = Math.max(0, (e.flash || 0) - dt);
      updateEnemy(e, dt);
      if (e.dead) continue;
      // caiu no rio / fora do mundo: some
      if (e.y > H + 80) { e.dead = true; continue; }
      if (rects(e, P)) {
        if (P.vy > 120 && P.y + P.h - e.y < 22) {
          P.vy = JUMP_V * 0.75;
          killEnemy(e);
        } else {
          hurtPlayer();
          P.x += (P.x < e.x ? -26 : 26);
        }
      }
    }

    // ondas de latido vs inimigos
    for (const w of waves) {
      if (w.dead) continue;
      for (const e of enemies) {
        if (e.dead) continue;
        if (w.x + w.r > e.x && w.x - w.r < e.x + e.w &&
            w.y + w.r > e.y && w.y - w.r < e.y + e.h) {
          hurtEnemy(e, w.dmg, w.vx > 0 ? 1 : -1);
          w.dead = true;
          puff(w.x, w.y, "#ffd66b", 8);
        }
      }
    }
  } else {
    P.deadT -= dt;
    P.y += 300 * dt;
  }

  updateBoss(dt);

  animateFx(dt);

  // câmera
  const target = Math.max(0, Math.min(level.width - W, P.x - W / 2 + P.w / 2));
  camX += (target - camX) * Math.min(1, dt * 6);
}

function animateFx(dt) {
  // ondas
  for (const w of waves) {
    if (w.dead) continue;
    w.x += w.vx * dt;
    w.life -= dt;
    if (w.life <= 0 || w.x < camX - 60 || w.x > camX + W + 60) w.dead = true;
  }
  waves = waves.filter(w => !w.dead);
  // partículas
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 800 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  // textos flutuantes
  for (const f of floaters) { f.y -= 40 * dt; f.life -= dt; }
  floaters = floaters.filter(f => f.life > 0);
}

function updateEnemy(e, dt) {
  const spd = e.t === "car" ? 220 : e.t === "puppy" ? 130 : 60;
  switch (e.t) {
    case "frog":
      e.jumpT -= dt;
      if (e.x <= e.patMin && e.dir < 0) e.dir = 1;
      if (e.x + e.w >= e.patMax && e.dir > 0) e.dir = -1;
      // não pula se o rio fica à frente
      const ax = e.x + e.w / 2 + e.dir * 40;
      const waterAhead = level.grounds.some(g => g.water && ax > g.x - 12 && ax < g.x + g.w + 12);
      if (!waterAhead && e.onGround && e.jumpT <= 0) { e.vy = -420; e.jumpT = 1.4 + Math.random(); }
      e.vx = e.dir * 70;
      if (e.onGround) { e.onGround = false; }
      moveEntity(e, dt);
      // volta para casa se pulou longe
      if (Math.abs(e.x - e.baseX) > 160) e.dir *= -1;
      break;
    case "flyer":
      e.x += e.dir * 120 * dt;
      e.y = e.baseY + Math.sin(time * 2 + e.ph) * 46;
      if (e.x < e.baseX - 180 || e.x > e.baseX + 180) e.dir *= -1;
      break;
    default:
      if (e.t === "car") {
        e.vx = e.dir * spd;
      } else {
        e.vx = e.dir * spd;
      }
      moveEntity(e, dt);
      // patrol
      if (e.x <= e.patMin && e.dir < 0) e.dir = 1;
      if (e.x + e.w >= e.patMax && e.dir > 0) e.dir = -1;
  }
  if (e.t === "car" && (e.x < 40 || e.x + e.w > level.width - 40)) e.dir *= -1;
}
// seta patMin/patMax ao montar
function fixPatrols() {
  for (const e of enemies) {
    if (e.t === "flyer") continue;
    // achou o chão sob ele e limita
    let minX = 30, maxX = level.width - 30;
    for (const g of level.grounds) {
      if (!g.water && e.x + e.w > g.x && e.x < g.x + g.w && Math.abs(e.y + e.h - GY) < 5) {
        minX = g.x + 6; maxX = g.x + g.w - e.w - 6;
      }
    }
    e.patMin = minX; e.patMax = maxX;
    e.baseX = e.baseX ?? e.x;
  }
}

// decorações pequenas no chão pra o mundo não ficar vazio
function drawGroundDeco(th) {
  const sp = 210;
  for (let i = Math.floor(camX / sp) - 1; i < Math.floor((camX + W) / sp) + 2; i++) {
    const wx = i * sp + 70;
    const g = level.grounds.find(r => !r.water && wx >= r.x + 30 && wx <= r.x + r.w - 50);
    if (!g) continue;
    const seed = i * 733 + levelIdx * 131 + 17;
    const r = (seed % 100 + 100) % 100;
    const dx = wx + (r % 50);
    ctx.save();
    const tuft = () => {
      ctx.strokeStyle = th.deco === "city" ? "#8a92a0" : "#5cb85c"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(dx, GY); ctx.lineTo(dx - 3, GY - 9);
      ctx.moveTo(dx + 4, GY); ctx.lineTo(dx + 4, GY - 11);
      ctx.moveTo(dx + 8, GY); ctx.lineTo(dx + 11, GY - 8);
      ctx.stroke();
    };
    const bush = () => {
      ctx.fillStyle = "#4f9e4f";
      ctx.beginPath();
      ctx.arc(dx, GY - 4, 9, 0, 7);
      ctx.arc(dx + 11, GY - 3, 7, 0, 7);
      ctx.fill();
    };
    const hydrant = () => {
      ctx.fillStyle = "#e74c6a";
      roundRect(dx, GY - 13, 10, 13, 3); ctx.fill();
      ctx.beginPath(); ctx.arc(dx + 5, GY - 13, 4, 0, 7); ctx.fill();
    };
    switch (th.deco) {
      case "tree":
        if (r % 4 === 0) { // flor
          ctx.strokeStyle = "#4f9e4f"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(dx, GY); ctx.lineTo(dx, GY - 9); ctx.stroke();
          ctx.fillStyle = r % 2 ? "#ff7bac" : "#ffd66b";
          ctx.beginPath(); ctx.arc(dx, GY - 11, 4, 0, 7); ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.beginPath(); ctx.arc(dx, GY - 11, 1.6, 0, 7); ctx.fill();
        } else if (r % 4 === 1) bush();
        else if (r % 4 === 2) { // pedrinha
          ctx.fillStyle = "#9aa0a6";
          ctx.beginPath(); ctx.ellipse(dx, GY - 3, 8, 5, 0, 0, 7); ctx.fill();
        } else tuft();
        break;
      case "road":
        if (r % 2 === 0) { // cercado de madeira
          ctx.fillStyle = "#cbb287";
          ctx.fillRect(dx, GY - 16, 4, 16);
          ctx.fillRect(dx + 20, GY - 16, 4, 16);
          ctx.fillRect(dx - 2, GY - 12, 28, 4);
          ctx.fillRect(dx - 2, GY - 6, 28, 4);
        } else tuft();
        break;
      case "house":
        if (r % 3 === 0) { // caixa de correio
          ctx.fillStyle = "#8a5a3b";
          ctx.fillRect(dx + 6, GY - 10, 3, 10);
          ctx.fillStyle = "#e74c3c";
          roundRect(dx, GY - 20, 15, 11, 3); ctx.fill();
        } else if (r % 3 === 1) hydrant();
        else bush();
        break;
      case "city":
        if (r % 3 === 0) { // lampião
          ctx.fillStyle = "#3a3f4a";
          ctx.fillRect(dx + 4, GY - 46, 4, 46);
          ctx.fillStyle = "#ffe9a8";
          ctx.beginPath(); ctx.arc(dx + 6, GY - 48, 5, 0, 7); ctx.fill();
        } else if (r % 3 === 1) { // lixeira
          ctx.fillStyle = "#555b66";
          roundRect(dx, GY - 16, 14, 16, 3); ctx.fill();
          ctx.fillStyle = "#6a7280";
          ctx.fillRect(dx - 2, GY - 18, 18, 4);
        } else hydrant();
        break;
      case "shelter":
        if (r % 2 === 0) { // tigela de ração
          ctx.fillStyle = "#8a5a3b";
          ctx.beginPath();
          ctx.moveTo(dx, GY - 8); ctx.lineTo(dx + 16, GY - 8);
          ctx.lineTo(dx + 13, GY); ctx.lineTo(dx + 3, GY);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = "#6e4630";
          ctx.beginPath(); ctx.ellipse(dx + 8, GY - 8, 8, 2.5, 0, 0, 7); ctx.fill();
        } else { // caixinha
          ctx.fillStyle = "#d8b878";
          roundRect(dx, GY - 12, 16, 12, 2); ctx.fill();
          ctx.strokeStyle = "#a8884f"; ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(dx + 2, GY - 9); ctx.lineTo(dx + 14, GY - 9);
          ctx.moveTo(dx + 2, GY - 4); ctx.lineTo(dx + 14, GY - 4);
          ctx.stroke();
        }
        break;
    }
    // segundo item pequeno pra dar mais vida ao chão
    const r2 = (seed * 7 + 11) % 100;
    if (r2 < 65) {
      const dx2 = wx + 90 + (r2 % 70);
      if (dx2 < g.x + g.w - 16) {
        if (th.deco === "city") {
          ctx.fillStyle = "#6a7280";
          ctx.beginPath(); ctx.ellipse(dx2, GY - 2, 6, 3, 0, 0, 7); ctx.fill();
        } else if (th.deco === "tree") {
          ctx.strokeStyle = "#5cb85c"; ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(dx2, GY); ctx.lineTo(dx2 - 2, GY - 7);
          ctx.moveTo(dx2 + 3, GY); ctx.lineTo(dx2 + 3, GY - 8);
          ctx.stroke();
        } else {
          ctx.fillStyle = "rgba(255,255,255,.28)";
          ctx.beginPath(); ctx.ellipse(dx2, GY - 2, 5, 2.5, 0, 0, 7); ctx.fill();
        }
      }
    }
    ctx.restore();
  }
}

// ------------------------- desenho -------------------------
function draw() {
  ctx.save();
  if (shakeT > 0) ctx.translate((Math.random() - .5) * shakeT * 30, (Math.random() - .5) * shakeT * 30);

  const th = THEME[level ? level.theme : "floresta"];
  // céu
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, th.sky2);
  sky.addColorStop(1, th.sky);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // fundo decorativo (paralaxe)
  drawDecos(th);

  // mundo
  ctx.save();
  ctx.translate(-camX, 0);

  // rios
  for (const g of level.grounds) {
    if (!g.water) continue;
    ctx.fillStyle = "#3aa5e0";
    ctx.fillRect(g.x, GY, g.w, H - GY);
    ctx.fillStyle = "rgba(255,255,255,.35)";
    for (let i = 0; i < g.w; i += 26) {
      const off = Math.sin(time * 2 + (g.x + i) * 0.1) * 4;
      ctx.fillRect(g.x + i + 8, GY + 10 + off, 12, 4);
    }
  }

  // chão
  for (const g of level.grounds) {
    if (g.water) continue;
    ctx.fillStyle = th.ground;
    ctx.fillRect(g.x, GY, g.w, H - GY);
    ctx.fillStyle = th.grass;
    ctx.fillRect(g.x, GY, g.w, 10);
    // textura
    ctx.fillStyle = "rgba(0,0,0,.08)";
    for (let i = g.x + 14; i < g.x + g.w - 8; i += 34)
      ctx.fillRect(i, GY + 24 + ((i * 7) % 17), 10, 5);
  }

  // decorações do chão (florzinha, arbusto, cerca, lampião...)
  drawGroundDeco(th);

  // plataformas
  for (const p of level.plats) {
    ctx.fillStyle = th.grass;
    ctx.fillRect(p.x, p.y, p.w, 16);
    ctx.fillStyle = th.ground;
    ctx.fillRect(p.x, p.y + 12, p.w, 6);
    ctx.fillStyle = "rgba(0,0,0,.15)";
    ctx.fillRect(p.x, p.y, 4, 16); ctx.fillRect(p.x + p.w - 4, p.y, 4, 16);
  }

  // estrelas de fim de fase
  for (const s of stars) {
    if (s.got) continue;
    const bob = Math.sin(time * 3 + s.x) * 6;
    drawStar(s.x, s.y + bob, 14 + s.tier * 2, "#ffd66b", s.tier === 2 ? "#fff" : null);
    // poste decorativo até a estrela mais baixa
    if (s.tier === 0) {
      ctx.strokeStyle = "rgba(0,0,0,.3)";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(s.x, GY); ctx.lineTo(s.x, s.y + 20); ctx.stroke();
    }
  }

  // pickups
  for (const p of pickups) {
    if (p.got) continue;
    const y = p.y + Math.sin(time * 3 + p.ph) * 4;
    if (p.k === "food") drawFood(p.x, y);
    else if (p.k === "bone") drawBone(p.x, y, P.barkLvl);
    else if (p.k === "heart") {
      const pul = Math.sin(time * 4 + p.ph) * 1.5;
      drawHeart(p.x + 11, y + 11, 10.5 + pul, "#d94f80");
      drawHeart(p.x + 11, y + 11, 8.5 + pul, "#ff7ba6");
    }
    else drawCarrot(p.x, y);
  }

  // inimigos
  for (const e of enemies) if (!e.dead) drawEnemy(e);

  // chefe
  if (boss) drawBoss();

  // ondas de latido
  for (const w of waves) {
    ctx.strokeStyle = "rgba(255,214,107,.9)";
    ctx.lineWidth = 4;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(w.x, w.y, w.r - i * 7, -1.2 + (w.vx > 0 ? 0 : Math.PI), 1.2 + (w.vx > 0 ? 0 : Math.PI));
      ctx.stroke();
    }
  }

  // player
  drawMel();

  // partículas
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
  }
  ctx.globalAlpha = 1;

  // textos flutuantes
  ctx.font = "bold 16px system-ui";
  ctx.textAlign = "center";
  for (const f of floaters) {
    ctx.globalAlpha = Math.min(1, f.life);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "left";

  ctx.restore();
  ctx.restore();

  // HUD
  drawHUD();

  // overlays de estado
  if (state === "intro") drawIntro();
  if (state === "clear") drawClear();
  if (state === "over" && P.dead) {
    ctx.fillStyle = "rgba(0,0,0,.5)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 44px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("Fim de jogo!", W / 2, H / 2 - 10);
    ctx.font = "20px system-ui";
    ctx.fillText("A Mel vai tentar de novo...", W / 2, H / 2 + 30);
    ctx.textAlign = "left";
  }
}

function drawDecos(th) {
  // nuvens (paralaxe lenta)
  ctx.fillStyle = "rgba(255,255,255,.8)";
  for (let i = 0; i < 5; i++) {
    const cx = ((i * 430 + time * 12) % (W + 300)) - 150 - (camX * 0.15 % 300);
    const cy = 50 + (i * 37) % 90;
    ctx.beginPath();
    ctx.arc(cx, cy, 22, 0, 7); ctx.arc(cx + 26, cy - 8, 18, 0, 7); ctx.arc(cx + 48, cy, 20, 0, 7);
    ctx.fill();
  }
  // cenário (paralaxe 0.5)
  const px = camX * 0.5;
  const sp = 480;
  for (let i = Math.floor(px / sp) - 1; i < Math.floor((px + W) / sp) + 2; i++) {
    const x = i * sp - px;
    const seed = i * 9301 + (level ? levelIdx * 4929 : 1);
    const r = (seed % 100 + 100) % 100;
    switch (th.deco) {
      case "tree":
        ctx.fillStyle = "#7a5230";
        ctx.fillRect(x + 20, GY - 70, 16, 70);
        ctx.fillStyle = "#3f8f3f";
        ctx.beginPath(); ctx.arc(x + 28, GY - 85, 32 + r % 12, 0, 7); ctx.fill();
        break;
      case "road":
        ctx.fillStyle = "#88847e";
        ctx.fillRect(x, GY - 4, sp, 4);
        ctx.fillStyle = "#f5d76e";
        ctx.fillRect(x + r, GY - 3, 34, 3);
        ctx.fillStyle = "#5b6e8c";
        ctx.fillRect(x + 120 + r % 80, GY - 120, 70, 116);
        ctx.fillStyle = "#2f3b52";
        ctx.fillRect(x + 132 + r % 80, GY - 105, 46, 40);
        break;
      case "house": {
        const hc = ["#e8a87c", "#a8c8e8", "#e8d8a8"][(r % 3)];
        ctx.fillStyle = hc;
        ctx.fillRect(x + 40, GY - 100, 110, 100);
        ctx.fillStyle = "#b5654a";
        ctx.beginPath();
        ctx.moveTo(x + 30, GY - 100); ctx.lineTo(x + 95, GY - 145); ctx.lineTo(x + 160, GY - 100);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#5b4a6e";
        ctx.fillRect(x + 70, GY - 70, 26, 40);
        ctx.fillStyle = "#cfe8ff";
        ctx.fillRect(x + 50, GY - 84, 22, 20);
        ctx.fillRect(x + 118, GY - 84, 22, 20);
        break;
      }
      case "city":
        ctx.fillStyle = `hsl(${230 + r % 40}, 20%, ${30 + r % 15}%)`;
        const bh = 140 + r * 2;
        ctx.fillRect(x + 30, GY - bh, 100 + r % 40, bh);
        ctx.fillStyle = "rgba(255,255,200,.7)";
        for (let wy = 0; wy < bh - 30; wy += 26)
          for (let wx = 0; wx < 3; wx++)
            if ((wx + wy + r) % 3 !== 0)
              ctx.fillRect(x + 44 + wx * 28, GY - bh + 14 + wy, 14, 12);
        break;
      case "shelter":
        ctx.fillStyle = "#e8c8a8";
        ctx.fillRect(x + 30, GY - 90, 130, 90);
        ctx.fillStyle = "#d97b6b";
        ctx.beginPath();
        ctx.moveTo(x + 20, GY - 90); ctx.lineTo(x + 95, GY - 130); ctx.lineTo(x + 170, GY - 90);
        ctx.closePath(); ctx.fill();
        drawHeart(x + 95, GY - 108, 12, "#ff6b9e");
        break;
    }
  }
}

// ---------- Mel (a salsichinha) ----------
function drawMel() {
  if (P.dead && P.y > H + 100) return;
  const x = P.x, f = P.face, w = P.w;
  const moving = P.onGround && Math.abs(P.vx) > 20;
  const t14 = time * 14;
  const hop = moving ? Math.abs(Math.sin(t14)) * 3 : 0;
  const yy = P.y - hop;
  ctx.save();
  if (P.inv > 0 && Math.floor(time * 12) % 2 === 0) ctx.globalAlpha = 0.4;
  if (P.boostT > 0) { ctx.shadowColor = "#ffd66b"; ctx.shadowBlur = 14; }

  // ---- rabo (abanando) ----
  const wag = Math.sin(time * 12) * 5;
  ctx.strokeStyle = "#f4a643"; ctx.lineWidth = 5; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(f > 0 ? x + 5 : x + w - 5, yy + 10);
  ctx.quadraticCurveTo(f > 0 ? x - 8 : x + w + 8, yy + 6 + wag, f > 0 ? x - 11 : x + w + 11, yy - 1 + wag);
  ctx.stroke();

  // ---- 4 perninhas (animadas enquanto anda) ----
  const step = moving ? Math.sin(t14) * 3 : 0;
  const L1 = 7, L2 = 15, L3 = w - 20, L4 = w - 12; // distâncias da borda esquerda
  const farXs = f > 0 ? [L1 - step, L3 - step] : [w - L1 - 5 + step, w - L3 - 5 + step];
  const nearXs = f > 0 ? [L2 + step, L4 + step] : [w - L2 - 5 - step, w - L4 - 5 - step];
  const drawLegs = (xs, color) => {
    ctx.fillStyle = color;
    for (const lx of xs) { roundRect(x + lx, yy + 13, 5, 9, 2.5); ctx.fill(); }
  };
  drawLegs(farXs, "#d97f2b");  // par mais distante (mais escuro)
  drawLegs(nearXs, "#f4a643");

  // ---- corpo salsicha ----
  const grad = ctx.createLinearGradient(0, yy + 2, 0, yy + 18);
  grad.addColorStop(0, "#ffd27a");
  grad.addColorStop(1, "#f4a643");
  ctx.fillStyle = grad;
  roundRect(x, yy + 2, w, 15, 7.5);
  ctx.fill();
  ctx.shadowBlur = 0;
  // barriguinha
  ctx.fillStyle = "#ffe4ad";
  ctx.beginPath(); ctx.ellipse(x + w / 2, yy + 15, w * 0.32, 3.5, 0, 0, 7); ctx.fill();
  // contorno do corpo
  ctx.strokeStyle = "#c07f2a"; ctx.lineWidth = 1.6;
  roundRect(x, yy + 2, w, 15, 7.5); ctx.stroke();

  // ---- orelha caidinha (atrás da cabeça) ----
  ctx.fillStyle = "#e8923c";
  const earSwing = moving ? Math.sin(t14) * 1.5 : 0;
  ctx.beginPath();
  ctx.ellipse(f > 0 ? x + w - 15 : x + 15, yy + 4 + earSwing, 4, 7.5, f > 0 ? -0.35 : 0.35, 0, 7);
  ctx.fill();

  // ---- cabeça ----
  const hx = f > 0 ? x + w - 6 : x + 6;
  ctx.fillStyle = "#ffd27a";
  ctx.beginPath(); ctx.arc(hx, yy + 6, 9, 0, 7); ctx.fill();
  ctx.strokeStyle = "#c07f2a"; ctx.lineWidth = 1.6;
  ctx.beginPath();
  if (f > 0) ctx.arc(hx, yy + 6, 9, -2.1, 2.1);
  else ctx.arc(hx, yy + 6, 9, Math.PI - 2.1, Math.PI + 2.1);
  ctx.stroke();

  // focinho branco
  ctx.fillStyle = "#fff";
  roundRect(f > 0 ? x + w - 10 : x - 4, yy + 6, 14, 9, 4);
  ctx.fill();
  // nariz
  ctx.fillStyle = "#4a2f1a";
  ctx.beginPath(); ctx.arc(f > 0 ? x + w + 2 : x - 2, yy + 9, 3, 0, 7); ctx.fill();
  // línguinha no pulo
  if (!P.onGround) {
    ctx.fillStyle = "#ff8fa3";
    roundRect(f > 0 ? x + w - 3 : x - 5, yy + 14, 4, 5, 2); ctx.fill();
  }
  // olhinho
  ctx.fillStyle = "#3a2410";
  ctx.beginPath(); ctx.arc(f > 0 ? x + w - 9 : x + 9, yy + 3.5, 2.8, 0, 7); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(f > 0 ? x + w - 8 : x + 8, yy + 2.5, 1, 0, 7); ctx.fill();
  // bochechinha
  ctx.fillStyle = "rgba(255,120,150,.35)";
  ctx.beginPath(); ctx.arc(f > 0 ? x + w - 12 : x + 12, yy + 6.5, 2.2, 0, 7); ctx.fill();

  // ---- coleirinha vermelha com plaquinha ----
  const cx = f > 0 ? x + w - 12 : x + 12;
  ctx.fillStyle = "#e74c3c";
  roundRect(cx - 2, yy + 8, 4, 7, 2); ctx.fill();
  ctx.fillStyle = "#ffd66b";
  ctx.beginPath(); ctx.arc(cx, yy + 16, 2, 0, 7); ctx.fill();

  // mordida!
  if (P.biteT > 0.18) {
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
    const bx = f > 0 ? x + w + 4 : x - 4;
    ctx.beginPath();
    ctx.moveTo(bx, yy + 8); ctx.lineTo(bx + f * 14, yy + 4);
    ctx.moveTo(bx, yy + 12); ctx.lineTo(bx + f * 14, yy + 16);
    ctx.stroke();
  }
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawEnemy(e) {
  const x = e.x, y = e.y, f = e.dir;
  ctx.save();
  if (e.flash > 0) ctx.globalAlpha = 0.6;
  switch (e.t) {
    case "bug": { // besouro
      ctx.fillStyle = "#5b8a3c";
      roundRect(x, y, e.w, e.h, 9); ctx.fill();
      ctx.fillStyle = "#3f6b28";
      ctx.beginPath(); ctx.ellipse(x + e.w/2, y + e.h/2, 7, 8, 0, 0, 7); ctx.fill();
      // antenas
      ctx.strokeStyle = "#3f6b28"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + e.w/2 + f * 10, y + 4); ctx.lineTo(x + e.w/2 + f * 15, y - 4);
      ctx.stroke();
      ctx.fillStyle = "#000";
      ctx.beginPath(); ctx.arc(x + e.w/2 + f * 8, y + 8, 2, 0, 7); ctx.fill();
      break;
    }
    case "frog": { // sapo
      ctx.fillStyle = "#57c95b";
      roundRect(x, y, e.w, e.h, 10); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(x + e.w/2 + f * 9, y + 5, 5, 0, 7); ctx.fill();
      ctx.fillStyle = "#000";
      ctx.beginPath(); ctx.arc(x + e.w/2 + f * 10, y + 5, 2.4, 0, 7); ctx.fill();
      ctx.fillStyle = "#3aa33f";
      ctx.fillRect(x + 4, y + e.h - 4, 6, 4); ctx.fillRect(x + e.w - 10, y + e.h - 4, 6, 4);
      break;
    }
    case "cat": { // gato
      ctx.fillStyle = "#9a9a9a";
      roundRect(x, y + 4, e.w, e.h - 4, 8); ctx.fill();
      // orelhas
      ctx.beginPath();
      ctx.moveTo(x + 4, y + 8); ctx.lineTo(x + 8, y - 3); ctx.lineTo(x + 13, y + 7);
      ctx.moveTo(x + e.w - 4, y + 8); ctx.lineTo(x + e.w - 8, y - 3); ctx.lineTo(x + e.w - 13, y + 7);
      ctx.fillStyle = "#9a9a9a"; ctx.fill();
      ctx.fillStyle = "#ffd23f";
      ctx.beginPath(); ctx.arc(x + e.w/2 + f * 8, y + 9, 2.2, 0, 7); ctx.fill();
      // rabo
      ctx.strokeStyle = "#9a9a9a"; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(f > 0 ? x + 2 : x + e.w - 2, y + e.h - 6);
      ctx.quadraticCurveTo(f > 0 ? x - 8 : x + e.w + 8, y, f > 0 ? x - 10 : x + e.w + 10, y - 6);
      ctx.stroke();
      break;
    }
    case "walker": { // corgi de rua
      const wob = Math.sin(time * 10 + e.ph) * 2;
      // rabo
      ctx.strokeStyle = "#a86a3c"; ctx.lineWidth = 4; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(f > 0 ? x + 3 : x + e.w - 3, y + 8);
      ctx.quadraticCurveTo(f > 0 ? x - 6 : x + e.w + 6, y + 2 + wob, f > 0 ? x - 8 : x + e.w + 8, y - 4 + wob);
      ctx.stroke();
      // corpo
      ctx.fillStyle = "#b5763f";
      roundRect(x, y + 4, e.w, e.h - 8, 8); ctx.fill();
      // mancha
      ctx.fillStyle = "#8c5a2e";
      ctx.beginPath(); ctx.ellipse(x + e.w * (f > 0 ? 0.32 : 0.68), y + 11, 5, 4, 0, 0, 7); ctx.fill();
      // perninhas curtas
      ctx.fillStyle = "#8c5a2e";
      for (const lx of [5, 12, e.w - 17, e.w - 10]) ctx.fillRect(x + lx, y + e.h - 6, 5, 6);
      // cabeça
      ctx.fillStyle = "#b5763f";
      ctx.beginPath(); ctx.arc(f > 0 ? x + e.w - 6 : x + 6, y + 7, 8, 0, 7); ctx.fill();
      // orelhas em pé
      ctx.fillStyle = "#8c5a2e";
      ctx.beginPath();
      ctx.moveTo(f > 0 ? x + e.w - 13 : x + 2, y + 2);
      ctx.lineTo(f > 0 ? x + e.w - 11 : x + 4, y - 7);
      ctx.lineTo(f > 0 ? x + e.w - 6 : x + 9, y + 1);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(f > 0 ? x + e.w - 4 : x + 11, y + 2);
      ctx.lineTo(f > 0 ? x + e.w - 2 : x + 13, y - 7);
      ctx.lineTo(f > 0 ? x + e.w + 1 : x + 16, y + 1);
      ctx.closePath(); ctx.fill();
      // focinho
      ctx.fillStyle = "#e8cfa8";
      roundRect(f > 0 ? x + e.w - 4 : x - 4, y + 8, 12, 8, 4); ctx.fill();
      ctx.fillStyle = "#2b2018";
      ctx.beginPath(); ctx.arc(f > 0 ? x + e.w + 4 : x - 4, y + 10, 2.6, 0, 7); ctx.fill();
      // olhinho bravo
      ctx.fillStyle = "#ff5252";
      ctx.beginPath(); ctx.arc(f > 0 ? x + e.w - 9 : x + 9, y + 5, 2.4, 0, 7); ctx.fill();
      break;
    }
    case "car": { // carrinho malvado
      ctx.fillStyle = "#e05a5a";
      roundRect(x, y + 8, e.w, e.h - 8, 6); ctx.fill();
      ctx.fillStyle = "#b03d3d";
      roundRect(x + e.w * 0.2, y, e.w * 0.5, 12, 4); ctx.fill();
      ctx.fillStyle = "#cfe8ff";
      ctx.fillRect(x + e.w * 0.25 + (f > 0 ? -2 : 4), y + 2, 12, 8);
      // rodas
      ctx.fillStyle = "#2b2b2b";
      ctx.beginPath(); ctx.arc(x + 14, y + e.h - 4, 8, 0, 7); ctx.arc(x + e.w - 14, y + e.h - 4, 8, 0, 7); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(x + e.w/2 + f * 30, y + 16, 3, 0, 7); ctx.fill();
      ctx.fillStyle = "#000";
      ctx.beginPath(); ctx.arc(x + e.w/2 + f * 30, y + 16, 1.4, 0, 7); ctx.fill();
      break;
    }
    case "puppy": { // filhote do mal
      ctx.fillStyle = "#6e5a8c";
      roundRect(x, y, e.w, e.h, 8); ctx.fill();
      // orelhas de mal
      ctx.fillStyle = "#4e3e6c";
      ctx.beginPath();
      ctx.moveTo(x + 4, y + 6); ctx.lineTo(x + 8, y - 4); ctx.lineTo(x + 12, y + 5);
      ctx.moveTo(x + e.w - 4, y + 6); ctx.lineTo(x + e.w - 8, y - 4); ctx.lineTo(x + e.w - 12, y + 5);
      ctx.fill();
      ctx.fillStyle = "#ff5252";
      ctx.beginPath(); ctx.arc(x + e.w/2 + f * 6, y + 9, 2.6, 0, 7); ctx.fill();
      break;
    }
    case "flyer": { // pombão
      const flap = Math.sin(time * 12 + e.ph) * 10;
      ctx.fillStyle = "#8fa3c4";
      ctx.beginPath(); ctx.ellipse(x + e.w/2, y + 10, 14, 9, 0, 0, 7); ctx.fill();
      // asas
      ctx.fillStyle = "#b3c4e0";
      ctx.beginPath();
      ctx.moveTo(x + e.w/2, y + 8);
      ctx.quadraticCurveTo(x + e.w/2 - 12, y - 6 - flap, x + e.w/2 - 18, y + 4 - flap);
      ctx.quadraticCurveTo(x + e.w/2 - 6, y + 10, x + e.w/2, y + 8);
      ctx.fill();
      ctx.fillStyle = "#ff9d3f";
      ctx.beginPath();
      ctx.moveTo(x + e.w/2 + f * 13, y + 10); ctx.lineTo(x + e.w/2 + f * 22, y + 12); ctx.lineTo(x + e.w/2 + f * 13, y + 14);
      ctx.fill();
      ctx.fillStyle = "#000";
      ctx.beginPath(); ctx.arc(x + e.w/2 + f * 9, y + 8, 2, 0, 7); ctx.fill();
      break;
    }
  }
  ctx.restore();
}

function drawBoss() {
  const b = boss;
  if (b.dead && b.deadT < 0.2) return;
  ctx.save();
  if (b.flash > 0) ctx.globalAlpha = 0.6;
  const x = b.x, y = b.y, f = b.dir;
  // corpo gigante
  const grad = ctx.createLinearGradient(x, y, x, y + b.h);
  grad.addColorStop(0, "#8a76a8");
  grad.addColorStop(1, "#5c4a78");
  ctx.fillStyle = grad;
  roundRect(x, y + 14, b.w, b.h - 14, 12);
  ctx.fill();
  ctx.strokeStyle = "#3e3157"; ctx.lineWidth = 2.5;
  roundRect(x, y + 14, b.w, b.h - 14, 12); ctx.stroke();
  // cabeça
  ctx.fillStyle = "#7d6a99";
  ctx.beginPath(); ctx.arc(x + b.w/2, y + 20, 22, 0, 7); ctx.fill();
  ctx.strokeStyle = "#3e3157"; ctx.stroke();
  // orelhas malvadas
  ctx.fillStyle = "#4e3e6c";
  ctx.beginPath();
  ctx.moveTo(x + b.w/2 - 18, y + 8); ctx.lineTo(x + b.w/2 - 24, y - 14); ctx.lineTo(x + b.w/2 - 8, y + 2);
  ctx.moveTo(x + b.w/2 + 18, y + 8); ctx.lineTo(x + b.w/2 + 24, y - 14); ctx.lineTo(x + b.w/2 + 8, y + 2);
  ctx.fill();
  // olhos vermelhos brilhantes
  ctx.fillStyle = "#ff5252";
  ctx.shadowColor = "#ff0000"; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(x + b.w/2 + f * 8 - 5, y + 18, 4, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + b.w/2 + f * 8 + 6, y + 18, 4, 0, 7); ctx.fill();
  ctx.shadowBlur = 0;
  // focinho e dentes
  ctx.fillStyle = "#e8d8c8";
  ctx.beginPath(); ctx.ellipse(x + b.w/2 + f * 10, y + 30, 9, 7, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.moveTo(x + b.w/2 + f * 10 - 4, y + 34); ctx.lineTo(x + b.w/2 + f * 10 - 2, y + 39); ctx.lineTo(x + b.w/2 + f * 10, y + 34);
  ctx.moveTo(x + b.w/2 + f * 10 + 2, y + 34); ctx.lineTo(x + b.w/2 + f * 10 + 4, y + 39); ctx.lineTo(x + b.w/2 + f * 10 + 6, y + 34);
  ctx.fill();
  // coleira "NÃO ADOPTO"
  ctx.fillStyle = "#3e3157";
  ctx.fillRect(x, y + 34, b.w, 6);
  ctx.fillStyle = "#ffd66b";
  ctx.font = "bold 7px system-ui";
  ctx.textAlign = "center";
  ctx.fillText("NÃO ADOPTO", x + b.w/2, y + 40);
  ctx.textAlign = "left";
  if (b.dead) {
    // stars orbitando
    for (let i = 0; i < 3; i++) {
      const a = time * 6 + i * 2.1;
      drawStar(x + b.w/2 + Math.cos(a) * 20, y + 10 + Math.sin(a) * 8, 5, "#fff");
    }
  }
  ctx.restore();
}

function drawFood(x, y) {

function drawBone(x, y, lvl) {

function drawCarrot(x, y) {

  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#66bb44";

}

function drawStar(x, y, r, color, glow) {
  ctx.save();
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 16; }
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rr = i % 2 === 0 ? r : r * 0.45;
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawHeart(x, y, r, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y + r * 0.9);
  ctx.bezierCurveTo(x - r * 1.4, y - r * 0.1, x - r * 0.7, y - r, x, y - r * 0.35);
  ctx.bezierCurveTo(x + r * 0.7, y - r, x + r * 1.4, y - r * 0.1, x, y + r * 0.9);
  ctx.fill();
  ctx.restore();
}

function drawHUD() {
  // painéis
  ctx.fillStyle = "rgba(20,10,40,.55)";
  roundRect(10, 10, 200, 62, 10); ctx.fill();
  roundRect(W - 190, 10, 180, 62, 10); ctx.fill();

  // vidas (até MAX_LIVES)
  for (let i = 0; i < MAX_LIVES; i++) {
    drawHeart(28 + i * 34, 32, 10, i < lives ? "#ff5f8f" : "rgba(255,255,255,.2)");
  }
  // energia
  ctx.fillStyle = "rgba(255,255,255,.25)";
  roundRect(20, 46, 170, 14, 7); ctx.fill();
  const ew = (P.energy / MAX_ENERGY) * 166;
  const eg = ctx.createLinearGradient(22, 0, 190, 0);
  eg.addColorStop(0, "#ffe066"); eg.addColorStop(1, "#ffb347");
  ctx.fillStyle = eg;
  roundRect(22, 48, Math.max(6, ew), 10, 5); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.font = "bold 11px system-ui";
  ctx.fillText("⚡ energia", 22, 43);

  // score + fase
  ctx.fillStyle = "#fff";
  ctx.font = "bold 18px system-ui";
  ctx.textAlign = "right";
  ctx.fillText(score + " pts", W - 20, 34);
  ctx.font = "12px system-ui";
  ctx.fillStyle = "#ffd66b";
  ctx.fillText(level ? level.title : "", W - 20, 56);
  // poderes
  if (P.barkLvl > 0 || P.boostT > 0) {
    ctx.fillStyle = "#8ef08e";
    ctx.fillText((P.barkLvl > 0 ? "📢x" + (P.barkLvl + 1) + " " : "") + (P.boostT > 0 ? "🥕" + Math.ceil(P.boostT) + "s" : ""), W - 20, 66);
  }
  ctx.textAlign = "left";

  // barra do chefe
  if (boss && !boss.dead) {
    ctx.fillStyle = "rgba(20,10,40,.6)";
    roundRect(W/2 - 160, 12, 320, 30, 10); ctx.fill();
    ctx.fillStyle = "#ff5252";
    ctx.fillRect(W/2 - 152, 26, 304 * (boss.hp / boss.maxHp), 10);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 13px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("💜 Cachorrinho do Mal 💜", W/2, 24);
    ctx.textAlign = "left";
  }
}

// ------------------------- ending -------------------------
let endT = 0;
function drawEnding() {
  endT += 0.016;
  // céu rosa
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#ffd6e8");
  sky.addColorStop(1, "#fff5fa");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // chuveiro de corações
  for (let i = 0; i < 20; i++) {
    const hx = (i * 137 + endT * 40) % W;
    const hy = (i * 211 + endT * (60 + (i % 5) * 20)) % H;
    ctx.globalAlpha = 0.5;
    drawHeart(hx, hy, 6 + (i % 4) * 3, "#ff6b9e");
  }
  ctx.globalAlpha = 1;

  // chão fofo
  ctx.fillStyle = "#a8d89a";
  ctx.fillRect(0, H - 90, W, 90);

  // família: mamãe, papai e filho
  drawFamilyPerson(W/2 - 145, H - 88, 0.95, "mom");
  drawFamilyPerson(W/2 + 145, H - 88, 1.0, "dad");
  drawFamilyPerson(W/2, H - 88, 0.62, "kid");

  // Melzinha (salsichuda e feliz) na frente da família
  const mx = W/2 + Math.sin(endT * 1.5) * 5;
  const my = H - 90 - 13;
  ctx.save();
  // rabinho abanando
  ctx.strokeStyle = "#f4a643"; ctx.lineWidth = 6; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(mx - 42, my + 12);
  ctx.quadraticCurveTo(mx - 58, my + 4 + Math.sin(endT * 9) * 5, mx - 62, my - 6);
  ctx.stroke();
  // corpo salsicha cor de mel
  const mg = ctx.createLinearGradient(0, my, 0, my + 26);
  mg.addColorStop(0, "#ffd27a"); mg.addColorStop(1, "#f4a643");
  ctx.fillStyle = mg;
  roundRect(mx - 46, my, 92, 26, 13); ctx.fill();
  ctx.strokeStyle = "#c07f2a"; ctx.lineWidth = 2;
  roundRect(mx - 46, my, 92, 26, 13); ctx.stroke();
  // barriguinha
  ctx.fillStyle = "#ffe4ad";
  ctx.beginPath(); ctx.ellipse(mx - 4, my + 23, 26, 5, 0, 0, 7); ctx.fill();
  // patinhas da frente (deitadinha)
  ctx.fillStyle = "#f4a643";
  roundRect(mx + 26, my + 21, 9, 7, 3); ctx.fill();
  roundRect(mx + 38, my + 22, 9, 7, 3); ctx.fill();
  // orelha caidinha
  ctx.fillStyle = "#e8923c";
  ctx.beginPath(); ctx.ellipse(mx + 28, my + 4, 6, 12, -0.35, 0, 7); ctx.fill();
  // focinho
  ctx.fillStyle = "#fff";
  roundRect(mx + 38, my + 8, 19, 11, 5); ctx.fill();
  ctx.fillStyle = "#4a2f1a";
  ctx.beginPath(); ctx.arc(mx + 54, my + 12, 3.2, 0, 7); ctx.fill();
  // olhinho fechadinho de feliz
  ctx.strokeStyle = "#3a2410"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(mx + 34, my + 12, 4, Math.PI, 0, true); ctx.stroke();
  ctx.restore();

  // coração rosa grande pulsando
  const hs = 34 + Math.sin(endT * 3) * 6;
  drawHeart(W/2, H/2 - 40, hs, "#ff6b9e");
  ctx.save();
  ctx.shadowColor = "#ff9ec7"; ctx.shadowBlur = 30;
  drawHeart(W/2, H/2 - 40, hs, "#ff9ec7");
  ctx.restore();

  ctx.textAlign = "center";
  ctx.fillStyle = "#d94f80";
  ctx.font = "bold 38px system-ui";
  ctx.fillText("A Mel foi adotada! 🩷", W/2, 120);
  ctx.fillStyle = "#a83a64";
  ctx.font = "22px system-ui";
  ctx.fillText("Ela viveu feliz para sempre com a nova família.", W/2, 165);
  ctx.fillStyle = "#7a2a4a";
  ctx.font = "bold 24px system-ui";
  ctx.fillText("Pontuação final: " + score + " pts", W/2, 215);
  ctx.textAlign = "left";

  // botão de jogar de novo
  drawBtn(W/2 - 110, H - 60, 220, 44, "🐾 Jogar de novo", () => { score = 0; lives = 3; totalKills = 0; showMenu(); });
  drawBtn(W/2 - 110, 260, 220, 44, "🏠 Menu", () => { score = 0; lives = 3; totalKills = 0; showMenu(); });
}

function drawFamilyPerson(x, gy, s, role) {
  const skin = "#f6cfae";
  ctx.save();
  let bodyTop;
  if (role === "mom") {
    // sapatinhos
    ctx.fillStyle = "#7a3b52";
    ctx.fillRect(x - 14 * s, gy - 8 * s, 10 * s, 8 * s);
    ctx.fillRect(x + 4 * s, gy - 8 * s, 10 * s, 8 * s);
    // vestidinho (trapézio)
    ctx.fillStyle = "#c95b8e";
    ctx.beginPath();
    ctx.moveTo(x - 14 * s, gy - 78 * s);
    ctx.lineTo(x + 14 * s, gy - 78 * s);
    ctx.lineTo(x + 26 * s, gy - 8 * s);
    ctx.lineTo(x - 26 * s, gy - 8 * s);
    ctx.closePath(); ctx.fill();
    // cinturinha
    ctx.fillStyle = "#a83a64";
    ctx.fillRect(x - 14 * s, gy - 80 * s, 28 * s, 5 * s);
    // bolinhas na roupa
    ctx.fillStyle = "rgba(255,255,255,.5)";
    for (let i = 0; i < 4; i++)
      ctx.beginPath(), ctx.arc(x - 12 * s + i * 8 * s, gy - 45 * s + (i % 2) * 14 * s, 2.2 * s, 0, 7), ctx.fill();
    bodyTop = gy - 78 * s;
  } else {
    const legH = role === "dad" ? 40 : 26;
    // perninhas + tênis
    ctx.fillStyle = role === "dad" ? "#3a4a6b" : "#5b6e8c";
    ctx.fillRect(x - 14 * s, gy - legH * s, 11 * s, legH * s);
    ctx.fillRect(x + 3 * s, gy - legH * s, 11 * s, legH * s);
    ctx.fillStyle = "#2b2b2b";
    ctx.fillRect(x - 16 * s, gy - 6 * s, 15 * s, 6 * s);
    ctx.fillRect(x + 1 * s, gy - 6 * s, 15 * s, 6 * s);
    // camisetinha
    ctx.fillStyle = role === "dad" ? "#5b8ec9" : "#7bc97b";
    roundRect(x - 18 * s, gy - (legH + 54) * s, 36 * s, 56 * s, 8 * s);
    ctx.fill();
    // coraçãozinho na camiseta
    drawHeart(x, gy - (legH + 34) * s, 5 * s, "#ff6b9e");
    bodyTop = gy - (legH + 54) * s;
  }
  // bracinhos
  ctx.strokeStyle = skin;
  ctx.lineWidth = 7 * s;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x - 17 * s, bodyTop + 10 * s);
  ctx.lineTo(x - 26 * s, bodyTop + 34 * s);
  ctx.moveTo(x + 17 * s, bodyTop + 10 * s);
  ctx.lineTo(x + 26 * s, bodyTop + 34 * s);
  ctx.stroke();
  // cabecinha
  const hy = bodyTop - 15 * s;
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(x, hy, 17 * s, 0, 7); ctx.fill();
  // cabelo
  ctx.fillStyle = role === "mom" ? "#4a2f22" : role === "dad" ? "#23232b" : "#6b4226";
  ctx.beginPath();
  ctx.arc(x, hy, 17 * s, Math.PI * 0.95, Math.PI * 2.05);
  ctx.fill();
  if (role === "mom") {
    // coque
    ctx.beginPath(); ctx.arc(x, hy - 19 * s, 8 * s, 0, 7); ctx.fill();
  } else if (role === "kid") {
    // cabelinho de menino: tufinho despenteado no topo
    ctx.beginPath();
    ctx.moveTo(x - 8 * s, hy - 13 * s);
    ctx.lineTo(x - 4 * s, hy - 22 * s);
    ctx.lineTo(x, hy - 15 * s);
    ctx.lineTo(x + 5 * s, hy - 21 * s);
    ctx.lineTo(x + 8 * s, hy - 13 * s);
    ctx.closePath(); ctx.fill();
  }
  // olhinhos + sorriso + bochechas
  ctx.fillStyle = "#3a2a20";
  ctx.beginPath();
  ctx.arc(x - 6 * s, hy + 2 * s, 2.2 * s, 0, 7);
  ctx.arc(x + 6 * s, hy + 2 * s, 2.2 * s, 0, 7);
  ctx.fill();
  ctx.strokeStyle = "#b06a4a";
  ctx.lineWidth = 2 * s;
  ctx.beginPath(); ctx.arc(x, hy + 4 * s, 6 * s, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.fillStyle = "rgba(255,120,150,.35)";
  ctx.beginPath();
  ctx.arc(x - 10 * s, hy + 6 * s, 3 * s, 0, 7);
  ctx.arc(x + 10 * s, hy + 6 * s, 3 * s, 0, 7);
  ctx.fill();
  ctx.restore();
}

// botões em canvas (para o ending)
let canvasBtns = [];
function drawBtn(x, y, w, h, label, fn) {
  ctx.save();
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, "#ff9ec7"); g.addColorStop(1, "#f06292");
  ctx.fillStyle = g;
  roundRect(x, y, w, h, h / 2); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.font = "bold 18px system-ui";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label, x + w / 2, y + h / 2);
  ctx.restore();
  canvasBtns.push({ x, y, w, h, fn });
}

canvas.addEventListener("click", (e) => {
  const r = canvas.getBoundingClientRect();
  const cx = (e.clientX - r.left) * (W / r.width);
  const cy = (e.clientY - r.top) * (H / r.height);
  for (const b of canvasBtns) {
    if (cx > b.x && cx < b.x + b.w && cy > b.y && cy < b.y + b.h) { b.fn(); break; }
  }
});

       swipe rápido pra cima = pular, botões <b>🦴</b> <b>📢</b></p>
    <p class="small">🦴 osso = latido turbinado · 🥕 cenoura = turbo ·
       🍖 comida = energia · ❤️ coração = +1 vida · ⭐ no fim da fase: quanto
       mais alto, mais pontos!<br><b>Bônus:</b> a cada 10 inimigos eliminados você ganha +1 vida!</p>
    <h2>Escolha a fase</h2>
    <div class="lvl-grid">${btns}</div>
    <button class="btn" id="btn-play">▶ Começar</button>
    <p class="small" id="hi"></p>
  `;
  panel.querySelectorAll(".lvl-btn:not(.locked)").forEach((b) =>
    b.addEventListener("click", () => {
      score = 0; lives = 3; totalKills = 0;
      startLevel(parseInt(b.dataset.lv, 10));
    })
  );
  document.getElementById("btn-play").addEventListener("click", () => {
    score = 0; lives = 3; totalKills = 0;
    startLevel(0);
  });
}

function hideOverlay() { overlay.classList.add("hidden"); }
function showOverlay() { overlay.classList.remove("hidden"); }

// game over -> mostra painel
function showGameOver() {
  state = "menu-over";
  showOverlay();
  panel.innerHTML = `
    <h1>Fim de jogo! 🥺</h1>
    <p>A Mel tropeçou na aventura... mas ela é teimosa!</p>
    <p>Pontuação: <b>${score}</b></p>
    <button class="btn" id="btn-retry">🔄 Tentar de novo</button>
    <button class="btn pink" id="btn-menu">🏠 Menu</button>
  `;
  const retryLv = levelIdx;
  document.getElementById("btn-retry").addEventListener("click", () => {
    score = 0; lives = 3; totalKills = 0;
    startLevel(retryLv);
  });
  document.getElementById("btn-menu").addEventListener("click", () => {
    score = 0; lives = 3; totalKills = 0;
    showMenu();
  });
}

// estado "over" finaliza em painel após a animação
let overShown = false;

// ------------------------- loop principal -------------------------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  canvasBtns = [];

  if (state === "menu") {
    drawMenuBg(now / 1000);
  } else if (state === "ending") {
    drawEnding();
  } else {
    update(dt);
    draw();
    if (state === "over" && !overShown && P.dead && P.deadT <= 0) {
      overShown = true;
      showGameOver();
    }
    if (state !== "over") overShown = false;
  }
  requestAnimationFrame(loop);
}

let menuT = 0;
function drawMenuBg(t) {
  menuT = t;
  const th = THEME.floresta;
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#d8f3ff"); sky.addColorStop(1, "#8ed4ff");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);
  // sol
  ctx.fillStyle = "#ffe066";
  ctx.beginPath(); ctx.arc(W - 130, 110, 48, 0, 7); ctx.fill();
  // colinas
  ctx.fillStyle = "#a8d89a";
  ctx.beginPath(); ctx.ellipse(W/2, H + 80, 700, 260, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#84bf7c";
  ctx.beginPath(); ctx.ellipse(W/2, H + 130, 700, 260, 0, 0, 7); ctx.fill();
  // Mel pulando no fundo
  const hop = Math.abs(Math.sin(menuT * 2.4)) * 40;
  const sx = W / 2 - 40, sy = H - 150 - hop;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(1.6, 1.6);
  const fake = { x: 0, y: 0, w: 46, h: 22, face: 1,
    vx: 100, vy: 0, onGround: hop < 4, inv: 0, biteT: 0, boostT: 0 };
  Object.assign(P, fake);
  drawMel();
  Object.assign(P, { face: 1, onGround: false, vx: 0 });
  ctx.restore();
}

// ------------------------- boot -------------------------
showMenu();
requestAnimationFrame(loop);
</script>
