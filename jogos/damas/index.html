<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Damas Brasileiras</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #12082b;
    --bg2: #1d0f3f;
    --roxo: #7c3aed;
    --roxo-claro: #a78bfa;
    --claro: #f5f0e6;
    --escuro: #2b2333;
    --texto: #ede9fe;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #2b1465 0%, var(--bg2) 45%, var(--bg) 100%);
    color: var(--texto);
    display: flex;
    min-height: 100vh;
    padding: 12px;
    user-select: none;
  }

  /* margin:auto centraliza quando cabe e permite rolagem quando não cabe */
  .col {
    margin: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  h1 {
    font-size: clamp(1.5rem, 5vw, 2.2rem);
    margin-bottom: 4px;
    background: linear-gradient(90deg, #facc15, var(--roxo-claro), #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub {
    color: #b8a8e8;
    font-size: 0.9rem;
    line-height: 1.5;
    margin-bottom: 16px;
    text-align: center;
    max-width: 92%;
  }

  /* ---- Menu de modos ---- */
  .menu {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }
  .menu .btn {
    width: 100%;
    max-width: 340px;
    box-sizing: border-box;
  }

  .btn {
    font: inherit;
    font-weight: 600;
    color: var(--texto);
    background: linear-gradient(135deg, var(--roxo), #5b21b6);
    border: none;
    border-radius: 12px;
    padding: 12px 22px;
    min-width: 250px;
    cursor: pointer;
    box-shadow: 0 4px 0 #3b1d78, 0 6px 18px rgba(124, 58, 237, 0.35);
    transition: transform 0.08s, box-shadow 0.08s, filter 0.15s;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #3b1d78; }
  .btn.ghost {
    background: transparent;
    box-shadow: none;
    border: 2px solid var(--roxo);
    color: var(--roxo-claro);
    font-size: 0.95rem;
    padding: 10px 18px;
    min-width: 0;
  }
  .btn.ghost:active { transform: none; }

  /* ---- Placar ---- */
  .placar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .placar div {
    background: rgba(124, 58, 237, 0.12);
    border: 2px solid rgba(167, 139, 250, 0.35);
    border-radius: 12px;
    padding: 6px 12px;
    text-align: center;
    min-width: 86px;
    transition: border-color 0.3s, background 0.3s;
  }
  .placar div.ativo {
    border-color: #facc15;
    background: rgba(250, 204, 21, 0.12);
  }
  .placar .quem { font-size: 0.8rem; font-weight: 700; white-space: nowrap; }
  .placar .quem.br { color: var(--claro); }
  .placar .quem.pr { color: #cbd5e1; }
  .placar .pts { font-size: 1.2rem; font-weight: 800; }
  .placar .qtd { font-size: 0.7rem; color: #b8a8e8; }

  /* ---- Tabuleiro ---- */
  .tabuleiro {
    position: relative;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
    width: min(94vw, 460px, 68vh);
    aspect-ratio: 1;
    border: 4px solid #4c2f9e;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 24px rgba(0, 0, 0, 0.55);
  }

  .casa {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .casa.clara { background: #e8d9bd; }
  .casa.escura { background: #43265e; cursor: default; }
  .casa.escura.jogavel { cursor: pointer; }

  /* caminho da captura (aparece com a peça selecionada) */
  .casa.trajeto::after {
    content: '';
    position: absolute;
    width: 22%;
    height: 22%;
    border-radius: 50%;
    background: rgba(250, 204, 21, 0.4);
  }
  .casa.comer::after {
    content: '';
    position: absolute;
    inset: 5%;
    border: 3px dashed rgba(255, 107, 107, 0.95);
    border-radius: 12px;
    animation: pulo 0.8s ease infinite alternate;
  }
  /* peça obrigada a capturar (regra oficial): anel vermelho pulsante */
  /* ---- Fim de jogo (overlay sobreposto) ---- */
  .tab-wrap { position: relative; }
  .fim-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(16, 6, 34, 0.84);
    border-radius: 10px;
    z-index: 5;
    animation: surgir 0.25s ease;
  }
  .fim-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-align: center;
    padding: 10px 18px;
    animation: saltar 0.5s ease;
  }
  .fim-emoji { font-size: 3.4rem; animation: quicar 0.7s ease infinite alternate; }
  .fim-titulo {
    font-size: clamp(1.3rem, 5vw, 1.8rem);
    font-weight: 900;
    color: #ffd84d;
    text-shadow: 0 2px 12px rgba(250, 204, 21, 0.35);
  }
  .fim-sub { color: #e9d5ff; font-size: 0.95rem; margin-bottom: 6px; }
  .btn.fim-btn { min-width: 0; padding: 10px 22px; }
  @keyframes surgir { from { opacity: 0; } to { opacity: 1; } }
  @keyframes saltar { 0% { transform: scale(0.6); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
  @keyframes quicar { from { transform: translateY(0); } to { transform: translateY(-10px); } }

  .casa.deve::before {
    content: '';
    position: absolute;
    inset: 4%;
    border: 3px solid rgba(255, 107, 107, 0.9);
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255, 107, 107, 0.55);
    animation: pulo 0.9s ease infinite alternate;
    pointer-events: none;
  }

  .casa.destino::after {
    content: '';
    position: absolute;
    width: 34%;
    height: 34%;
    border-radius: 50%;
    background: rgba(250, 204, 21, 0.55);
    box-shadow: 0 0 10px rgba(250, 204, 21, 0.8);
    animation: pulo 0.8s ease infinite alternate;
  }
  .casa.capurar::after {
    width: 82%;
    height: 82%;
    border-radius: 50%;
    background: transparent;
    border: 3px dashed rgba(250, 204, 21, 0.9);
  }

  /* ---- Peças ---- */
  .peca {
    position: absolute;
    width: 82%;
    height: 82%;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(0.7rem, 3.2vw, 1.05rem);
    transition: transform 0.12s;
  }
  .peca.br {
    background: radial-gradient(circle at 35% 30%, #fffdf5 0%, var(--claro) 55%, #d9cdb4 100%);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.55),
      inset 0 0 0 3px rgba(120, 100, 60, 0.35),
      inset 0 0 0 6px var(--claro),
      inset 0 0 0 8px rgba(120, 100, 60, 0.3);
  }
  .peca.pr {
    background: radial-gradient(circle at 35% 30%, #55496b 0%, #2b2333 55%, #15101c 100%);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.7),
      inset 0 0 0 3px rgba(200, 190, 255, 0.3),
      inset 0 0 0 6px #241d2e,
      inset 0 0 0 8px rgba(200, 190, 255, 0.25);
  }
  .casa.selecionada .peca {
    transform: scale(1.1);
    box-shadow: 0 0 14px 4px rgba(250, 204, 21, 0.8),
      inset 0 0 0 3px rgba(250, 204, 21, 0.8),
      inset 0 0 0 6px transparent,
      inset 0 0 0 8px rgba(250, 204, 21, 0.5);
  }
  .casa.selecionada { z-index: 2; }

  /* animação de jogada: peça-fantasma desliza pelo caminho */
  .ghost {
    position: absolute;
    width: 10%;
    height: 10%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 5;
  }
  .peca.escondida { visibility: hidden; }

  @keyframes pulo {
    from { transform: scale(1); }
    to   { transform: scale(1.25); }
  }

  /* ---- Status / ações ---- */
  .status {
    margin-top: 12px;
    font-size: 1.05rem;
    font-weight: 700;
    min-height: 1.5em;
    text-align: center;
    max-width: min(94vw, 460px);
    padding: 8px 16px;
    border-radius: 12px;
    border: 2px solid rgba(167, 139, 250, 0.25);
    background: rgba(255, 255, 255, 0.05);
    transition: background 0.25s, border-color 0.25s, color 0.25s;
  }
  .status.aviso {
    color: #ffd8a8;
    background: rgba(255, 122, 61, 0.16);
    border-color: rgba(255, 122, 61, 0.7);
  }

  .acoes { margin-top: 12px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .acoes .btn.ghost { min-width: 0; padding: 10px 14px; font-size: 0.9rem; }

  .hidden { display: none !important; }
</style>
</head>
<body>

  <div class="col">

  <h1>Damas Brasileiras</h1>

  <div class="menu" id="menu">
    <p class="sub">Tabuleiro 10×10 · 20 peças por lado<br>Escolha como quer jogar:</p>
    <button class="btn" onclick="iniciarJogo('cpu')">🤖 Jogar contra a máquina</button>
    <button class="btn" onclick="iniciarJogo('pvp')">👥 Dois jogadores</button>
    <button class="btn ghost" id="btn-forcar-menu" onclick="alternarForcar()"></button>
  </div>

  <div id="jogo" class="hidden" style="display:flex; flex-direction:column; align-items:center;">
    <div class="placar">
      <div id="p-br"><div class="quem br" id="rot-br">⚪ Branco</div><div class="pts" id="pts-br">0</div><div class="qtd" id="pe-br">20</div></div>
      <div id="p-e"><div class="quem">Empates</div><div class="pts" id="pts-e">0</div></div>
      <div id="p-pr"><div class="quem pr" id="rot-pr">⚫ Preto</div><div class="pts" id="pts-pr">0</div><div class="qtd" id="pe-pr">20</div></div>
    </div>

    <div class="tab-wrap">
      <div class="tabuleiro" id="tabuleiro"></div>
      <div class="fim-overlay hidden" id="fim-overlay">
        <div class="fim-card">
          <div class="fim-emoji" id="fim-emoji">🏆</div>
          <div class="fim-titulo" id="fim-titulo">Você venceu!</div>
          <div class="fim-sub" id="fim-sub"></div>
          <button class="btn fim-btn" onclick="novaPartida()">🔄 Jogar de novo</button>
        </div>
      </div>
    </div>

    <div class="status" id="status"></div>

    <div class="acoes">
      <button class="btn ghost" onclick="novaPartida()">🔄 Nova partida</button>
      <button class="btn ghost" id="btn-forcar" onclick="alternarForcar()"></button>
      <button class="btn ghost" onclick="voltarMenu()">🏠 Menu</button>
    </div>
  </div>

  </div>

<script>
(function () {
  'use strict';

  const N = 10;
  // 0 = vazio, 1 = branca simples, 2 = branca dama, 3 = preta simples, 4 = preta dama
  const BR = 1, PR = 2;

  let modo = null;        // 'cpu' | 'pvp'
  let g = [];             // grid 10x10
  let vez = BR;
  let fim = false;
  let forcarCaptura = true;   // regra oficial: captura obrigatória (e a maior). Desligado = movimento livre.
  let animar = true;          // animação das jogadas
  let animando = false;       // true enquanto uma animação está no ar (bloqueia cliques)
  let vitorias = { BR: 0, PR: 0, E: 0 };
  let selecao = null;     // {r, c} peça selecionada
  let destinos = new Map(); // "r,c" -> [r,c] (casa de pouso do destino)
  let trajetoSet = new Set(); // "r,c" casas vazias do caminho da captura
  let comerSet = new Set();   // "r,c" peças que serão comidas

  function limpaSelecao() {
    selecao = null;
    destinos = new Map();
    trajetoSet = new Set();
    comerSet = new Set();
  }

  // marca as casas vazias ESTRICTAMENTE entre dois quadrados consecutivos da mesma diagonal
  function marcarEntre(ar, ac, br, bc, set) {
    const dr = Math.sign(br - ar), dc = Math.sign(bc - ac);
    let r = ar + dr, c = ac + dc;
    while (r !== br || c !== bc) { set.add(key(r, c)); r += dr; c += dc; }
  }

  const $ = id => document.getElementById(id);
  const tabEl = $('tabuleiro');
  const emB = (r, c) => r >= 0 && r < N && c >= 0 && c < N;
  const corDe = p => p ? (p <= 2 ? BR : PR) : 0;
  const key = (r, c) => r + ',' + c;

  /* ---------------- Regras (Damas Brasileiras) ----------------
     - Tabuleiro 10×10, 20 peças por lado (linhas 0-3 e 6-9, casas escuras)
     - Simples: anda 1 casa diagonal para frente
     - Simples: CAPTURA para frente E para trás (regra brasileira!)
     - Dama: desliza ilimitado nas 4 diagonais, captura em qualquer direção
     - Captura obrigatória, sempre a maior captura
     - Dama promovida ao terminar a jogada (não continua capturando como dama na mesma jogada)
  ---------------------------------------------------------------- */

  function novaMesa() {
    const gr = Array.from({ length: N }, () => Array(N).fill(0));
    for (let r = 0; r < 4; r++) for (let c = 0; c < N; c++) if ((r + c) % 2 === 1) gr[r][c] = 3; // pretas em cima (3 = preta simples)
    for (let r = 6; r < 10; r++) for (let c = 0; c < N; c++) if ((r + c) % 2 === 1) gr[r][c] = 1;
    return gr;
  }

  const linhaRei = cor => cor === BR ? 0 : N - 1;

  // Capturas de peça simples (recursivo) -> lista de sequências terminais {tr,tc,capt:[[r,c]]}
  // (capt = casas já capturadas na sequência, tratadas como livres — impede recapturar a mesma peça)
  function capSimples(gr, r, c, cor, capt) {
    const res = [];
    for (const dr of [-1, 1]) {
      for (const dc of [-1, 1]) {
        const nr = r + dr, nc = c + dc, br = nr + dr, bc = nc + dc;
        if (!emB(nr, nc)) continue;
        const alvo = ocupada(gr, capt, nr, nc);
        if (alvo && corDe(alvo) !== cor && emB(br, bc) && !ocupada(gr, capt, br, bc)) {
          const nCapt = capt.concat([[nr, nc]]);
          if (br === linhaRei(cor)) {
            res.push({ tr: br, tc: bc, capt: nCapt }); // promove no fim; para de capturar
          } else {
            const sub = capSimples(gr, br, bc, cor, nCapt);
            if (sub.length) res.push(...sub);
            else res.push({ tr: br, tc: bc, capt: nCapt });
          }
        }
      }
    }
    return res;
  }

  // casa ocupada, considerando as peças JÁ capturadas na sequência (ficam livres)
  function ocupada(gr, capt, r, c) {
    for (const [a, b] of capt) if (a === r && b === c) return 0;
    return gr[r][c];
  }


  function damaTemCaptura(gr, capt, r, c, cor) {
    for (const dr of [-1, 1]) for (const dc of [-1, 1]) {
      let nr = r + dr, nc = c + dc;
      while (emB(nr, nc)) {
        const q = ocupada(gr, capt, nr, nc);
        if (!q) { nr += dr; nc += dc; continue; }
        if (corDe(q) === cor) break; // peça própria bloqueia
        if (emB(nr + dr, nc + dc) && !ocupada(gr, capt, nr + dr, nc + dc)) return true;
        break;
      }
    }
    return false;
  }

  // Capturas de dama (deslizamento + salto) -> sequências terminais
  function capDama(gr, r, c, cor, capt) {
    const res = [];
    for (const dr of [-1, 1]) for (const dc of [-1, 1]) {
      // desliza nesta direção: casas vazias até a primeira peça
      let nr = r + dr, nc = c + dc;
      while (emB(nr, nc) && !ocupada(gr, capt, nr, nc)) { nr += dr; nc += dc; }
      if (!emB(nr, nc)) continue;
      const q = ocupada(gr, capt, nr, nc);
      if (corDe(q) === cor) continue; // bloqueada
      // salta sobre o adversário e continua deslizando pelas casas vazias
      const cr2 = nr, cc2 = nc; // casa da peça capturada
      nr += dr; nc += dc;
      while (emB(nr, nc) && !ocupada(gr, capt.concat([[cr2, cc2]]), nr, nc)) {
        const nCapt = capt.concat([[cr2, cc2]]);
        if (damaTemCaptura(gr, nCapt, nr, nc, cor)) {
          for (const s of capDama(gr, nr, nc, cor, nCapt)) {
            res.push({ tr: s.tr, tc: s.tc, capt: s.capt, pousos: [[nr, nc], ...s.pousos] });
          }
        } else {
          res.push({ tr: nr, tc: nc, capt: nCapt, pousos: [[nr, nc]] });
        }
        nr += dr; nc += dc;
      }
    }
    return res;
  }

  function geramJogadas(gr, cor) {
    const caps = [], simples = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const p = gr[r][c];
      if (!p || corDe(p) !== cor) continue;
      const rei = p % 2 === 0;
      if (rei) {
        for (const dr of [-1, 1]) for (const dc of [-1, 1]) {
          let nr = r + dr, nc = c + dc;
          while (emB(nr, nc) && !gr[nr][nc]) {
            simples.push({ fr: r, fc: c, tr: nr, tc: nc, capt: [] });
            nr += dr; nc += dc;
          }
        }
        const seqs = capDama(gr, r, c, cor, []);
        for (const s of seqs) caps.push({ fr: r, fc: c, tr: s.tr, tc: s.tc, capt: s.capt, pousos: s.pousos });
      } else {
        const dr = cor === BR ? -1 : 1;
        for (const dc of [-1, 1]) {
          const nr = r + dr, nc = c + dc;
          if (emB(nr, nc) && !gr[nr][nc]) simples.push({ fr: r, fc: c, tr: nr, tc: nc, capt: [] });
        }
        const seqs = capSimples(gr, r, c, cor, []);
        for (const s of seqs) {
          // simples pousa simetricamente após cada salto: po_i = 2*alvo_i - pos_i
          let pr = r, pc = c;
          const pousos = s.capt.map(([er, ec]) => {
            const lr = 2 * er - pr, lc = 2 * ec - pc;
            pr = lr; pc = lc;
            return [lr, lc];
          });
          caps.push({ fr: r, fc: c, tr: s.tr, tc: s.tc, capt: s.capt, pousos });
        }
      }
    }
    return { caps, simples };
  }

  function jogadasLegais(gr, cor) {
    const { caps, simples } = geramJogadas(gr, cor);
    if (forcarCaptura && caps.length) {
      const max = Math.max(...caps.map(c => c.capt.length));
      return caps.filter(c => c.capt.length === max);   // regra oficial: a MAIOR captura
    }
    return caps.concat(simples);                        // modo livre: captura OU movimento simples
  }

  // existe captura disponível para a cor?
  function temCaptura(gr, cor) {
    return geramJogadas(gr, cor).caps.length > 0;
  }

  window.alternarForcar = function () {
    forcarCaptura = !forcarCaptura;
    atualizaForcarUI();
    limpaSelecao();
    if (!fim) desenha();
  };

  function atualizaForcarUI() {
    const bMenu = $('btn-forcar-menu');
    const bJogo = $('btn-forcar');
    if (bMenu) bMenu.textContent = forcarCaptura
      ? '📏 Captura obrigatória: LIGADA'      // toque para desligar
      : '📏 Captura obrigatória: DESLIGADA';  // toque para ligar
    if (bJogo) bJogo.textContent = forcarCaptura
      ? '📏 Captura: obrigatória'
      : '📏 Captura: livre';
  }

  function aplica(gr, j, cor) {
    const copia = gr.map(l => l.slice());
    const p = copia[j.fr][j.fc];
    copia[j.fr][j.fc] = 0;
    for (const [cr, cc] of j.capt) copia[cr][cc] = 0;
    let novo = p;
    // promoção no fim da jogada (simples que chegou na linha da dama)
    if (p % 2 === 1) {
      if (cor === BR && j.tr === 0) novo = 2;
      if (cor === PR && j.tr === N - 1) novo = 4;
    }
    copia[j.tr][j.tc] = novo;
    return copia;
  }

  /* ---------------- IA (minimax + alpha-beta) ---------------- */

  function avalia(gr) {
    let e = 0;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const p = gr[r][c];
      if (!p) continue;
      if (p === 1) e += 100 + (9 - r) * 3;                 // branca simples avança
      else if (p === 2) e += 260 + (9 - r);               // branca dama
      else if (p === 3) e -= 100 + r * 3;                 // preta simples
      else e -= 260 + r;                                  // preta dama
    }
    return e;
  }

  const PRF = 100000;

  function minimax(gr, cor, prof, a, b) {
    const legal = jogadasLegais(gr, cor);
    if (!legal.length) return cor === PR ? -PRF : PRF; // quem não pode jogar, perde (valor do ponto de vista do Preto)
    if (prof === 0) return avalia(gr);

    const caps = legal.length && legal[0].capt.length ? legal : null;
    const movs = caps ? legal.slice().sort((x, y) => y.capt.length - x.capt.length) : legal;
    let best = cor === PR ? -Infinity : Infinity;

    if (cor === PR) {
      for (const j of movs) {
        const v = minimax(aplica(gr, j, cor), BR, prof - 1, a, b);
        if (v > best) best = v;
        if (best > a) a = best;
        if (b <= a) break;
      }
    } else {
      for (const j of movs) {
        const v = minimax(aplica(gr, j, cor), PR, prof - 1, a, b);
        if (v < best) best = v;
        if (best < b) b = best;
        if (b <= a) break;
      }
    }
    return best;
  }

  function melhorJogadaIA(gr, cor) {
    const legal = jogadasLegais(gr, cor);
    if (!legal.length) return null;
    const caps = legal[0].capt.length ? legal : null;
    const movs = (caps || legal).slice();
    // ordem: capturas maiores primeiro, depois avanço
    movs.sort((x, y) => (y.capt.length - x.capt.length) ||
      ((cor === BR ? x.fr - x.tr : x.tr - x.fr) - (cor === BR ? y.fr - y.tr : y.tr - y.fr)));
    let best = cor === PR ? -Infinity : Infinity;
    let escolha = movs[0];
    for (const j of movs) {
      const v = minimax(aplica(gr, j, cor), cor === PR ? BR : PR, 5, -Infinity, Infinity);
      if (cor === PR ? v > best : v < best) { best = v; escolha = j; }
    }
    return escolha;
  }

  /* ---------------- UI ---------------- */

  function desenha() {
    tabEl.innerHTML = '';
    // peças obrigadas a capturar (regra oficial) -> anel vermelho
    const deveSet = new Set();
    if (!fim && forcarCaptura) {
      const legal = jogadasLegais(g, vez);
      if (legal.length && legal[0].capt.length) {
        for (const l of legal) deveSet.add(key(l.fr, l.fc));
      }
    }
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const casa = document.createElement('div');
      casa.className = (r + c) % 2 === 1 ? 'casa escura' : 'casa clara';
      casa.dataset.r = r;
      casa.dataset.c = c;
      const p = g[r][c];
      if (p) {
        const pe = document.createElement('div');
        pe.className = 'peca ' + (corDe(p) === BR ? 'br' : 'pr');
        if (p % 2 === 0) pe.textContent = '👑';
        casa.appendChild(pe);
      }
      if (selecao && selecao.r === r && selecao.c === c) casa.classList.add('selecionada');
      const d = destinos.get(key(r, c));
      if (d) {
        casa.classList.add('destino', 'jogavel');
        if (d[2]) casa.classList.add('capturar');
      }
      const k = key(r, c);
      if (comerSet.has(k)) casa.classList.add('comer');
      else if (trajetoSet.has(k)) casa.classList.add('trajeto');
      if (deveSet.has(k) && !(selecao && selecao.r === r && selecao.c === c)) {
        casa.classList.add('deve');
      }
      tabEl.appendChild(casa);
    }
    atualizaStatus();
  }

  function contagem(cor) {
    let n = 0;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const p = g[r][c];
      if (p && corDe(p) === cor) n++;
    }
    return n;
  }

  function atualizaPlacar() {
    $('pts-br').textContent = vitorias.BR;
    $('pts-pr').textContent = vitorias.PR;
    $('pts-e').textContent = vitorias.E;
    $('pe-br').textContent = contagem(BR) + ' peças';
    $('pe-pr').textContent = contagem(PR) + ' peças';
    $('p-br').classList.toggle('ativo', !fim && vez === BR);
    $('p-pr').classList.toggle('ativo', !fim && vez === PR);
  }

  function nome(cor) {
    if (modo === 'cpu') return cor === PR ? '🤖 Máquina' : '😎 Você';
    return cor === BR ? '⚪ Branco' : '⚫ Preto';
  }

  function atualizaStatus() {
    const s = $('status');
    if (fim) return;
    let texto, aviso = false;
    if (modo === 'cpu' && vez === PR) {
      texto = '🤖 Máquina pensando...';
    } else if (forcarCaptura && temCaptura(g, vez)) {
      aviso = true;
      texto = '⚠️ Captura obrigatória! Vez de ' + nome(vez);
    } else {
      texto = 'Vez de ' + nome(vez) + (modo === 'pvp' ? '' : ' — escolha uma peça');
    }
    s.textContent = texto;
    s.classList.toggle('aviso', aviso);
    atualizaPlacar();
  }

  window.iniciarJogo = function (m) {
    modo = m;
    $('menu').classList.add('hidden');
    $('jogo').classList.remove('hidden');
    $('rot-br').textContent = '😎 ' + (m === 'cpu' ? 'Você' : 'Branco');
    $('rot-pr').textContent = m === 'cpu' ? '🤖 Máquina' : '⚫ Preto';
    vitorias = { BR: 0, PR: 0, E: 0 };
    novaPartida();
  };

  window.novaPartida = function () {
    g = novaMesa();
    vez = BR;
    fim = false;
    iaToken++;           // invalida qualquer "pensando" da partida anterior
    pensando = false;
    animando = false;
    limpaSelecao();
    $('fim-overlay').classList.add('hidden');
    desenha();
    atualizaPlacar();
    if (modo === 'cpu' && vez === PR) pensarIA();
  };

  window.voltarMenu = function () {
    $('jogo').classList.add('hidden');
    $('menu').classList.remove('hidden');
  };

  const frasesVitoria = [
    'Que partida! Você foi imbatível! 👑',
    'A máquina está pedindo hora para rever a aula 😄',
    'Imparável! Quer uma revanche? 🔄',
    'Mandou bem demais, campeão! 🎩'
  ];
  const frasesDerrota = [
    'A máquina venceu essa — mas a revanche é sua! 💪',
    'Ficou perto... bora tentar de novo? 🔄'
  ];

  function mostrarOverlay(quem) {
    const eo = $('fim-emoji'), t = $('fim-titulo'), sub = $('fim-sub');
    if (modo === 'cpu') {
      if (quem === BR) {
        eo.textContent = '🎉';
        t.textContent = 'Você venceu!';
        sub.textContent = frasesVitoria[Math.floor(Math.random() * frasesVitoria.length)];
      } else {
        eo.textContent = '🤖';
        t.textContent = 'A máquina venceu!';
        sub.textContent = frasesDerrota[Math.floor(Math.random() * frasesDerrota.length)];
      }
    } else {
      eo.textContent = '🎉';
      t.textContent = nome(quem) + ' venceu!';
      sub.textContent = 'Que final! Vamos de revanche? 🔄';
    }
    $('fim-overlay').classList.remove('hidden');
  }

  function termina(quem) {
    fim = true;
    vitorias[quem === BR ? 'BR' : 'PR']++;   // quem é a cor (1/2), o placar usa 'BR'/'PR'
    desenha();
    atualizaPlacar();
    const s = $('status');
    s.textContent = '🏆 ' + nome(quem) + ' venceu!';
    s.classList.remove('aviso');
    mostrarOverlay(quem);
  }

  /* ---------- Animação de jogada ----------
     Peça-fantasma desliza pelo caminho (parando nos pousos das capturas);
     as comidas somem com fade quando o fantasma as salta; promoção ganha um "pop". */
  function animaNovaJogada(j, oldG, aoTerminar) {
    if (!animar) { if (aoTerminar) aoTerminar(); return; }
    const pMovida = oldG[j.fr][j.fc];
    if (!pMovida) { if (aoTerminar) aoTerminar(); return; }
    const promocao = pMovida % 2 === 1 && g[j.tr][j.tc] % 2 === 0;

    // peça final: escondida até o fantasma chegar
    const finalCasa = tabEl.children[j.tr * N + j.tc];
    const pecaFinal = finalCasa ? finalCasa.querySelector('.peca') : null;

    // caminho: origem -> [P1, L1, P2, L2, ...] (o último pouso é o destino)
    const pts = [[j.fr, j.fc]];
    for (let i = 0; i < j.capt.length; i++) pts.push(j.capt[i], j.pousos[i]);
    if (!j.capt.length) pts.push([j.tr, j.tc]);
    const segs = pts.length - 1;
    const segDur = j.capt.length ? Math.max(80, Math.min(160, 520 / segs)) : 220;
    const total = segs * segDur;

    animando = true;
    if (pecaFinal) pecaFinal.classList.add('escondida');

    // fantasma da peça em movimento
    const ghost = document.createElement('div');
    ghost.className = 'ghost';
    ghost.style.left = (j.fc * 10) + '%';
    ghost.style.top = (j.fr * 10) + '%';
    const gp = document.createElement('div');
    gp.className = 'peca ' + (corDe(pMovida) === BR ? 'br' : 'pr');
    if (pMovida % 2 === 0) gp.textContent = '👑';
    ghost.appendChild(gp);
    tabEl.appendChild(ghost);

    const keyframes = pts.map(([r, c]) => ({
      transform: 'translate(' + ((c - j.fc) * 100) + '%, ' + ((r - j.fr) * 100) + '%)'
    }));
    const anim = ghost.animate(keyframes, { duration: total, easing: 'ease-in-out' });

    // peças comidas: fade no momento em que o fantasma as salta
    j.capt.forEach(([r, c], i) => {
      const alvo = oldG[r][c];
      if (!alvo) return;
      const cg = document.createElement('div');
      cg.className = 'ghost';
      cg.style.left = (c * 10) + '%';
      cg.style.top = (r * 10) + '%';
      const cp = document.createElement('div');
      cp.className = 'peca ' + (corDe(alvo) === BR ? 'br' : 'pr');
      if (alvo % 2 === 0) cp.textContent = '👑';
      cg.appendChild(cp);
      tabEl.appendChild(cg);
      cg.animate(
        [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(0.3)' }],
        { duration: 200, delay: Math.max(0, (2 * i + 1) * segDur - 60), fill: 'forwards' }
      ).onfinish = () => cg.remove();
    });

    let pronto = false;
    const terminar = () => {
      if (pronto) return;
      pronto = true;
      ghost.remove();
      if (pecaFinal) {
        pecaFinal.classList.remove('escondida');
        if (promocao) pecaFinal.animate(
          [{ transform: 'scale(0.5)' }, { transform: 'scale(1.25)' }, { transform: 'scale(1)' }],
          { duration: 320 }
        );
      }
      animando = false;
      if (aoTerminar) aoTerminar();
    };
    anim.onfinish = terminar;
    setTimeout(terminar, total + 600); // segurança (aba em segundo plano etc.)
  }

  function fazJogada(j) {
    const oldG = g;
    g = aplica(g, j, vez);
    limpaSelecao();
    const adversario = vez === BR ? PR : BR;
    const semJogada = !jogadasLegais(g, adversario).length;
    if (semJogada) {
      termina(vez);
    } else {
      vez = adversario;
      desenha();
      atualizaPlacar();
    }
    // a máquina só "começa a pensar" depois que a peça em movimento aterrissa
    animaNovaJogada(j, oldG, !semJogada && modo === 'cpu' && vez === PR ? () => pensarIA() : null);
  }

  let pensando = false;
  let iaToken = 0;   // invalida timeouts de "pensar" de partidas antigas
  function pensarIA() {
    const token = ++iaToken;
    pensando = true;
    atualizaStatus();   // sem reconstruir o tabuleiro (preserva animações em andamento)
    setTimeout(() => {
      if (token !== iaToken) return;   // mudou a partida: ignora
      pensando = false;
      if (fim || vez !== PR) return;
      const j = melhorJogadaIA(g, PR);
      if (j) fazJogada(j);
    }, 400);
  }

  tabEl.addEventListener('click', e => {
    if (fim || pensando || animando) return;
    if (modo === 'cpu' && vez === PR) return;
    const casa = e.target.closest('.casa');
    if (!casa) return;
    const r = +casa.dataset.r, c = +casa.dataset.c;

    // jogando destino?
    const d = destinos.get(key(r, c));
    if (d) {
      const legal = jogadasLegais(g, vez).find(l => l.fr === selecao.r && l.fc === selecao.c && l.tr === d[0] && l.tc === d[1]);
      if (legal) fazJogada(legal);
      return;
    }

    // selecionar peça própria
    const p = g[r][c];
    if (p && corDe(p) === vez) {
      limpaSelecao();
      selecao = { r, c };
      const legal = jogadasLegais(g, vez).filter(l => l.fr === r && l.fc === c);
      if (legal.length) {
        for (const l of legal) {
          const k = key(l.tr, l.tc);
          const atual = destinos.get(k);
          if (!atual || l.capt.length > 0) destinos.set(k, [l.tr, l.tc, l.capt.length > 0]); // captura tem prioridade
          // caminho da captura: P (peça comida) e L (pouso após cada captura)
          let pr = r, pc = c;
          for (let i = 0; i < l.capt.length; i++) {
            const [er, ec] = l.capt[i];
            const [lr, lc] = l.pousos[i];
            comerSet.add(key(er, ec));
            marcarEntre(pr, pc, er, ec, trajetoSet);
            marcarEntre(er, ec, lr, lc, trajetoSet);
            trajetoSet.add(key(lr, lc)); // pouso intermediário
            pr = lr; pc = lc;
          }
        }
      }
      desenha();
      return;
    }

    // clicou em outro lugar: desmarcar
    limpaSelecao();
    desenha();
  });

  atualizaForcarUI();
})();
</script>
</body>
</html>
