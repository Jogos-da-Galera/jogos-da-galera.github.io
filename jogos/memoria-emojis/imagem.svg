<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#3b1a6e"/>
      <stop offset="100%" stop-color="#120821"/>
    </radialGradient>
    <linearGradient id="cardBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="cardFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b1a6e"/>
      <stop offset="100%" stop-color="#1d0f3f"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="480" height="300" fill="url(#bg)"/>

  <!-- cartões virados (frente) -->
  <g>
    <rect x="60" y="60" width="72" height="90" rx="12" fill="url(#cardFace)" stroke="#a78bfa" stroke-width="2"/>
    <text x="96" y="122" font-size="40" text-anchor="middle">🦄</text>

    <rect x="348" y="150" width="72" height="90" rx="12" fill="url(#cardFace)" stroke="#a78bfa" stroke-width="2"/>
    <text x="384" y="212" font-size="40" text-anchor="middle">🦄</text>
  </g>

  <!-- cartões fechados (verso) -->
  <g>
    <rect x="162" y="60" width="72" height="90" rx="12" fill="url(#cardBack)" stroke="#a78bfa" stroke-width="2"/>
    <text x="198" y="122" font-size="34" text-anchor="middle" fill="#ede9fe" font-family="sans-serif">?</text>

    <rect x="244" y="60" width="72" height="90" rx="12" fill="url(#cardBack)" stroke="#a78bfa" stroke-width="2"/>
    <text x="280" y="122" font-size="34" text-anchor="middle" fill="#ede9fe" font-family="sans-serif">?</text>

    <rect x="60" y="150" width="72" height="90" rx="12" fill="url(#cardBack)" stroke="#a78bfa" stroke-width="2"/>
    <text x="96" y="212" font-size="34" text-anchor="middle" fill="#ede9fe" font-family="sans-serif">?</text>

    <rect x="162" y="150" width="72" height="90" rx="12" fill="url(#cardBack)" stroke="#a78bfa" stroke-width="2"/>
    <text x="198" y="212" font-size="34" text-anchor="middle" fill="#ede9fe" font-family="sans-serif">?</text>

    <rect x="244" y="150" width="72" height="90" rx="12" fill="url(#cardBack)" stroke="#a78bfa" stroke-width="2"/>
    <text x="280" y="212" font-size="34" text-anchor="middle" fill="#ede9fe" font-family="sans-serif">?</text>

    <rect x="348" y="60" width="72" height="90" rx="12" fill="url(#cardBack)" stroke="#a78bfa" stroke-width="2"/>
    <text x="384" y="122" font-size="34" text-anchor="middle" fill="#ede9fe" font-family="sans-serif">?</text>
  </g>

  <!-- brilhos -->
  <circle cx="40" cy="40" r="3" fill="#a78bfa" opacity="0.7"/>
  <circle cx="445" cy="270" r="4" fill="#f472b6" opacity="0.6"/>
  <circle cx="430" cy="30" r="2.5" fill="#34d399" opacity="0.7"/>
  <circle cx="30" cy="265" r="3" fill="#22d3ee" opacity="0.6"/>
</svg>
