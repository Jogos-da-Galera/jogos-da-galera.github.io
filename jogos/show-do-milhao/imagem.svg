<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="-10%" r="120%">
      <stop offset="0%" stop-color="#3b1a6e"/>
      <stop offset="60%" stop-color="#0d0621"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="prow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>
  <!-- escada de prêmios -->
  <g font-family="Segoe UI, sans-serif" font-weight="bold" font-size="13" fill="#c9b8f0" text-anchor="end">
    <rect x="20" y="20" width="120" height="26" rx="6" fill="#1e1140" stroke="#3d2570"/>
    <rect x="30" y="52" width="120" height="26" rx="6" fill="#1e1140" stroke="#3d2570"/>
    <rect x="40" y="84" width="120" height="26" rx="6" fill="#1e1140" stroke="#3d2570"/>
    <rect x="50" y="116" width="120" height="26" rx="6" fill="#2a1650" stroke="#4c2d96"/>
    <rect x="60" y="148" width="120" height="28" rx="6" fill="#a855f7"/>
    <rect x="70" y="182" width="120" height="26" rx="6" fill="#1e1140" stroke="#facc15"/>
    <rect x="80" y="214" width="120" height="26" rx="6" fill="#1e1140" stroke="#3d2570"/>
    <rect x="90" y="246" width="120" height="26" rx="6" fill="#1e1140" stroke="#3d2570"/>
    <text x="132" y="38">1 mil</text>
    <text x="142" y="70">10 mil</text>
    <text x="152" y="102">50 mil</text>
    <text x="162" y="134">100 mil</text>
    <text x="172" y="168" fill="#fff">1 milhão</text>
    <text x="182" y="200">200 mil</text>
    <text x="192" y="232" fill="#e2d3a0">500 mil</text>
    <text x="202" y="264">1,5 mi</text>
  </g>
  <!-- pergunta -->
  <rect x="230" y="60" width="220" height="150" rx="14" fill="#1e1140" stroke="#4c2d96" stroke-width="2"/>
  <text x="340" y="115" font-family="Segoe UI, sans-serif" font-size="60" text-anchor="middle">?</text>
  <rect x="250" y="140" width="180" height="26" rx="8" fill="#241352" stroke="#4c2d96"/>
  <circle cx="265" cy="153" r="8" fill="url(#prow)"/>
  <rect x="250" y="174" width="180" height="26" rx="8" fill="#241352" stroke="#4c2d96"/>
  <circle cx="265" cy="187" r="8" fill="url(#prow)"/>
  <!-- moeda -->
  <circle cx="340" cy="255" r="34" fill="url(#gold)" stroke="#b45309" stroke-width="3"/>
  <text x="340" y="266" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="26" text-anchor="middle" fill="#7c2d12">R$</text>
  <text x="420" y="262" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="24" text-anchor="middle" fill="#facc15">1 mi</text>
  <!-- título -->
  <text x="240" y="42" font-family="Segoe UI, sans-serif" font-weight="900" font-size="34" text-anchor="middle" fill="#facc15">💰 Show do Milhão</text>
</svg>
