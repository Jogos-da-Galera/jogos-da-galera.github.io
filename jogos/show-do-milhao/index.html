<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Show do Milhão 🎉</title>
<style>
  :root {
    --bg: #0d0621;
    --primary: #a855f7;
    --accent: #e879f9;
    --gold: #facc15;
    --green: #4ade80;
    --red: #f87171;
    --card: #1e1140;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(900px 500px at 50% -10%, #3b1a6e 0%, var(--bg) 60%);
    color: #f5f0ff;
    font-family: "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px;
    user-select: none;
  }
  h1 {
    font-size: 1.5rem;
    background: linear-gradient(90deg, var(--gold), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 10px;
    text-align: center;
  }
  .wrap {
    display: flex;
    gap: 14px;
    width: 100%;
    max-width: 980px;
    flex: 1;
    align-items: flex-start;
  }
  /* Escada de prêmios */
  #ladder {
    display: flex;
    flex-direction: column-reverse;
    gap: 3px;
    width: 150px;
    flex-shrink: 0;
  }
  #ladder div {
    background: var(--card);
    border: 1px solid #3d2570;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 0.78rem;
    color: #9d8ac2;
    text-align: right;
    transition: all .2s;
  }
  #ladder div.safe { border-color: var(--gold); color: #e2d3a0; }
  #ladder div.done { background: #2a1650; color: #c9b8f0; }
  #ladder div.current {
    background: var(--primary);
    border-color: var(--accent);
    color: #fff;
    font-weight: 800;
    transform: scale(1.06);
    box-shadow: 0 0 12px rgba(168,85,247,.7);
  }
  /* Painel principal */
  #panel {
    flex: 1;
    background: var(--card);
    border: 2px solid #3d2570;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 420px;
  }
  #topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  #prize {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--gold);
  }
  #qcount { color: #9d8ac2; font-weight: 700; font-size: .95rem; }
  #question {
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1.35;
    min-height: 70px;
  }
  #answers { display: grid; gap: 10px; }
  .ans {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #241352;
    border: 2px solid #4c2d96;
    border-radius: 12px;
    color: #fff;
    padding: 13px 14px;
    font-size: 1.02rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    text-align: left;
    font-family: inherit;
  }
  .ans:hover:not(:disabled) { border-color: var(--accent); transform: translateX(4px); }
  .ans .letter {
    background: var(--primary);
    border-radius: 8px;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    flex-shrink: 0;
  }
  .ans.correct { border-color: var(--green); background: #14532d; }
  .ans.wrong { border-color: var(--red); background: #5b1515; }
  .ans.dim { opacity: 0; pointer-events: none; }
  .ans:disabled { cursor: default; }
  /* Bônus / lifelines */
  #lifelines { display: flex; gap: 10px; flex-wrap: wrap; }
  .life {
    flex: 1;
    min-width: 120px;
    background: linear-gradient(135deg, #3d1d78, #6d28d9);
    border: 2px solid var(--accent);
    border-radius: 12px;
    color: #fff;
    padding: 12px 10px;
    font-size: .95rem;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
  }
  .life:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(232,121,249,.35); }
  .life:disabled { opacity: .3; cursor: default; }
  .life small { display: block; font-weight: 600; opacity: .8; margin-top: 2px; font-size: .75rem; }
  /* Plateia */
  #poll { display: none; grid-template-columns: 1fr 1fr; gap: 10px; }
  #poll.show { display: grid; }
  .pollbar {
    background: #241352;
    border-radius: 10px;
    border: 1px solid #4c2d96;
    padding: 8px 12px;
    font-weight: 700;
    font-size: .9rem;
  }
  .pollbar .bar {
    height: 8px;
    background: var(--accent);
    border-radius: 4px;
    margin-top: 6px;
  }
  /* Botões grandes */
  .btn {
    background: linear-gradient(135deg, var(--primary), #7c3aed);
    border: none;
    border-radius: 14px;
    color: #fff;
    font-size: 1.2rem;
    font-weight: 800;
    padding: 16px 28px;
    cursor: pointer;
    font-family: inherit;
    transition: transform .15s;
  }
  .btn:hover { transform: scale(1.04); }
  .btn.ghost {
    background: transparent;
    border: 2px solid var(--accent);
    font-size: 1rem;
    padding: 12px 20px;
  }
  .center { display: flex; flex-direction: column; align-items: center; gap: 16px; flex: 1; justify-content: center; text-align: center; }
  .big { font-size: 3rem; }
  .money-big {
    font-size: 2.6rem;
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(250,204,21,.5);
  }
  .msg { color: #c9b8f0; font-size: 1.05rem; max-width: 420px; line-height: 1.4; }
  #feedback { min-height: 24px; font-weight: 800; font-size: 1.05rem; text-align: center; }
  #feedback.ok { color: var(--green); }
  #feedback.bad { color: var(--red); }
  #feedback.skip { color: var(--accent); }
  #record { color: #9d8ac2; font-size: .9rem; margin-top: 4px; }
  @media (max-width: 720px) {
    #ladder { display: none; }
    .wrap { max-width: 560px; }
    #question { font-size: 1.1rem; }
  }
  @media (max-width: 720px) {
    /* escada compacta no topo */
    #mobileLadder { display: flex !important; gap: 6px; margin-bottom: 6px; width: 100%; max-width: 560px; align-items: center; }
  }
  #mobileLadder { display: none; gap: 6px; align-items: center; }
  #mobileLadder span { font-size: .95rem; font-weight: 800; color: var(--gold); }
  #mobileLadder em { font-style: normal; color: #9d8ac2; font-size: .8rem; }
</style>

    { q: "Qual é o único físico brasileiro premiado com o Nobel?", a: ["de Medeiros", "Jorge Luís Borges", "Rui Barbosa", "Milton Campos"], c: 0 },
    { q: "A que distância aproximada fica o mar do centro de São Paulo?", a: ["100 km", "200 km", "300 km", "400 km"], c: 2 },
    { q: "Quantas línguas oficiais tem a ONU?", a: ["4", "5", "6", "7"], c: 2 }
    ],
  // Nível 12 — R$ 300.000
  [

    { q: "Qual é o menor planeta do sistema solar?", a: ["Vênus", "Mercúrio", "Marte", "Plutão"], c: 1 }
,
    { q: "Qual presidente foi deposto pela Revolução de 1930?", a: ["Vargas", "Floriano", "Brito Malheiro", "Washington Luís"], c: 0 },
    { q: "Qual é a cachoeira mais alta do mundo?", a: ["Iguaçu", "Niágara", "Salto Angel", "Victoria"], c: 2 },
    { q: "Em quanto tempo a luz do Sol chega à Terra?", a: ["8 segundos", "8 minutos", "8 horas", "8 dias"], c: 1 },
    { q: "Quem foi o primeiro presidente militar do Brasil?", a: ["Getulio", "Floriano", "Vargas", "Brito Malheiro"], c: 3 }
    ],
  // Nível 13 — R$ 400.000
  [
    { q: "Qual tratado encerrou a Primeira Guerra Mundial?", a: ["Versalhes", "Tordesilhas", "Viena", "Paris"], c: 0 },
    { q: "Quem pintou 'A Noite Estrelada'?", a: ["Monet", "Picasso", "Van Gogh", "Dalí"], c: 2 },
    { q: "Qual é o gás mais abundante na atmosfera da Terra?", a: ["Oxigênio", "Nitrogênio", "Gás carbônico", "Hélio"], c: 1 },
    { q: "Em que ano houve o primeiro voo do avião dos Irmãos Wright?", a: ["1899", "1903", "1912", "1920"], c: 1 },
    { q: "Qual destas NÃO é cor primária (em RGB)?", a: ["Vermelho", "Azul", "Verde", "Amarelo"], c: 3 }
,
    { q: "Quem escreveu 'Triste Fim de Policarpo Quaresma'?", a: ["Lima Barreto", "Machado de Assis", "Graciliano Ramos", "Rubem Braga"], c: 0 },
    { q: "Quem proclamou a República no terreiro da Academia Militar?", a: ["Brito Malheiro", "Deodoro", "Floriano", "Vargas"], c: 0 },
    { q: "Com quantos estados faz fronteira o Distrito Federal?", a: ["1", "2", "3", "4"], c: 1 },
    { q: "Qual é o ponto mais profundo dos oceanos?", a: ["Fossa das Marianas", "Fossa de Porto Rico", "Fossa de Java", "Fossa de Tonga"], c: 0 }
    ],
  // Nível 14 — R$ 500.000
  [
    { q: "Quem foi o último imperador do Brasil?", a: ["Dom Pedro I", "Dom Pedro II", "Prudente de Morais", "Deodoro da Fonseca"], c: 1 },
    { q: "Quem escreveu o romance 'O Alquimista'?", a: ["Jorge Amado", "Machado de Assis", "Paulo Coelho", "Clarice Lispector"], c: 2 },
    { q: "Qual é a moeda oficial do Japão?", a: ["Won", "Yuan", "Iene", "Ringgit"], c: 2 },
    { q: "Em que cidade fica o relógio de 'Big Ben'?", a: ["Paris", "Londres", "Berlim", "Roma"], c: 1 },
    { q: "Qual é o osso mais longo do corpo humano?", a: ["Úmero", "Fêmur", "Tíbia", "Rádio"], c: 1 }
,
    { q: "Qual foi a última região do Brasil a abolir a escravidão?", a: ["Ceará", "Vale do Ribeira", "Minas Gerais", "Rio de Janeiro"], c: 1 },
    { q: "Qual foi a primeira eleição presidencial direta após a ditadura?", a: ["Tancredo", "Sarney", "Collor", "Itamar"], c: 2 },
    { q: "Qual a distância média da Terra à Lua?", a: ["384.400 km", "100.000 km", "1,5 milhão km", "50 milhões km"], c: 0 },
    { q: "Quantas versões oficiais a bandeira do Brasil já teve?", a: ["2", "3", "4", "5"], c: 1 }
    ],
  // Nível 15 — R$ 1.000.000
  [
    { q: "Qual é o único mamífero capaz de voar de verdade?", a: ["Cervo-voador", "Morcego", "Rato-fugitivo", "Lemur"], c: 1 },
    { q: "Em que ano caiu o Muro de Berlim?", a: ["1985", "1987", "1989", "1991"], c: 2 },
    { q: "Qual é o osso mais pequeno do corpo humano?", a: ["Estribo", "Martelo", "Bigorna", "Clavícula"], c: 0 },
    { q: "Quem compôs as 'Quatro Estações'?", a: ["Mozart", "Vivaldi", "Beethoven", "Bach"], c: 1 },
    { q: "Qual destes elementos é líquido à temperatura ambiente?", a: ["Ferro", "Mercúrio", "Enxofre", "Cobre"], c: 1 }
,
    { q: "Qual é o menor país do mundo?", a: ["Vaticano", "Mônaco", "San Marino", "Liechtenstein"], c: 0 },
    { q: "Quem foi o primeiro secretário-geral da ONU?", a: ["Trygve Lie", "Dag Hammarskjöld", "Kurt Waldheim", "Kofi Annan"], c: 0 },
    { q: "Qual é a montanha mais alta fora da Ásia?", a: ["Aconcágua", "Everest", "K2", "Monte Branco"], c: 0 },
    { q: "Em que ano foi promulgada a atual Constituição do Brasil?", a: ["1985", "1986", "1987", "1988"], c: 3 }
    ]
];

const fmt = v => "R$ " + v.toLocaleString("pt-BR");
const $ = s => document.querySelector(s);
let state;

function newState() {
  return {
    i: 0,            // índice da pergunta atual (0..15)
    current: 0,      // prêmio acumulado
    skips: 3,
    fifty: 1,
    audience: 1,
    poll: false,
    over: false,
    questions: buildGame()
  };
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// sorteia uma pergunta de cada nível de dificuldade e embaralha as alternativas
function buildGame() {
  return POOL.map(tier => {
    const q = tier[Math.floor(Math.random() * tier.length)];
    const order = shuffle([0, 1, 2, 3]);
    return { q: q.q, a: order.map(i => q.a[i]), c: order.indexOf(q.c) };
  });
}

function renderLadder() {
  const el = $("#ladder");
  el.innerHTML = "";
  if (!state) { $("#mPrize").textContent = "R$ 0"; $("#mCount").textContent = "0/15"; return; }
  for (let i = 14; i >= 0; i--) {
    const d = document.createElement("div");
    d.textContent = fmt(PRIZES[i]);
    const n = i + 1;
    if (SAFE[n]) d.classList.add("safe");
    if (n < state.i || state.over) d.classList.add("done");
    if (n === state.i && !state.over) d.classList.add("current");
    el.appendChild(d);
  }
  $("#mPrize").textContent = fmt(state.current);
  $("#mCount").textContent = Math.min(state.i, 15) + "/15";
}

function render() {
  renderLadder();
  const p = $("#panel");
  if (!state || state.i === 0) return renderStart(p);
  if (state.over) return renderEnd(p);

  const n = state.i; // pergunta atual (1..15)
  const Q = state.questions[n - 1];
  const canSkip = n < 15; // na última não faz sentido pular
  p.innerHTML = `
    <div id="topbar">
      <div id="prize">${fmt(PRIZES[n-1])}</div>
      <div id="qcount">Pergunta ${n} de 15</div>
    </div>
    <div id="question">${Q.q}</div>
    <div id="poll"></div>
    <div id="answers"></div>
    <div id="lifelines">
      <button class="life" id="lf-skip">⏭️ PULAR (x${state.skips})<small>${canSkip ? "salta a pergunta e avança sem risco" : "não dá pra pular a última!"}</small></button>
      <button class="life" id="lf-50">✂️ 50:50 (x${state.fifty})<small>elimina 2 alternativas</small></button>
      <button class="life" id="lf-aud">👥 Plateia (x${state.audience})<small>opinião do público</small></button>
    </div>
    <div id="feedback"></div>
    <button class="btn ghost" id="btn-stop">🛑 Parar e levar ${fmt(state.current)}</button>
  `;

  const box = $("#answers");
  Q.a.forEach((txt, i) => {
    const b = document.createElement("button");
    b.className = "ans";
    b.innerHTML = `<span class="letter">${"ABCD"[i]}</span><span>${txt}</span>`;
    b.onclick = () => answer(i);
    box.appendChild(b);
  });

  $("#lf-skip").disabled = state.skips <= 0 || !canSkip;
  $("#lf-50").disabled = state.fifty <= 0;
  $("#lf-aud").disabled = state.audience <= 0;
  $("#lf-skip").onclick = skip;
  $("#lf-50").onclick = fifty;
  $("#lf-aud").onclick = poll;
  $("#btn-stop").onclick = () => { state.over = true; state.stopped = true; render(); };
}

function lockAnswers() {
  document.querySelectorAll(".ans").forEach(b => b.disabled = true);
}

function answer(i) {
  const n = state.i;
  const Q = state.questions[n - 1];
  const btns = document.querySelectorAll(".ans");
  lockAnswers();
  const fb = $("#feedback");
  if (i === Q.c) {
    btns[i].classList.add("correct");
    state.current = PRIZES[n - 1];
    fb.textContent = "✅ Resposta certa! Você garantiu " + fmt(state.current) + "!";
    fb.className = "ok";
    if (n === 15) { setTimeout(() => { state.over = true; state.won = true; render(); }, 1600); return; }
    setTimeout(() => { state.i++; render(); }, 1700);
  } else {
    btns[i].classList.add("wrong");
    btns[Q.c].classList.add("correct");
    const safe = lastSafe(n);
    state.over = true;
    state.lost = fmt(PRIZES[n-1]) === fmt(safe) ? state.current : safe;
    fb.textContent = `❌ Errou! A resposta era "${Q.a[Q.c]}"...`;
    fb.className = "bad";
    setTimeout(render, 2000);
  }
}

function lastSafe(n) {
  // valor seguro = o maior marco seguro estritamente antes da pergunta atual
  let r = 0;
  for (let k = 1; k < n; k++) if (SAFE[k]) r = SAFE[k];
  return r;
}

function skip() {
  if (state.skips <= 0) return;
  state.skips--;
  lockAnswers();
  const fb = $("#feedback");
  fb.textContent = "⏭️ Pergunta pulada! Sem risco, e você já sobe na escada pra próxima.";
  fb.className = "skip";
  setTimeout(() => { state.i++; render(); }, 1400);
}

function fifty() {
  if (state.fifty <= 0) return;
  state.fifty--;
  const Q = state.questions[state.i - 1];
  const wrongs = [0,1,2,3].filter(i => i !== Q.c);
  wrongs.sort(() => Math.random() - 0.5);
  const kill = wrongs.slice(0, 2);
  kill.forEach(i => document.querySelectorAll(".ans")[i].classList.add("dim"));
  document.getElementById("lf-50").disabled = true;
}

function poll() {
  if (state.audience <= 0) return;
  state.audience--;
  const Q = state.questions[state.i - 1];
  const box = $("#poll");
  box.classList.add("show");
  let base = 40 + Math.floor(Math.random() * 35); // 40-74% para a certa
  const shares = [0,0,0,0];
  shares[Q.c] = base;
  let rest = 100 - base;
  const others = [0,1,2,3].filter(i => i !== Q.c);
  others.forEach((i, idx) => {
    const take = idx === 2 ? rest : Math.floor(rest * 0.5);
    shares[i] = take;
    rest -= take;
  });
  shares.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = "pollbar";
    d.innerHTML = `${"ABCD"[i]}: ${s}%<div class="bar" style="width:${s}%"></div>`;
    box.appendChild(d);
  });
  document.getElementById("lf-aud").disabled = true;
}

function renderStart(p) {
  const best = localStorage.getItem("show-do-milhao-high") || 0;
  p.innerHTML = `
    <div class="center">
      <div class="big">💰🎉</div>
      <div class="msg">Responda 15 perguntas e ganhe <b style="color:var(--gold)">R$ 1.000.000</b>!</div>
      <div class="msg">Truques disponíveis: <b>⏭️ Pular</b> (3x), <b>✂️ 50:50</b> (1x) e <b>👥 Plateia</b> (1x). Errou? Fica com o último valor seguro (R$ 10 mil, R$ 100 mil ou o milhão) — ou pare quando quiser e leve o que já tem!</div>
      ${best ? `<div class="msg">🏆 Recorde: <b style="color:var(--gold)">${fmt(+best)}</b></div>` : ""}
      <button class="btn" id="btn-start">🎬 COMEÇAR</button>
    </div>`;
  $("#btn-start").onclick = () => { state = newState(); state.i = 1; render(); };
}

function renderEnd(p) {
  let won = state.won, stopped = state.stopped;
  let amount = won ? PRIZES[14] : (stopped ? state.current : lastSafe(state.i));
  const best = +(localStorage.getItem("show-do-milhao-high") || 0);
  if (amount > best) localStorage.setItem("show-do-milhao-high", String(amount));
  const isRec = amount >= best && amount > 0;
  const title = won ? "🏆 VOCÊ GANHOU O MILHÃO!" : stopped ? "🛑 Você parou!" : "💥 Fim de jogo!";
  const msg = won
    ? "Inacreditável! Você subiu a escada inteira e levou o prêmio máximo!"
    : stopped
      ? "Decisão corajosa: você garantiu o prêmio que acumulou."
      : `Você caiu na pergunta ${state.i}. O valor seguro que ficou foi...`;
  p.innerHTML = `
    <div class="center">
      <div class="big">${won ? "🎉💰🎉" : stopped ? "🤝" : "😅"}</div>
      <div class="msg">${title}<br>${msg}</div>
      <div class="money-big">${fmt(amount)}</div>
      ${isRec ? `<div class="msg">🏆 <b>Novo recorde pessoal!</b></div>` : ""}
      <div class="msg" style="color:#9d8ac2">Recorde: ${fmt(Math.max(best, amount))}</div>
      <button class="btn" id="btn-again">🔁 JOGAR DE NOVO</button>
    </div>`;
  $("#btn-again").onclick = () => { state = null; render(); };
}

state = null;
render();
</script>
