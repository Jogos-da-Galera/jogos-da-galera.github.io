<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300">
  <!-- céu -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ec9f5"/>
      <stop offset="1" stop-color="#e3f2ff"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#sky)"/>
  <circle cx="420" cy="50" r="26" fill="#fff0b4"/>
  <!-- casa alvo -->
  <g>
    <rect x="290" y="120" width="130" height="120" fill="#e8867a"/>
    <polygon points="280,120 355,70 430,120" fill="#a85548"/>
    <rect x="335" y="160" width="40" height="45" fill="#a85548" rx="4"/>
    <rect x="323" y="135" width="64" height="34" fill="#d9f1ff" stroke="#00000055" stroke-width="3"/>
    <rect x="333" y="180" width="44" height="26" fill="#fff" rx="6"/>
    <text x="355" y="199" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">7</text>
    <text x="355" y="60" text-anchor="middle" font-size="28">📍</text>
  </g>
  <!-- restaurante -->
  <g>
    <rect x="20" y="140" width="120" height="100" fill="#5b4636"/>
    <rect x="20" y="140" width="120" height="18" fill="#e0483e"/>
    <rect x="40" y="118" width="80" height="24" fill="#2c2233" rx="5"/>
    <text x="80" y="135" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffd93d">RESTAURANTE</text>
    <text x="80" y="200" text-anchor="middle" font-size="26">🍔</text>
  </g>
  <!-- rua -->
  <rect x="0" y="240" width="480" height="60" fill="#565666"/>
  <rect x="0" y="240" width="480" height="7" fill="#6e6e80"/>
  <g fill="#ffd93d">
    <rect x="20" y="282" width="30" height="6"/>
    <rect x="100" y="282" width="30" height="6"/>
    <rect x="180" y="282" width="30" height="6"/>
    <rect x="260" y="282" width="30" height="6"/>
    <rect x="340" y="282" width="30" height="6"/>
    <rect x="420" y="282" width="30" height="6"/>
  </g>
  <!-- entregador de scooter -->
  <g>
    <ellipse cx="185" cy="245" rx="28" ry="6" fill="#00000033"/>
    <text x="185" y="228" text-anchor="middle" font-size="46">🛵</text>
    <rect x="140" y="200" width="26" height="22" fill="#c98d4f" rx="4"/>
    <rect x="140" y="209" width="26" height="6" fill="#e0483e"/>
  </g>
  <!-- pedestre / cachorro -->
  <text x="255" y="230" text-anchor="middle" font-size="30">🚶</text>
  <text x="455" y="230" text-anchor="middle" font-size="26">🐕</text>
</svg>
