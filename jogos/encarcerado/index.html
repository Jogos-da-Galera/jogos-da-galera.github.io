<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>A Fuga</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0812;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { background: #000; max-width: 100%; max-height: 100%; }
  /* ---------- Overlay (menu / fim) ---------- */
  #overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(8, 5, 18, .88);
    z-index: 10;
    padding: 12px;
  }
  #overlay.hidden { display: none; }
  .panel {
    background: linear-gradient(160deg, #2d1b4e, #1a1028);
    border: 3px solid #ffd24a;
    border-radius: 18px;
    padding: 20px 24px;
    max-width: 540px; width: 100%;
    color: #fff;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.7);
    max-height: 96%; overflow-y: auto;
  }
  .panel h1 {
    font-size: 34px; margin-bottom: 4px;
    background: linear-gradient(90deg, #ffd66b, #f48c4c, #ff7bac);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: #ffd66b;
  }
  .panel p, .panel li { font-size: 14px; line-height: 1.55; color: #e8defc; }
  .panel ul { list-style: none; text-align: left; margin: 10px auto; max-width: 420px; }
  .panel li { margin: 6px 0; }
  .panel .ctrl { font-size: 13px; color: #b9a8dc; margin: 8px 0; }
  .panel .big { font-size: 26px; font-weight: 800; color: #ffd24a; margin: 6px 0; }
  .btn {
    display: inline-block;
    background: linear-gradient(180deg, #ffb347, #f48c4c);
    border: none; color: #fff;
    font-size: 17px; font-weight: 700;
    padding: 12px 26px; margin: 10px 5px 0;
    border-radius: 999px; cursor: pointer;
    box-shadow: 0 4px 0 #b5632b;
    transition: transform .08s;
    font-family: inherit;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b5632b; }
  .btn.green { background: linear-gradient(180deg, #7bd88f, #43a047); box-shadow: 0 4px 0 #2e7d32; }
  kbd {
    background: #4a3a70; border-radius: 5px; padding: 1px 7px;
    font-size: 12px; font-family: inherit;
  }
  /* ---------- Touch ---------- */
  .touch { position: absolute; bottom: 12px; z-index: 5; display: flex; gap: 10px; }
  .touch.left { left: 12px; }
  .touch.right { right: 12px; }
  .tbtn {
    width: 62px; height: 62px; border-radius: 50%;
    background: rgba(255,255,255,.15);
    border: 2px solid rgba(255,255,255,.45);
    color: #fff; font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    pointer-events: auto;
  }
  .tbtn:active { background: rgba(255,255,255,.4); }
  @media (min-width: 1000px) and (pointer: fine) { .touch { display: none; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="640"></canvas></div>

<div class="touch left">
  <div class="tbtn" data-k="L">◀</div>
  <div class="tbtn" data-k="R">▶</div>
  <div class="tbtn" data-k="U">▲</div>
  <div class="tbtn" data-k="D">▼</div>
</div>
<div class="touch right">
  <div class="tbtn" data-k="P" style="width:74px;height:74px;font-size:30px;">👊</div>
</div>

<div id="overlay">
  <div class="panel" id="panel"></div>
</div>

<script>
'use strict';
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
ctx.scale(2, 2); // canvas físico 960x640, lógica em 480x320
const W = 480, H = 320;
const TAU = Math.PI * 2, FOV = 70 * Math.PI / 180;
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');

// ================= Audio =================
let AC = null;
function audio() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  return AC;
}
function beep(f, d, type, g, slideTo) {
  try {
    const ac = audio(), o = ac.createOscillator(), ga = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, ac.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), ac.currentTime + d);
    ga.gain.setValueAtTime(g || 0.08, ac.currentTime);
    ga.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
    o.connect(ga).connect(ac.destination);
    o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}
const sfx = {
  punch: () => beep(160, 0.09, 'square', 0.09, 70),
  hit:   () => beep(220, 0.12, 'square', 0.1, 90),
  lamp:  () => beep(520, 0.14, 'triangle', 0.1, 780),
  food:  () => beep(440, 0.1, 'sine', 0.1, 660),
  chain: () => beep(300, 0.1, 'square', 0.08, 520),
  key:   () => { beep(660, 0.12, 'triangle', 0.1); setTimeout(() => beep(990, 0.18, 'triangle', 0.1), 90); },
  door:  () => { beep(440, 0.1, 'triangle', 0.1); setTimeout(() => beep(660, 0.1, 'triangle', 0.1), 100); setTimeout(() => beep(880, 0.2, 'triangle', 0.1), 200); },
  locked:() => beep(120, 0.16, 'square', 0.06),
  bite:  () => beep(200, 0.1, 'sawtooth', 0.06, 90),
  arrest:() => beep(400, 0.6, 'sawtooth', 0.12, 60),
  win:   () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.25, 'triangle', 0.1), i * 140)); }
};

// ================= State =================
let state = 'menu';           // menu | playing | arrested | win
let grid = null, cols = 0, rows = 0;
let floorCells = [];
let door = null;
let startX = 0, startY = 0;
let items = [];               // {t:'key'|'lamp'|'food', x, y, seen, taken}
let enemies = [];             // {kind:'police'|'rat'|'prisoner', ...}
let seen = null;              // fog of war
let seenT = 0;

const pl = { x: 2, y: 2, a: 0, fuel: 40, disp: 100, hasKey: false, punchT: 0, punchCd: 0 };
let F = { f: 1, vis: 4, spd: 1.5, cone: 1.15, drain: 1 };   // parâmetros do andar atual
let floorsDone = 0, arrests = 0, punches = 0, t0 = 0, totalMs = 0;
let points = 0, chainsFloor = 0;   // pontos (elos de corrente) por andar e no total
let arrestT = 0, grace = 0, introT = 0, msgT = 0, msgTxt = '', doorMsgCd = 0, warnFuel = false;

function msg(s) { msgTxt = s; msgT = 2.2; }

// ================= Util =================
const isSolid = (x, y) => x < 0 || y < 0 || x >= cols || y >= rows || grid[y | 0][x | 0] !== 0;
const blocked = (x, y, r) => isSolid(x - r, y - r) || isSolid(x + r, y - r) || isSolid(x - r, y + r) || isSolid(x + r, y + r);
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return Math.abs(d); };
const rnd = a => a[(Math.random() * a.length) | 0];

function moveEnt(o, ang, step, r) {
  const nx = o.x + Math.cos(ang) * step, ny = o.y + Math.sin(ang) * step;
  if (!blocked(nx, o.y, r || 0.25)) o.x = nx;
  if (!blocked(o.x, ny, r || 0.25)) o.y = ny;
}

// DDA raycast. Retorna {d, wall, side, cell}
function castRay(px, py, dx, dy, maxD) {
  let mapX = px | 0, mapY = py | 0;
  const ddx = Math.abs(1 / (dx || 1e-9)), ddy = Math.abs(1 / (dy || 1e-9));
  let stepX, stepY, sdx, sdy;
  if (dx < 0) { stepX = -1; sdx = (px - mapX) * ddx; } else { stepX = 1; sdx = (mapX + 1 - px) * ddx; }
  if (dy < 0) { stepY = -1; sdy = (py - mapY) * ddy; } else { stepY = 1; sdy = (mapY + 1 - py) * ddy; }
  let side = 0, t = 0;
  for (let i = 0; i < 256 && t < maxD; i++) {
    if (sdx < sdy) { t = sdx; sdx += ddx; mapX += stepX; side = 0; }
    else { t = sdy; sdy += ddy; mapY += stepY; side = 1; }
    if (mapX < 0 || mapY < 0 || mapX >= cols || mapY >= rows) return { d: t, wall: true, side, cell: 1 };
    const c = grid[mapY][mapX];
    if (c !== 0) return { d: t, wall: true, side, cell: c };
  }
  return { d: maxD, wall: false, side, cell: 0 };
}

function los(x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy);
  if (d < 0.05) return true;
  const r = castRay(x1, y1, dx / d, dy / d, d);
  return !r.wall || r.d >= d - 0.25;
}

function bfsDist(sx, sy) {
  const dist = new Int16Array(rows * cols).fill(-1);
  const q = [[sx, sy]];
  dist[sy * cols + sx] = 0;
  let i = 0;
  while (i < q.length) {
    const [x, y] = q[i++];
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx < 1 || ny < 1 || nx >= cols - 1 || ny >= rows - 1) continue;
      if (grid[ny][nx] !== 0) continue;
      if (dist[ny * cols + nx] !== -1) continue;
      dist[ny * cols + nx] = dist[y * cols + x] + 1;
      q.push([nx, ny]);
    }
  }
  return dist;
}

// BFS com caminho reconstruído (célula de origem → destino)
function pathTo(sx, sy, tx, ty) {
  if (sx === tx && sy === ty) return [];
  const prev = new Int16Array(rows * cols).fill(-2);
  const q = [[sx, sy]];
  prev[sy * cols + sx] = -1;
  let i = 0;
  while (i < q.length) {
    const [x, y] = q[i++];
    if (x === tx && y === ty) break;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx < 1 || ny < 1 || nx >= cols - 1 || ny >= rows - 1) continue;
      if (grid[ny][nx] !== 0) continue;
      if (prev[ny * cols + nx] !== -2) continue;
      prev[ny * cols + nx] = y * cols + x;
      q.push([nx, ny]);
    }
  }
  if (prev[ty * cols + tx] === -2) return [];
  const path = [];
  let cx = tx, cy = ty;
  while (prev[cy * cols + cx] !== -1) {
    path.push([cx, cy]);
    const p = prev[cy * cols + cx];
    cx = p % cols; cy = (p / cols) | 0;
  }
  return path.reverse();
}

// ================= Geração do andar =================
function genMaze(f) {
  cols = 21 + f * 2;                       // 23..41
  let R = 13 + f; if (R % 2 === 0) R++;    // 15..25
  rows = R;
  grid = Array.from({ length: rows }, () => new Array(cols).fill(1));
  // DFS (recursive backtracker iterativo)
  const stack = [[1, 1]];
  grid[1][1] = 0;
  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const opts = [];
    for (const [dx, dy] of [[2, 0], [-2, 0], [0, 2], [0, -2]]) {
      const nx = x + dx, ny = y + dy;
      if (nx > 0 && nx < cols - 1 && ny > 0 && ny < rows - 1 && grid[ny][nx] === 1) opts.push([nx, ny, dx, dy]);
    }
    if (!opts.length) { stack.pop(); continue; }
    const [nx, ny, dx, dy] = rnd(opts);
    grid[y + dy / 2][x + dx / 2] = 0;
    grid[ny][nx] = 0;
    stack.push([nx, ny]);
  }
  // "braiding": abre muros aleatórios para criar loops (dá jeito pra fugir da polícia).
  // andares baixos ficam bem abertos (mais fáceis); altos, mais labirínticos.
  const p = 0.24 - f * 0.014;
  for (let y = 1; y < rows - 1; y++) for (let x = 1; x < cols - 1; x++) {
    if (grid[y][x] !== 1) continue;
    const n = (grid[y][x - 1] === 0) + (grid[y][x + 1] === 0) + (grid[y - 1][x] === 0) + (grid[y + 1][x] === 0);
    if (n === 2 && Math.random() < p) grid[y][x] = 0;
  }
  floorCells = [];
  for (let y = 1; y < rows - 1; y++) for (let x = 1; x < cols - 1; x++) if (grid[y][x] === 0) floorCells.push([x, y]);
}

function setupFloor(f) {
  genMaze(f);
  const startCell = rnd(floorCells);
  pl.x = startCell[0] + 0.5; pl.y = startCell[1] + 0.5;
  startX = pl.x; startY = pl.y;
  pl.hasKey = false;
  // 1º andar: começa com luz cheia e a escuridão chega aos poucos
  pl.fuel = f === 1 ? 100 : Math.min(100, 62 + f * 4);
  chainsFloor = 0;
  pl.disp = Math.min(100, pl.disp + 25);
  pl.punchCd = 0; pl.punchT = 0;
  pl.a = Math.random() * TAU;

  const dist = bfsDist(startCell[0], startCell[1]);
  let maxD = 0;
  for (const [x, y] of floorCells) maxD = Math.max(maxD, dist[y * cols + x]);
  const far = floorCells.filter(([x, y]) => dist[y * cols + x] > maxD * 0.55);

  // chave — bem longe do início
  const kc = rnd(far.length ? far : floorCells);
  items = [{ t: 'key', x: kc[0] + 0.5, y: kc[1] + 0.5, seen: false, taken: false }];
  // mapa do presídio — revela o andar inteiro no minimapa (opcional, pra quem buscar)
  let mc = rnd(far.length ? far : floorCells);
  for (let t = 0; t < 50 && Math.hypot(mc[0] - kc[0], mc[1] - kc[1]) < 3; t++) mc = rnd(far.length ? far : floorCells);
  items.push({ t: 'map', x: mc[0] + 0.5, y: mc[1] + 0.5, seen: false, taken: false });

  // porta de saída — muro adjacente a uma célula distante (fica verde no raycast)
  for (let t = 0; t < 500; t++) {
    const dc = rnd(far.length ? far : floorCells);
    const cand = [[dc[0] + 1, dc[1]], [dc[0] - 1, dc[1]], [dc[0], dc[1] + 1], [dc[0], dc[1] - 1]]
      .filter(([x, y]) => x > 0 && y > 0 && x < cols - 1 && y < rows - 1 && grid[y][x] === 1);
    if (cand.length) { const [dx, dy] = rnd(cand); grid[dy][dx] = 3; door = { x: dx, y: dy }; break; }
  }

  // distribui células afastadas umas das outras e do início
  const spread = (count, minSep, minStart) => {
    const out = [];
    for (let i = 0; i < count; i++) {
      for (let t = 0; t < 300; t++) {
        const [x, y] = rnd(floorCells);
        if (Math.hypot(x - startCell[0], y - startCell[1]) < minStart) continue;
        if (out.every(([ox, oy]) => Math.hypot(x - ox, y - oy) >= minSep)) { out.push([x, y]); break; }
      }
    }
    return out;
  };

  items.push(...spread(3 + Math.floor(f / 2), 4, 2).map(([x, y]) => ({ t: 'lamp', x: x + 0.5, y: y + 0.5, seen: false, taken: false })));
  items.push(...spread(2 + Math.floor(f / 3), 3, 2).map(([x, y]) => ({ t: 'food', x: x + 0.5, y: y + 0.5, seen: false, taken: false })));
  // 3 elos de corrente por andar (valem pontos)
  items.push(...spread(3, 6, 4).map(([x, y]) => ({ t: 'chain', x: x + 0.5, y: y + 0.5, seen: false, taken: false })));

  // inimigos
  enemies = [];
  const np = f === 1 ? 1 : 1 + Math.floor((f - 1) / 2);      // 1..5 (andares seguintes)
  for (const [x, y] of spread(np, 5, 5))
    enemies.push({ kind: 'police', x: x + 0.5, y: y + 0.5, a: Math.random() * TAU, path: [], ti: 0, ret: 0, seen: false, bumpCd: 0, daze: 0 });
  const nr = f === 1 ? 1 : 2 + Math.floor(f / 2);           // 3..7 (andares seguintes)
  for (const [x, y] of spread(nr, 3, 3))
    enemies.push({ kind: 'rat', x: x + 0.5, y: y + 0.5, a: Math.random() * TAU, dirT: Math.random() * 2, seen: false, bumpCd: 0, daze: 0 });
  const npr = f === 1 ? 0 : 1 + Math.floor(f / 3);          // 2..4 (andares seguintes)
  for (const [x, y] of spread(npr, 4, 3))
    enemies.push({ kind: 'prisoner', x: x + 0.5, y: y + 0.5, a: Math.random() * TAU, dirT: Math.random() * 2, seen: false, bumpCd: 0, daze: 0 });

  // 1º andar: patrulha lenta, visão estreita e luz que apaga devagarinho
  F = {
    f,
    vis: f === 1 ? 2.6 : 3.5 + f * 0.28,        // distância em que a polícia te vê
    cone: f === 1 ? 0.7 : 1.15,                 // ângulo do campo de visão da polícia
    spd: f === 1 ? 1.15 : 1.45 + f * 0.09,      // velocidade da patrulha
    drain: f === 1 ? 0.35 : 0.7 + f * 0.04      // velocidade com que a luz apaga
  };
  seen = new Uint8Array(rows * cols);
  seenT = 0; grace = 2.5; introT = 1.8; warnFuel = false;
  doorMsgCd = 0;
}

// ================= Ações =================
function punch() {
  if (state !== 'playing' || introT > 0) return;
  if (pl.punchCd > 0) return;
  if (pl.disp <= 0) { msg('Sem disposição pra socar... 💤 (coma algo!)'); return; }
  pl.punchCd = 0.45; pl.punchT = 0.22;
  pl.disp = Math.max(0, pl.disp - 8);
  punches++;
  sfx.punch();
  // acerta o alvo mais próximo, de animal/outro preso, na direção
  let best = null, bd = 1.0;
  for (const e of enemies) {
    if (e.kind === 'police' || e.daze > 0) continue;
    const dx = e.x - pl.x, dy = e.y - pl.y, d = Math.hypot(dx, dy);
    if (d > bd) continue;
    if (angDiff(pl.a, Math.atan2(dy, dx)) > 1.2) continue;
    best = e; bd = d;
  }
  if (best) {
    best.daze = 4;
    sfx.hit();
    msg(best.kind === 'rat' ? 'Você nocauteou o rato! 🐀' : 'Você deu no outro preso! 🧍');
  }
}

function doArrest() {
  state = 'arrested'; arrestT = 1.4; arrests++;
  sfx.arrest();
}

function nextFloor() {
  floorsDone++;
  sfx.door();
  if (floorsDone >= 10) { winGame(); return; }
  setupFloor(floorsDone + 1);
}

// ================= IA dos inimigos =================
function updPolice(e, dt) {
  if (e.daze > 0) { e.daze -= dt; return; }
  const dx = pl.x - e.x, dy = pl.y - e.y, d = Math.hypot(dx, dy);
  if (grace <= 0 && state === 'playing') {
    if (d < 1.5) { doArrest(); return; }
    if (d < F.vis && angDiff(e.a, Math.atan2(dy, dx)) < F.cone && los(e.x, e.y, pl.x, pl.y)) { doArrest(); return; }
  }
  e.ret -= dt;
  if (e.ti >= e.path.length || e.ret <= 0) {
    const tc = rnd(floorCells);
    e.path = pathTo(e.x | 0, e.y | 0, tc[0], tc[1]);
    e.ti = 0; e.ret = 8 + Math.random() * 6;
  }
  if (e.path.length) {
    const [tx, ty] = e.path[e.ti];
    const gx = tx + 0.5, gy = ty + 0.5;
    const mdx = gx - e.x, mdy = gy - e.y, md = Math.hypot(mdx, mdy);
    if (md < 0.12) { e.ti++; return; }
    e.a = Math.atan2(mdy, mdx);
    moveEnt(e, e.a, F.spd * dt);
  }
}

function updWander(e, dt, spd) {
  if (e.daze > 0) { e.daze -= dt; return; }
  e.dirT -= dt;
  const ahead = isSolid(e.x + Math.cos(e.a) * 0.45, e.y + Math.sin(e.a) * 0.45);
  if (e.dirT <= 0 || ahead) {
    const opts = [0, Math.PI / 2, -Math.PI / 2, Math.PI].filter(a => !isSolid(e.x + Math.cos(a) * 0.45, e.y + Math.sin(a) * 0.45));
    if (opts.length) e.a = rnd(opts);
    e.dirT = 1 + Math.random() * 2;
  }
  moveEnt(e, e.a, spd * dt);
}

// ================= Update =================
function updateSeen() {
  const px = pl.x | 0, py = pl.y | 0, R = Math.max(3, Math.ceil(visionRange()));
  const vis = new Uint8Array(rows * cols);
  for (let y = py - R; y <= py + R; y++) for (let x = px - R; x <= px + R; x++) {
    if (x < 0 || y < 0 || x >= cols || y >= rows) continue;
    if (grid[y][x] !== 0) continue;
    const cx = x + 0.5, cy = y + 0.5, d = Math.hypot(cx - pl.x, cy - pl.y);
    if (d > R) continue;
    if (los(pl.x, pl.y, cx, cy)) { seen[y * cols + x] = 1; vis[y * cols + x] = 1; }
  }
  // muros adjacentes a chão visível também ficam revelados (senão o minimapa não dá pra ler)
  for (let y = py - R - 1; y <= py + R + 1; y++) for (let x = px - R - 1; x <= px + R + 1; x++) {
    if (x < 0 || y < 0 || x >= cols || y >= rows) continue;
    if (grid[y][x] === 0 || seen[y * cols + x]) continue;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
      if (vis[ny * cols + nx]) { seen[y * cols + x] = 1; break; }
    }
  }
}

function update(dt) {
  if (state === 'arrested') {
    arrestT -= dt;
    if (arrestT <= 0) {
      pl.x = startX; pl.y = startY;
      pl.fuel = Math.max(5, pl.fuel - 8 - F.f);
      grace = 3;
      state = 'playing';
      msg('De volta ao seu soltão... tome cuidado. ⛓️');
    }
    return;
  }
  if (state !== 'playing') return;

  if (introT > 0) introT -= dt;
  else {
    const rot = ((keys.KeyA || keys.ArrowLeft) ? -1 : 0) + ((keys.KeyD || keys.ArrowRight) ? 1 : 0);
    pl.a += rot * 2.8 * dt;
    const mv = ((keys.KeyW || keys.ArrowUp) ? 1 : 0) + ((keys.KeyS || keys.ArrowDown) ? -1 : 0);
    if (mv) moveEnt(pl, pl.a, (mv > 0 ? 3.1 : 1.6) * dt, 0.28);
  }

  // recursos
  pl.fuel = Math.max(0, pl.fuel - F.drain * dt);
  pl.disp = Math.min(100, pl.disp + 1.6 * dt);
  pl.punchCd -= dt; pl.punchT -= dt; grace -= dt; doorMsgCd -= dt;
  if (pl.fuel < 20 && !warnFuel) { warnFuel = true; msg('Sua lamparina está quase apagando! Ache mais luz 🕯️'); }

  // itens
  for (const it of items) {
    if (it.taken) continue;
    if (Math.hypot(pl.x - it.x, pl.y - it.y) < 0.45) {
      it.taken = true;
      if (it.t === 'key') { pl.hasKey = true; sfx.key(); msg('Você achou a CHAVE! 🔑 Agora encontre a porta verde! 🚪'); }
      if (it.t === 'lamp') {
        const antes = pl.fuel;
        pl.fuel = Math.min(100, pl.fuel + 55);
        warnFuel = false; sfx.lamp();
        msg('Lamparina coletada! 🕯️ +' + Math.round(pl.fuel - antes) + ' de luz — visão bem ampliada!');
      }
      if (it.t === 'chain') {
        chainsFloor++;
        points += 100;
        sfx.chain();
        if (chainsFloor >= 3) { points += 300; msg('Cadeia completa! ⛓️⛓️⛓️ +400 pts — bônus do andar!'); }
        else msg('Elo de corrente! ⛓️ +100 pts (' + chainsFloor + '/3 — complete os 3 p/ bônus!)');
      }
      if (it.t === 'food') { pl.disp = Math.min(100, pl.disp + 18); sfx.food(); msg('Comida! Disposição recuperada. 🍞'); }
      if (it.t === 'map') {
        seen.fill(1);
        for (const i2 of items) i2.seen = true;
        sfx.key();
        msg('Mapa do presídio! 🗺️ O andar inteiro está no minimapa!');
      }
    }
  }

  // inimigos + contato
  for (const e of enemies) {
    e.bumpCd -= dt;
    if (e.kind === 'police') updPolice(e, dt);
    else updWander(e, dt, e.kind === 'rat' ? 1.0 + F.f * 0.05 : 0.85);
    if (state !== 'playing') break;
    if (e.daze <= 0) {
      const d = Math.hypot(pl.x - e.x, pl.y - e.y);
      if (d < 0.55) {
        if (e.bumpCd <= 0) {
          e.bumpCd = 1;
          pl.disp = Math.max(0, pl.disp - (e.kind === 'rat' ? 3 : 4));
          sfx.bite();
          msg(e.kind === 'rat' ? 'O rato te mordeu! 🐀' : 'Outro preso te agrediu! 🧍');
        }
        moveEnt(e, Math.atan2(e.y - pl.y, e.x - pl.x), 0.1);
      }
    }
  }

  // porta de saída
  {
    const d = Math.hypot(pl.x - (door.x + 0.5), pl.y - (door.y + 0.5));
    if (d < 0.95) {
      if (pl.hasKey) { nextFloor(); return; }
      else if (doorMsgCd <= 0) { doorMsgCd = 1.5; sfx.locked(); msg('Trancada! Você precisa da chave. 🔒'); }
    }
  }

  seenT -= dt;
  if (seenT <= 0) { seenT = 0.12; updateSeen(); }
  msgT -= dt;
}

// ================= Render (visão top-down) =================
const TILE = 22;
function visionRange() { return 2.2 + 5.8 * (pl.fuel / 100); }

// máscara de escuridão (o polígono de luz é cortado com ray casting)
const mask = document.createElement('canvas');
mask.width = W * 2; mask.height = H * 2;
const mctx = mask.getContext('2d');
mctx.scale(2, 2);

function render(t) {
  const vision = visionRange();
  let fl = 1;
  if (pl.fuel <= 0) fl = 0.5;
  else if (pl.fuel < 20) fl = 0.75 + 0.25 * Math.sin(t * 20) * Math.sin(t * 7.3);

  const ox = W / 2 - pl.x * TILE, oy = H / 2 - pl.y * TILE;
  const X = v => v * TILE + ox, Y = v => v * TILE + oy;

  // fundo
  ctx.fillStyle = '#050409'; ctx.fillRect(0, 0, W, H);

  // chão, muros e porta de saída
  const x0 = Math.max(0, Math.floor(-ox / TILE)), x1 = Math.min(cols - 1, Math.floor((W - ox) / TILE));
  const y0 = Math.max(0, Math.floor(-oy / TILE)), y1 = Math.min(rows - 1, Math.floor((H - oy) / TILE));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const c = grid[y][x], sx = X(x), sy = Y(y);
    if (c === 1) {
      ctx.fillStyle = '#3d3358';
      ctx.fillRect(sx, sy, TILE, TILE);
      ctx.fillStyle = 'rgba(255,255,255,.07)';
      ctx.fillRect(sx, sy, TILE, 3);
    } else if (c === 3) {
      ctx.fillStyle = '#123527';
      ctx.fillRect(sx, sy, TILE, TILE);
      ctx.fillStyle = `rgba(47,209,138,${(0.55 + 0.3 * Math.sin(t * 4)).toFixed(2)})`;
      ctx.fillRect(sx + 2, sy + 2, TILE - 4, TILE - 4);
    } else {
      ctx.fillStyle = '#191527';
      ctx.fillRect(sx, sy, TILE, TILE);
    }
  }

  // itens e inimigos (só os dentro do raio de luz e com linha de visão)
  for (const it of items) {
    if (it.taken) continue;
    const d = Math.hypot(it.x - pl.x, it.y - pl.y);
    if (d > vision || !los(pl.x, pl.y, it.x, it.y)) continue;
    const sx = X(it.x) + TILE / 2, sy = Y(it.y) + TILE / 2;
    ctx.font = TILE * 0.62 + 'px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(it.t === 'key' ? '🔑' : it.t === 'lamp' ? '🕯️' : it.t === 'map' ? '🗺️' : it.t === 'chain' ? '⛓️' : '🍞', sx, sy + 5);
  }
  for (const e of enemies) {
    const d = Math.hypot(e.x - pl.x, e.y - pl.y);
    if (d > vision || !los(pl.x, pl.y, e.x, e.y)) continue;
    const sx = X(e.x) + TILE / 2, sy = Y(e.y) + TILE / 2;
    if (e.kind === 'police') e.seen = true;
    if (e.daze > 0) {
      ctx.globalAlpha = 0.6;
      ctx.font = TILE * 0.6 + 'px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('😵', sx, sy + 5);
      ctx.globalAlpha = 1;
      continue;
    }
    // cone de visão da polícia (dica de perigo)
    if (e.kind === 'police') {
      ctx.fillStyle = 'rgba(255,60,60,.10)';
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.arc(sx, sy, F.vis * TILE, e.a - F.cone, e.a + F.cone);
      ctx.closePath(); ctx.fill();
    }
    ctx.font = (e.kind === 'rat' ? 0.55 : 0.7) * TILE + 'px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(e.kind === 'police' ? '👮' : e.kind === 'rat' ? '🐀' : '🧍', sx, sy + 5);
  }

  // jogador
  {
    const sx = X(pl.x), sy = Y(pl.y);
    ctx.fillStyle = 'rgba(120,220,255,.18)';
    ctx.beginPath(); ctx.arc(sx, sy, TILE * 0.55, 0, TAU); ctx.fill();
    ctx.font = TILE * 0.8 + 'px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('🧑', sx, sy + 5);
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sx, sy);
    ctx.lineTo(sx + Math.cos(pl.a) * TILE * 0.7, sy + Math.sin(pl.a) * TILE * 0.7);
    ctx.stroke();
  }

  // ===== escuridão: polígono de luz via ray casting =====
  mctx.globalCompositeOperation = 'source-over';
  mctx.clearRect(0, 0, W, H);
  mctx.fillStyle = 'rgba(0,0,0,0.92)';
  mctx.fillRect(0, 0, W, H);
  mctx.globalCompositeOperation = 'destination-out';
  const px = X(pl.x), py = Y(pl.y);
  const R = Math.max(vision * 1.18, vision * 0.7 + 1.6) * TILE * (0.98 + 0.02 * Math.sin(t * 2.1));
  const N = 240, maxR = vision * 1.02;
  mctx.beginPath();
  mctx.moveTo(px, py);
  for (let i = 0; i <= N; i++) {
    const a = (i / N) * TAU;
    const r = castRay(pl.x, pl.y, Math.cos(a), Math.sin(a), maxR);
    const d = Math.min(r.d, maxR);
    mctx.lineTo(px + Math.cos(a) * d * TILE, py + Math.sin(a) * d * TILE);
  }
  mctx.closePath();
  const lg = mctx.createRadialGradient(px, py, 0, px, py, R);
  lg.addColorStop(0, `rgba(255,255,255,${fl})`);
  lg.addColorStop(0.6, `rgba(255,255,255,${fl * 0.85})`);
  lg.addColorStop(1, 'rgba(255,255,255,0)');
  mctx.fillStyle = lg;
  mctx.fill();
  // núcleo de luz mais forte
  mctx.beginPath(); mctx.arc(px, py, R * 0.5, 0, TAU);
  const lg2 = mctx.createRadialGradient(px, py, 0, px, py, R * 0.5);
  lg2.addColorStop(0, 'rgba(255,255,255,1)'); lg2.addColorStop(1, 'rgba(255,255,255,0)');
  mctx.fillStyle = lg2;
  mctx.fill();
  ctx.drawImage(mask, 0, 0, W, H);

  // aviso: tela fica levemente vermelha quando a polícia se aproxima (chance de fugir)
  let nearP = Infinity;
  for (const e of enemies) if (e.kind === 'police' && e.daze <= 0)
    nearP = Math.min(nearP, Math.hypot(e.x - pl.x, e.y - pl.y));
  if (nearP < 5 && state === 'playing') {
    const a = (1 - nearP / 5) * (0.26 + 0.06 * Math.sin(t * 9));
    const rg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.78);
    rg.addColorStop(0, 'rgba(255,30,30,0)');
    rg.addColorStop(1, 'rgba(255,30,30,' + a.toFixed(3) + ')');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);
  }

  // lamparinas e mapas brilham fracamente mesmo no escuro (ajuda a achá-los)
  for (const it of items) {
    if (it.taken || (it.t !== 'lamp' && it.t !== 'map')) continue;
    const sx = X(it.x) + TILE / 2, sy = Y(it.y) + TILE / 2;
    if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) continue;
    const gc = it.t === 'lamp' ? '255,170,80' : '120,210,255';
    ctx.globalAlpha = 0.22 + 0.08 * Math.sin(t * 3 + it.x * 7);
    const gg = ctx.createRadialGradient(sx, sy, 0, sx, sy, TILE * 1.1);
    gg.addColorStop(0, `rgba(${gc},.8)`); gg.addColorStop(1, `rgba(${gc},0)`);
    ctx.fillStyle = gg;
    ctx.fillRect(sx - TILE * 1.2, sy - TILE * 1.2, TILE * 2.4, TILE * 2.4);
    ctx.globalAlpha = 1;
  }

  // soco
  if (pl.punchT > 0) {
    ctx.font = '24px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('👊', X(pl.x) + Math.cos(pl.a) * 18, Y(pl.y) + Math.sin(pl.a) * 18);
  }

  // HUD
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, 26);
  ctx.font = 'bold 14px system-ui'; ctx.textAlign = 'left';
  ctx.fillStyle = '#ffd24a'; ctx.fillText('ANDAR ' + F.f + '/10', 10, 17);
  let hx = 108;
  if (pl.hasKey) { ctx.fillText('🔑', hx, 17); hx += 22; }
  ctx.fillText('💪', hx, 17);
  bar(hx + 18, 8, 90, 10, pl.disp / 100, pl.disp < 25 ? '#e05555' : '#4fd15f');
  const fx = hx + 118;
  ctx.fillText('🕯️', fx, 17);
  const fuelCol = pl.fuel > 50 ? '#ffcf5e' : pl.fuel > 20 ? '#ff9d4a' : '#e05555';
  bar(fx + 18, 8, 90, 10, pl.fuel / 100, fuelCol);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'right';
  ctx.fillText('⭐' + points, W - 56, 17);
  ctx.fillStyle = '#ff8080';
  ctx.fillText('🚨' + arrests, W - 10, 17);

  drawMinimap();

  // mensagens
  if (msgT > 0) {
    ctx.globalAlpha = Math.min(1, msgT);
    ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    const mw = ctx.measureText(msgTxt).width;
    ctx.fillRect(W / 2 - mw / 2 - 8, 34, mw + 16, 20);
    ctx.fillStyle = '#ffe9a8';
    ctx.fillText(msgTxt, W / 2, 48);
    ctx.globalAlpha = 1;
  }
  if (introT > 0 && state === 'playing') {
    ctx.globalAlpha = Math.min(1, introT);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd24a'; ctx.font = 'bold 34px system-ui';
    ctx.fillText('ANDAR ' + F.f, W / 2, H / 2 - 12);
    ctx.fillStyle = '#e8defc'; ctx.font = '14px system-ui';
    ctx.fillText(F.f === 1 ? 'Andar tranquilo... por enquanto 😌' : 'Ache a chave 🔑 e a porta verde 🚪', W / 2, H / 2 + 14);
    ctx.globalAlpha = 1;
  }
  if (state === 'arrested') {
    ctx.fillStyle = 'rgba(200,30,30,' + (0.25 + 0.15 * Math.sin(t * 20)) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff'; ctx.font = 'bold 26px system-ui';
    ctx.fillText('🚨 PEGO PELA POLÍCIA!', W / 2, H / 2 - 8);
    ctx.font = '14px system-ui'; ctx.fillStyle = '#ffd0d0';
    ctx.fillText('De volta ao início do andar...', W / 2, H / 2 + 18);
  }
}


function bar(x, y, w, h, f, col) {
  ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = col; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, f)), h);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

function drawMinimap() {
  if (!seen) return;
  const cs = 3, mw = cols * cs, mh = rows * cs, mx = W - mw - 6, my = 34;
  ctx.fillStyle = 'rgba(5,5,12,.72)'; ctx.fillRect(mx - 2, my - 2, mw + 4, mh + 4);
  ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.strokeRect(mx - 2.5, my - 2.5, mw + 5, mh + 5);
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    if (!seen[y * cols + x]) continue;
    const c = grid[y][x];
    ctx.fillStyle = c === 0 ? '#262238' : (c === 3 ? '#2fd18a' : '#4c4670');
    ctx.fillRect(mx + x * cs, my + y * cs, cs, cs);
  }
  for (const it of items) if (it.seen && !it.taken) {
    ctx.fillStyle = it.t === 'key' ? '#ffd24a' : it.t === 'lamp' ? '#ff9d4a' : it.t === 'map' ? '#8fd4ff' : it.t === 'chain' ? '#7fd0ff' : '#ff6b6b';
    ctx.fillRect(mx + it.x * cs - 1, my + it.y * cs - 1, 3, 3);
  }
  for (const e of enemies) if (e.seen && e.kind === 'police') {
    ctx.fillStyle = '#ff4d4d';
    ctx.fillRect(mx + e.x * cs - 1, my + e.y * cs - 1, 3, 3);
  }
  ctx.fillStyle = '#fff';
  ctx.fillRect(mx + pl.x * cs - 2, my + pl.y * cs - 2, 4, 4);
}

// ================= Telas =================
function fmt(ms) {
  const s = Math.round(ms / 1000);
  return (s / 60 | 0) + ':' + String(s % 60).padStart(2, '0');
}

function showMenu() {
  state = 'menu';
  const best = localStorage.getItem('encarcerado-best');
  panel.innerHTML =
    '<h1>🔓 A Fuga</h1>' +
    '<p>Você escapou do seu bloco... mas ainda está preso num <b>presídio-labirinto</b> escuro, com <b>10 andares</b> até a liberdade.</p>' +
    '<ul>' +
    '<li>🕯️ Você começa bem iluminado, mas a <b>escuridão toma conta aos poucos</b>. Colete lamparinas pra renovar a luz!</li>' +
    '<li>🔑 Ache a <b>chave</b> e depois a <b>porta verde</b> pra subir de andar. Cada andar é um labirinto novo.</li>' +
    '<li>👮 A <b>polícia</b> patrulha: se ela te vir, você é <b>preso de volta ao início</b> (e perde luz!).</li>' +
    '<li>🐀🧍 Ratos e outros presos te incomodam. <b>Socar</b> (Espaço/F) resolve, mas cada soco abaixa sua <b>disposição 💪</b>.</li>' +
    '<li>🍞 Comida recupera disposição. Ela também sobe sozinha, devagarinho.</li>' +
    '<li>⭐ Cada andar esconde <b>3 elos de corrente</b> ⛓️: cada um vale <b>+100 pts</b>, e coletar os <b>3 dá bônus de +300 pts</b>!</li>' +
    '<li>🗺️ Todo andar esconde um <b>mapa do presídio</b>: quem achar, vê o andar inteiro no minimapa!</li>' +
    '<li>📈 O 1º andar é tranquilo, mas cada andar seguinte é <b>maior, mais escuro e com mais patrulha</b>. Boa sorte.</li>' +
    '</ul>' +
    '<p class="ctrl">⌨️ <kbd>W A S D</kbd> ou setas para mover · <kbd>Espaço</kbd>/<kbd>F</kbd> socar · clique também soca<br>📱 No celular, use os botões na tela.</p>' +
    '<button class="btn green" id="btnStart">🔓 Começar a fuga</button>' +
    (best ? '<p class="ctrl">🏆 Recorde: ' + fmt(+best) + '</p>' : '');
  overlay.classList.remove('hidden');
  document.getElementById('btnStart').onclick = startGame;
}

function startGame() {
  try { audio().resume(); } catch (e) {}
  overlay.classList.add('hidden');
  floorsDone = 0; arrests = 0; punches = 0; points = 0; chainsFloor = 0;
  pl.disp = 100; pl.fuel = 43; pl.hasKey = false;
  t0 = performance.now();
  setupFloor(1);
  state = 'playing';
}

function winGame() {
  state = 'win';
  totalMs = performance.now() - t0;
  let isNew = false;
  const best = localStorage.getItem('encarcerado-best');
  if (!best || totalMs < +best) { localStorage.setItem('encarcerado-best', totalMs); isNew = true; }
  sfx.win();
  panel.innerHTML =
    '<h1>🏆 VOCÊ ESCAPOU!</h1>' +
    '<p class="big">' + fmt(totalMs) + '</p>' +
    (isNew ? '<p style="color:#8ff0a4;font-weight:700">✨ Novo recorde!</p>' : '<p>🏆 Recorde: ' + fmt(+best) + '</p>') +
    '<p>⭐ Pontos: <b>' + points + '</b></p>' +
    '<p>🚨 Prisas: <b>' + arrests + '</b> · 👊 Socos: <b>' + punches + '</b></p>' +
    '<p>Dez andares, escuridão total, e você saiu vivo. A galera vai ouvir essa. 🕊️</p>' +
    '<button class="btn green" id="btnAgain">🔁 Jogar de novo</button>' +
    '<button class="btn" id="btnMenu">🏠 Menu</button>';
  overlay.classList.remove('hidden');
  document.getElementById('btnAgain').onclick = startGame;
  document.getElementById('btnMenu').onclick = showMenu;
}

// ================= Input =================
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space' || e.code === 'KeyF') punch();
  if (e.code === 'Enter' && state === 'menu') startGame();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
cvs.addEventListener('click', () => punch());

// toques
for (const b of document.querySelectorAll('.tbtn')) {
  const k = b.dataset.k;
  const set = (v) => {
    if (v) {
      if (k === 'L') keys.KeyA = true;
      if (k === 'R') keys.KeyD = true;
      if (k === 'U') keys.KeyW = true;
      if (k === 'D') keys.KeyS = true;
      if (k === 'P') punch();
    } else {
      if (k === 'L') keys.KeyA = false;
      if (k === 'R') keys.KeyD = false;
      if (k === 'U') keys.KeyW = false;
      if (k === 'D') keys.KeyS = false;
    }
  };
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); set(true); });
  b.addEventListener('pointerup', () => set(false));
  b.addEventListener('pointercancel', () => set(false));
}

// ================= Loop =================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state === 'playing' || state === 'arrested') update(dt);
  if (state !== 'menu' || grid) render(now / 1000);
  requestAnimationFrame(frame);
}
showMenu();
requestAnimationFrame(frame);
</script>
</body>
