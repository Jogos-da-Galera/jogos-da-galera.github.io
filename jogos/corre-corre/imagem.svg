<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241243"/>
      <stop offset="1" stop-color="#3b1a6e"/>
    </linearGradient>
    <linearGradient id="titulo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="480" height="300" fill="url(#bg)"/>

  <!-- estrelas -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="40" cy="40" r="2"/><circle cx="120" cy="70" r="1.5"/><circle cx="250" cy="30" r="2"/>
    <circle cx="360" cy="55" r="1.5"/><circle cx="430" cy="35" r="2"/><circle cx="460" cy="90" r="1.5"/>
    <circle cx="80" cy="110" r="1.5"/><circle cx="300" cy="80" r="1.5"/>
  </g>

  <!-- nuvens -->
  <g fill="#ffffff" opacity="0.08">
    <ellipse cx="150" cy="70" rx="50" ry="12"/>
    <ellipse cx="350" cy="110" rx="60" ry="14"/>
  </g>

  <!-- titulo -->
  <text x="240" y="52" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#titulo)">CORRE-CORRE</text>
  <text x="240" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#c9b8e8">pule • abaixe • fuja!</text>

  <!-- vento -->
  <g stroke="#e879f9" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="18" y1="215" x2="58" y2="215"/>
    <line x1="10" y1="232" x2="48" y2="232"/>
    <line x1="24" y1="249" x2="60" y2="249"/>
  </g>

  <!-- personagens correndo -->
