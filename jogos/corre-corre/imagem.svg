  <rect x="0" y="240" width="480" height="60" fill="#3d2266"/>
  <rect x="0" y="240" width="480" height="3" fill="#5b3591"/>
  <g fill="#ffffff" opacity="0.15">
    <rect x="30" y="258" width="24" height="2.5"/>
    <rect x="140" y="258" width="24" height="2.5"/>
    <rect x="250" y="258" width="24" height="2.5"/>
    <rect x="360" y="258" width="24" height="2.5"/>
    <rect x="460" y="258" width="24" height="2.5"/>
