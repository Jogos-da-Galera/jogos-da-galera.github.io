    <rect x="18" y="-13" width="9" height="13" fill="#22242c"/>
    <rect x="3" y="-7" width="11" height="7" fill="#111"/>
    <rect x="17" y="-3" width="11" height="3" fill="#111"/>
    <rect x="2" y="-42" width="26" height="26" rx="7" fill="#3a3f4a"/>
