    <rect x="-6" y="-47" width="18" height="3" fill="#8a5c33"/>
    <rect x="4" y="-18" width="9" height="18" fill="#2b3245"/>
    <rect x="18" y="-14" width="9" height="14" fill="#2b3245"/>
