    <rect x="0" y="-22" width="12" height="7" rx="2" fill="#2563eb"/>
    <rect x="18" y="-22" width="12" height="7" rx="2" fill="#2563eb"/>
    <rect x="6" y="-27" width="6" height="5" fill="#ef4444"/>
    <rect x="14" y="-27" width="6" height="5" fill="#60a5fa"/>
    <circle cx="7" cy="-2" r="4" fill="#0f172a"/>
    <circle cx="23" cy="-2" r="4" fill="#0f172a"/>
