  <g transform="translate(95 240)">
    <ellipse cx="-14" cy="-14" rx="12" ry="8" fill="#357944" transform="rotate(30)"/>
    <rect x="0" y="-20" width="10" height="20" fill="#357944"/>
    <rect x="14" y="-16" width="10" height="16" fill="#357944"/>
    <rect x="-4" y="-52" width="32" height="34" rx="10" fill="#3e8e4e"/>
    <rect x="8" y="-44" width="16" height="24" rx="8" fill="#c8e6a0"/>
    <g fill="#7ec8e3">
      <path d="M-2 -48 l5 -12 l5 12 z"/><path d="M8 -48 l5 -12 l5 12 z"/><path d="M18 -48 l5 -12 l5 12 z"/>
    </g>
    <rect x="22" y="-64" width="28" height="18" rx="7" fill="#3e8e4e"/>
    <circle cx="42" cy="-57" r="3.5" fill="#fff"/>
    <circle cx="43" cy="-57" r="1.8" fill="#111"/>
  </g>

  <!-- ninjazinho -->
  <g transform="translate(200 240)">
    <rect x="2" y="-18" width="9" height="18" fill="#f2a20c"/>
    <rect x="16" y="-14" width="9" height="14" fill="#f2a20c"/>
    <rect x="1" y="-7" width="11" height="7" fill="#fff"/>
    <rect x="15" y="-3" width="11" height="3" fill="#fff"/>
    <rect x="0" y="-40" width="28" height="24" rx="7" fill="#f2790f"/>
    <rect x="13" y="-40" width="3" height="24" fill="#e8e8e8"/>
    <circle cx="14" cy="-48" r="10" fill="#ffd9b3"/>
    <path d="M4 -50 l4 -14 l4 10 l4 -14 l4 10 l4 -12 l3 8 l2 6 l-22 0 z" fill="#ffd94a"/>
