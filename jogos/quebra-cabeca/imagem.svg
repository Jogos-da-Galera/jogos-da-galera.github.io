<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#3b1a6e"/>
      <stop offset="100%" stop-color="#120821"/>
    </radialGradient>
  </defs>

  <rect width="480" height="300" fill="url(#bg)"/>

  <!-- grade de peças 2x2 -->
  <g>
    <!-- peça 1: minhoquinha -->
    <rect x="58" y="48" width="150" height="100" rx="14" fill="#86efac"/>
    <text x="133" y="115" font-size="64" text-anchor="middle">🐍</text>

    <!-- peça 2: espaço (levantanada, fora do lugar) -->
    <g transform="translate(272 40) rotate(-8 75 50)">
      <rect x="0" y="0" width="150" height="100" rx="14" fill="#1e1b4b" stroke="#a78bfa" stroke-width="3"/>
      <text x="75" y="67" font-size="58" text-anchor="middle">🚀</text>
    </g>

    <!-- peça 3: frutas -->
    <rect x="58" y="162" width="150" height="100" rx="14" fill="#fde047"/>
    <text x="133" y="229" font-size="64" text-anchor="middle">🍒</text>

    <!-- peça 4: natal -->
    <rect x="222" y="162" width="150" height="100" rx="14" fill="#1e3a8a"/>
    <text x="297" y="229" font-size="64" text-anchor="middle">🎅</text>

    <!-- "furinho" onde a peça 2 está -->
    <rect x="222" y="48" width="150" height="100" rx="14" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="10 8" opacity="0.7"/>
  </g>

  <!-- setinhas de troca -->
  <text x="214" y="150" font-size="30" text-anchor="middle">🔄</text>

  <text x="240" y="288" font-size="17" font-weight="bold" fill="#c4b5fd" text-anchor="middle" font-family="sans-serif">4 níveis • 20 imagens</text>
</svg>
